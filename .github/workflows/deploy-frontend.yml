name: Deploy frontend to Azure

# Se dispara con cada push a main que toque el frontend (o este workflow),
# y también se puede correr a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  id-token: write   # necesario para el login OIDC (sin secretos de larga vida)
  contents: read
  packages: write   # push de la imagen a GHCR

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login a Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build de la imagen del frontend EN el runner. La URL de la API va
      # RELATIVA (/api/v1) porque el frontend se sirve detrás del gateway (mismo
      # origen): el gateway rutea /api/v1 al backend. NO usar la URL absoluta
      # del backend, que es internal (inaccesible directo desde el navegador)
      # → rompería la app.
      - name: Build imagen base
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/frontend:${{ github.sha }} \
            --build-arg VITE_API_BASE_URL=/api/v1 \
            --target production ./frontend

      # Variante para Azure: nginx SIN el proxy de prod (que apunta a un host
      # inexistente acá). Parte de la imagen base recién construida (está en el
      # daemon local del runner). DEUDA: parametrizar el nginx en el repo para
      # no duplicar esto (queda para la limpieza de la Fase 4).
      - name: Build variante Azure (nginx sin proxy)
        run: |
          mkdir -p azure-build
          cat > azure-build/default.conf <<'NGINX'
          server {
              listen 80;
              absolute_redirect off;
              root /usr/share/nginx/html;
              index index.html;
              location /cotizaciones/ { try_files $uri $uri/ /cotizaciones/index.html; }
              location = / { return 302 /cotizaciones/; }
          }
          NGINX
          cat > azure-build/Dockerfile <<DOCKER
          FROM ghcr.io/${{ github.repository_owner }}/frontend:${{ github.sha }}
          COPY default.conf /etc/nginx/conf.d/default.conf
          DOCKER
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/frontend:${{ github.sha }}-azure \
            ./azure-build

      # Las MISMAS imágenes van a los dos registries mientras dura la migración
      # de registry: GHCR (destino) y ACR (del que las apps deployan hoy).
      # Cuando las apps pasen a GHCR y el ACR se apague, el push al ACR se
      # elimina.
      - name: Push a GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/frontend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/frontend:${{ github.sha }}-azure

      - name: Push al ACR (transitorio)
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          for TAG in "${{ github.sha }}" "${{ github.sha }}-azure"; do
            docker tag "ghcr.io/${{ github.repository_owner }}/frontend:$TAG" \
              "${{ secrets.ACR_NAME }}.azurecr.io/frontend:$TAG"
            docker push "${{ secrets.ACR_NAME }}.azurecr.io/frontend:$TAG"
          done

      - name: Desplegar al Container App
        run: |
          az containerapp update -n frontend -g ${{ secrets.RG_NAME }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/frontend:${{ github.sha }}-azure
