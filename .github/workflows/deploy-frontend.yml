name: Deploy frontend to Azure

# Se dispara con cada push a main que toque el frontend (o este workflow),
# y también se puede correr a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  id-token: write   # necesario para el login OIDC (sin secretos de larga vida)
  contents: read
  packages: write   # push de la imagen a GHCR

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v7

      - name: Login a Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build de la imagen del frontend EN el runner. La URL de la API va
      # RELATIVA (/api/v1) porque el mismo nginx que sirve la SPA proxea esa
      # ruta al backend, así que para el navegador es el mismo origen. NO usar
      # la URL absoluta del backend, que es internal (inaccesible directo desde
      # el navegador) → rompería la app.
      - name: Build imagen base
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/frontend:${{ github.sha }} \
            --build-arg VITE_API_BASE_URL=/api/v1 \
            --target production ./frontend

      # Variante para Azure. El nginx del repo apunta a nombres de contenedor que
      # en Container Apps no existen, así que acá se escribe el suyo.
      #
      # Desde el retiro del gateway esta imagen es la ÚNICA pública: sirve la SPA
      # y ADEMÁS proxea /api/v1 al backend. Sin ese bloque la aplicación carga y
      # ninguna petición funciona, que es el peor modo de falla: la pantalla se
      # ve bien y nada anda.
      #
      # Va como PLANTILLA (no directo a conf.d) porque el sufijo de los FQDN
      # internos entra por la env var INTERNAL_SUFFIX, que Terraform inyecta.
      # nginx la sustituye al arrancar. Es el mismo mecanismo que usaba el
      # gateway.
      #
      # DEUDA: el mismo server vive en TRES lugares y hay que tocarlos juntos:
      # frontend/nginx.conf (horneado en la imagen), deploy/staging/nginx-staging.conf
      # (montado encima de esa conf en staging) y esta plantilla, que es la de
      # producción. Parametrizarlo en el repo evitaría las tres copias.
      - name: Build variante Azure (sirve la SPA y proxea la API)
        run: |
          mkdir -p azure-build
          cat > azure-build/default.conf.template <<'NGINX'
          server {
              listen 80;
              absolute_redirect off;
              root /usr/share/nginx/html;
              index index.html;

              # La API, por HTTPS contra el ingress interno del backend.
              location /api/v1/ {
                  proxy_pass https://backend.${INTERNAL_SUFFIX};
                  proxy_ssl_server_name on;
                  proxy_set_header Host backend.${INTERNAL_SUFFIX};
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
              # Sin la barra final caería en `location /`, que sirve el documento
              # de la SPA en vez de proxear. El 308 preserva método y cuerpo.
              location = /api/v1 { return 308 /api/v1/; }

              # Los assets llevan un hash del contenido en el nombre: esa URL nunca
              # cambia de contenido y se puede guardar un año sin preguntar.
              location /assets/ {
                  try_files $uri =404;
                  add_header Cache-Control "public, max-age=31536000, immutable";
              }

              # La SPA se sirve desde la raíz. Hasta la mudanza de 2026-09 vivía bajo
              # /cotizaciones, heredado de la convivencia con la v1; las rutas viejas
              # no tienen redirección acá, las resuelve la aplicación mandando a cada
              # rol a su pantalla principal. `no-cache` obliga a revalidar el
              # documento, y con el ETag eso cuesta un 304.
              location / {
                  try_files $uri $uri/ /index.html;
                  add_header Cache-Control "no-cache";
              }
          }
          NGINX
          cat > azure-build/Dockerfile <<DOCKER
          FROM ghcr.io/${{ github.repository_owner }}/frontend:${{ github.sha }}
          COPY default.conf.template /etc/nginx/templates/default.conf.template
          DOCKER
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/frontend:${{ github.sha }}-azure \
            ./azure-build

      - name: Push a GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/frontend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/frontend:${{ github.sha }}-azure

      # Deploy: solo cambia la imagen (el pull privado usa el secret
      # ghcr-pull-token ya configurado en la app).
      - name: Desplegar al Container App
        run: |
          az containerapp update -n frontend -g ${{ secrets.RG_NAME }} \
            --image ghcr.io/${{ github.repository_owner }}/frontend:${{ github.sha }}-azure
