<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Scaramutti TMS v2</title>
    <!--
      El color de la barra del navegador en el móvil. NO se declara con dos etiquetas y una
      consulta de preferencia del sistema, que es como suele hacerse: eso sigue al sistema
      operativo y le pasa por encima a lo que el usuario eligió, que es justo lo que este
      tema no hace en ningún otro lado. Lo escribe el script de abajo con el tema ya
      resuelto, y lo vuelve a escribir el proveedor cuando el usuario toca el interruptor.
      El valor es el del fondo de página de cada tema; hay una prueba que lo ata a él.
    -->
    <meta name="theme-color" content="#f8fafc" />
    <!--
      El tema se escribe ANTES de que React monte. Si esto viviera en un efecto, cada carga
      empezaría en claro y corregiría después: un destello blanco, que de noche es justo lo
      que molesta. Es sincrónico y sin dependencias a propósito.

      Repite la precedencia de `themeStorage.ts` (elección guardada, preferencia del sistema,
      claro) porque corre antes de que exista un módulo. Si una cambia, cambian las dos; hay
      una prueba que compara las dos fuentes para que no se separen.
    -->
    <script>
      (function () {
        try {
          var elegido = null
          try {
            elegido = window.localStorage.getItem('scaramutti.theme')
          } catch (e) {
            // Un almacenamiento bloqueado no es una elección: se sigue de largo hacia la
            // preferencia del sistema, igual que el módulo. Si este catch abarcara también al
            // `matchMedia`, quien navega con el almacenamiento bloqueado y el sistema en oscuro
            // recibiría la primera pintura en claro y una corrección al montar, que es
            // exactamente el destello que este script existe para evitar.
          }
          var tema =
            elegido === 'light' || elegido === 'dark'
              ? elegido
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', tema)
          var barra = document.querySelector('meta[name="theme-color"]')
          if (barra) barra.setAttribute('content', tema === 'dark' ? '#0b1626' : '#f8fafc')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
