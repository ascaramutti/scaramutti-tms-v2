server {
    listen 80;

    # Redirects RELATIVOS: nginx no conoce el puerto externo (8085 del gateway
    # en integración, 8080 del frontend v2 en acceso directo) y los 302
    # absolutos lo perdían. El browser resuelve contra el host:puerto actual.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Los assets llevan un hash del contenido en el nombre, así que una de esas
    # URLs nunca cambia de contenido: se puede guardar un año sin volver a
    # preguntar. Va antes por legibilidad; nginx elige por prefijo más largo.
    location /cotizaciones/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # La SPA vive bajo /cotizaciones/ (Vite base) — convivencia con v1 detrás
    # del gateway. El Dockerfile copia el dist a html/cotizaciones/ para que
    # el filesystem coincida con las URLs.
    #
    # El documento sí cambia con cada despliegue, y hasta la v2.5.0 se servía sin
    # ninguna cabecera de caché: el navegador decidía solo y una versión nueva
    # podía no llegar sin recarga forzada. `no-cache` no prohíbe guardarlo, obliga
    # a revalidarlo; con el ETag que nginx ya manda, revalidar cuesta un 304.
    # Cubre también las rutas de la SPA, que caen acá por el try_files.
    location /cotizaciones/ {
        try_files $uri $uri/ /cotizaciones/index.html;
        add_header Cache-Control "no-cache";
    }

    # Cortesía: la raíz redirige al módulo (cubre el acceso directo por el
    # hostname de v2 durante la transición; detrás del gateway la raíz es v1).
    location = / {
        return 302 /cotizaciones/;
    }

    # Cortesía de transición: bookmarks viejos a las rutas pre-/cotizaciones
    location = /login {
        return 302 /cotizaciones/login;
    }
    location = /cuenta/cambiar-contrasena {
        return 302 /cotizaciones/cuenta/cambiar-contrasena;
    }

    # Proxy al backend Quarkus
    location /api/ {
        proxy_pass http://scaramutti-tms-v2-backend-prod:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
