# =============================================================================
# Scaramutti TMS - Backend (Quarkus)
# =============================================================================

# --- HTTP -------------------------------------------------------------------
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS}
# ETag debe exponerse para que el browser (axios) pueda leerlo y reenviarlo como If-Match en el
# PUT (optimistic locking). Sin esto, CORS oculta el header al JS y el editar falla con 412.
quarkus.http.cors.exposed-headers=ETag

# --- API base path ----------------------------------------------------------
quarkus.http.root-path=/api/v1

# --- DB ---------------------------------------------------------------------
# TODAS las env vars son obligatorias (sin defaults). Definir en `.env`
# (dev local) o como env vars reales del sistema (prod).
# Ver `.env.example` para la lista completa; los valores que usan los tests
# viven en el bloque `%test.` del final de este archivo.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_JDBC_URL}
quarkus.datasource.jdbc.max-size=16
# Espera maxima por una conexion del pool. Se declara explicitamente (es el default de Agroal)
# porque el tope del lock de edicion tiene que quedar por debajo, y la guarda que lo verifica
# la lee de aca.
quarkus.datasource.jdbc.acquisition-timeout=5s

# --- Flyway -----------------------------------------------------------------
# El schema lo gestiona Flyway (cadena en db/migration/, V001 = foto de prod).
# Prod y dev ya fueron baselineadas (2026-07-07); staging hereda la historia del dump de prod.
# baseline-on-migrate se retiro a proposito: una DB no-vacia sin flyway_schema_history ahora
# FALLA ruidosamente en vez de adoptarse en silencio (proteccion contra apuntar a la DB equivocada).
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.schemas=public,cotizaciones,almacen,operaciones

# --- Hibernate ORM ----------------------------------------------------------
# El schema lo gestiona Flyway (ver arriba), no Hibernate. NUNCA usar update/create-drop en prod.
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# --- OpenAPI / Swagger UI ---------------------------------------------------
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger
quarkus.swagger-ui.theme=original
# La spec runtime se sirve EXCLUSIVAMENTE desde META-INF/openapi.yaml (single source).
# Desactivamos el scan de anotaciones JAX-RS para evitar paths duplicados (con y sin
# /api/v1) y schemas autogenerados que no coinciden con el contrato.
mp.openapi.scan.disable=true

# --- JWT (RS256) ------------------------------------------------------------
# En prod, montar las keys como secret/volume y apuntar las env vars al path real.
# Verificacion (validar tokens entrantes) - usa la clave publica
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}
mp.jwt.verify.issuer=scaramutti-tms
mp.jwt.verify.audiences=scaramutti-tms-app

# Emision (crear tokens al hacer login) - usa la clave privada
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}
smallrye.jwt.new-token.issuer=scaramutti-tms
smallrye.jwt.new-token.audience=scaramutti-tms-app

# Lifespans en segundos.
smallrye.jwt.new-token.lifespan=${ACCESS_TOKEN_LIFESPAN_SECONDS}
app.jwt.refresh-token-lifespan-seconds=${REFRESH_TOKEN_LIFESPAN_SECONDS}

# --- Security (HTTP authn/authz) --------------------------------------------
# Politica por default: denegar todo dentro de /api/v1/*. Endpoints publicos se listan aca.
# Nota 1: las paths se evaluan contra el URL completo (incluyendo el root-path /api/v1).
# Nota 2: /openapi y /swagger viven en root (fuera de /api/v1/*), por eso no entran al filtro.
quarkus.http.auth.proactive=false
quarkus.http.auth.permission.public-paths.paths=/api/v1/auth/login,/api/v1/auth/refresh,/api/v1/q/health,/api/v1/q/health/*
quarkus.http.auth.permission.public-paths.policy=permit
quarkus.http.auth.permission.protected-paths.paths=/api/v1/*
quarkus.http.auth.permission.protected-paths.policy=authenticated

# --- Operations -------------------------------------------------------------
# Ventana anti doble-click backend (segundos). Si llega un POST identico (mismo
# usuario + cliente + ruta) dentro de este lapso → 409 OPS-007.
app.operations.anti-duplicate-window-seconds=30

# Espera maxima (segundos) por el lock de fila que toma la edicion de un servicio. Sin tope,
# PostgreSQL espera para SIEMPRE: un lock retenido inmoviliza un hilo y una conexion del pool
# por cada request en espera, y el pool es COMPARTIDO con cotizaciones y almacen. Con tope, la
# espera larga muere sola en vez de llevarse la API entera. Tiene que quedar POR DEBAJO del
# tiempo que el pool espera para entregar una conexion (5s por defecto en Agroal): si fuera al
# reves, los otros modulos se quedarian sin conexion antes de que los que esperan se rindan.
# Dos personas editando el mismo viaje se serializan en milisegundos, asi que 2s sobra.
app.operations.edit-lock-timeout-seconds=2

# --- Quotations -------------------------------------------------------------
# Ventana anti doble-click backend (segundos). Si llega un POST identico (mismo
# usuario + cliente + set de serviceTypeIds) dentro de este lapso → 409 QUO-002.
app.quotations.anti-duplicate-window-seconds=30
# IGV por defecto cuando el request no lo trae a nivel item (porcentaje).
app.quotations.default-igv-percentage=18.00
# Validez por defecto sugerida al frontend para precargar el wizard (dias).
# Expuesto via GET /quotations/config — cambiarlo aca refleja en el wizard
# sin redeploy (solo restart o live-reload de Quarkus).
app.quotations.default-validity-days=15

# --- Logging ----------------------------------------------------------------
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO
quarkus.log.category."com.scaramutti".level=DEBUG

# --- Produccion (perfil prod) -----------------------------------------------
%prod.quarkus.hibernate-orm.log.sql=false
%prod.quarkus.log.category."com.scaramutti".level=INFO

# --- Test (perfil test) -----------------------------------------------------
# Valores que usan los tests (`mvn test`). Van en este application.properties
# BASE porque un `application-{perfil}.properties` solo se activa si existe un
# `application.properties` base en la misma ubicacion; `src/test/resources/` no
# lo tiene, asi que un `application-test.properties` ahi seria config muerta (el
# arranque caeria a los ${VAR} sin resolver). Son valores de test, no secretos,
# y el perfil test nunca corre en prod. Reemplazan a los ${VAR} en ese perfil,
# por eso el CI no necesita ni `.env` ni env vars.
%test.quarkus.http.cors.origins=http://localhost:5173
%test.quarkus.datasource.username=scaramutti_user
%test.quarkus.datasource.password=dev_local_only
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/scaramutti_tms_dev
%test.mp.jwt.verify.publickey.location=keys/publickey.pem
%test.smallrye.jwt.sign.key.location=keys/privatekey.pem
%test.smallrye.jwt.new-token.lifespan=3600
%test.app.jwt.refresh-token-lifespan-seconds=86400
# El test que comprueba el 409 por lock ocupado tiene que ESPERAR este tope: en 1s mide lo mismo
# que en los 2s de produccion y no alarga la suite.
%test.app.operations.edit-lock-timeout-seconds=1
