      properties:
        id:       { type: integer }
        code:     { type: [string, 'null'], maxLength: 30, example: 'PRO-0012' }
        name:     { type: string, maxLength: 200, example: 'Filtro de aceite XYZ' }
        unitCode: { type: string, maxLength: 10, description: 'Código de la unidad de medida (para pintar cantidades)', example: 'UND' }

    WarehouseOpeningBalanceRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:    { type: integer }
        quantity:     { type: number, minimum: 0, description: 'Puede ser 0 (deja constancia del conteo)' }
        observations: { type: [string, 'null'] }

    WarehouseOpeningBalanceResponse:
      type: object
      required: [id, product, quantity, registeredBy, registeredAt]
      properties:
        id:           { type: integer }
        product:      { $ref: '#/components/schemas/WarehouseProductSummary' }
        quantity:     { type: number, minimum: 0 }
        observations: { type: [string, 'null'] }
        registeredBy: { $ref: '#/components/schemas/UserResponse' }
        registeredAt: { type: string, format: date-time }

    PageOfWarehouseOpeningBalance:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/WarehouseOpeningBalanceResponse' }

    WarehouseRecordStatus:
      type: string
      enum: [ACTIVE, CANCELLED]
      description: |
        Estado de entradas y retiros (columna + CHECK). `CANCELLED` = anulado con
        motivo/quien/cuando; no mueve stock/kardex/reportes pero queda visible.

    WarehouseEditTrace:
      type: object
      description: Rastro del ultimo cambio, derivado del FIELD_EDIT mas reciente en almacen.audit_logs.
      required: [by, at, reason]
      properties:
        by:     { $ref: '#/components/schemas/UserResponse' }
        at:     { type: string, format: date-time }
        reason: { type: string, description: 'Justificacion dada al editar (>= 10 caracteres)' }

    WarehouseInvoiceItemRequest:
      type: object
      required: [productId, quantity, unitPrice]
      properties:
        productId: { type: integer }
        quantity:  { type: number, exclusiveMinimum: 0 }
        unitPrice: { type: number, minimum: 0, description: 'En la moneda de la factura. Puede ser 0 (bonificacion).' }

    WarehousePurchaseInvoiceRequest:
      type: object
      required: [supplierId, invoiceNumber, invoiceDate, currencyId, items]
      properties:
        supplierId:    { type: integer }
        invoiceNumber: { type: string, minLength: 1, maxLength: 50, example: 'F001-00123' }
        invoiceDate:   { type: string, format: date }
        guideNumber:   { type: [string, 'null'], maxLength: 50, description: 'Guia de remision (1 factura -> 1 guia; dato de finanzas)', example: 'T001-0004567' }
        currencyId:    { type: integer, description: 'Fija la moneda de la factura (RN-WH7)' }
        observations:  { type: [string, 'null'] }
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/WarehouseInvoiceItemRequest' }

    WarehousePurchaseInvoiceUpdateRequest:
      type: object
      description: |
        Body del PUT. SIN `supplierId` (el proveedor es INMUTABLE: RN-WH4, proveedor
        equivocado = anular y re-registrar). Los `items` REEMPLAZAN a los existentes.
      required: [invoiceNumber, invoiceDate, currencyId, items, reason]
      properties:
        invoiceNumber: { type: string, minLength: 1, maxLength: 50 }
        invoiceDate:   { type: string, format: date }
        guideNumber:   { type: [string, 'null'], maxLength: 50 }
        currencyId:    { type: integer }
        observations:  { type: [string, 'null'] }
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/WarehouseInvoiceItemRequest' }
        reason: { type: string, minLength: 10, maxLength: 500, description: 'Justificacion de la edicion (RN-WH4). Va a almacen.audit_logs con el diff por campo.' }

    WarehouseCancelRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 500, description: 'Motivo de anulacion (RN-WH3). Va a cancel_reason y a almacen.audit_logs (CANCELLED).' }

    WarehouseInvoiceItemResponse:
      type: object
      required: [id, product, quantity, unitPrice, subtotal]
      properties:
        id:        { type: integer }
        product:   { $ref: '#/components/schemas/WarehouseProductSummary' }
        quantity:  { type: number }
        unitPrice: { type: number }
        subtotal:  { type: number, description: '`quantity * unitPrice`, derivado en codigo, no persistido' }

    WarehousePurchaseInvoiceResponse:
      type: object
      required: [id, supplier, invoiceNumber, invoiceDate, currency, items, total, status, registeredBy, createdAt, updatedAt]
      properties:
        id: { type: integer }
        supplier:
          type: object
          required: [id, name]
          properties:
            id:   { type: integer }
            name: { type: string }
            ruc:  { type: [string, 'null'], pattern: '^\d{11}$' }
        invoiceNumber: { type: string }
        invoiceDate:   { type: string, format: date }
        guideNumber:   { type: [string, 'null'] }
        currency:
          type: object
          required: [id, code, symbol]
          properties:
            id:     { type: integer }
            code:   { type: string, pattern: '^[A-Z]{3}$', example: 'PEN' }
            symbol: { type: string, maxLength: 5, example: 'S/' }
        observations: { type: [string, 'null'] }
        items:
          type: array
          items: { $ref: '#/components/schemas/WarehouseInvoiceItemResponse' }
        total:        { type: number, description: 'Suma de items.subtotal en la moneda de la factura, derivado en codigo, nunca persistido' }
        status:       { $ref: '#/components/schemas/WarehouseRecordStatus' }
        cancelReason: { type: [string, 'null'], description: 'Presente solo si status=CANCELLED' }
        cancelledBy:  { $ref: '#/components/schemas/UserResponse' }
        cancelledAt:  { type: [string, 'null'], format: date-time }
        lastEdit:     { $ref: '#/components/schemas/WarehouseEditTrace' }
        registeredBy: { $ref: '#/components/schemas/UserResponse' }
        createdAt:    { type: string, format: date-time }
        updatedAt:    { type: string, format: date-time, description: 'Source de la version, usar el header ETag opaco en If-Match, NO este valor' }

    WarehousePurchaseInvoiceSummary:
      type: object
      description: Fila del listado de Entradas.
      required: [id, supplier, invoiceNumber, invoiceDate, currencyCode, itemsCount, total, status, registeredBy, createdAt]
      properties:
        id: { type: integer }
        supplier:
          type: object
          required: [id, name]
          properties:
            id:   { type: integer }
            name: { type: string }
        invoiceNumber: { type: string }
        invoiceDate:   { type: string, format: date }
        guideNumber:   { type: [string, 'null'] }
        currencyCode:  { type: string, pattern: '^[A-Z]{3}$' }
        itemsCount:    { type: integer }
        total:         { type: number, description: 'Derivado de los items (no persistido)' }
        status:        { $ref: '#/components/schemas/WarehouseRecordStatus' }
        cancelReason:  { type: [string, 'null'] }
        registeredBy:  { $ref: '#/components/schemas/UserResponse' }
        createdAt:     { type: string, format: date-time }

    PageOfWarehousePurchaseInvoiceSummary:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/WarehousePurchaseInvoiceSummary' }

    # -------- Warehouse: retiros ---------------------------------------------------
    WorkerResponse:
      type: object
      description: Trabajador de public.workers (catalogo compartido con v1, read-only desde v2).
      required: [id, fullName, isActive]
      properties:
        id:       { type: integer }
        fullName: { type: string, example: 'Juan Pérez Huamán' }
        position: { type: [string, 'null'], example: 'Mecánico' }
        isActive: { type: boolean }

    FleetUnitKind:
      type: string
      enum: [TRACTOR, TRAILER, ESCORT]
      description: Subtipo de la flota (disyunto y total). ESCORT = vehiculo escolta.

    FleetUnitRef:
      type: object
      description: Referencia minima a una unidad de flota; la direccion completa es el par (kind, id).
      required: [kind, id, plate]
      properties:
        kind:  { $ref: '#/components/schemas/FleetUnitKind' }
        id:    { type: integer }
        plate: { type: string, minLength: 6, maxLength: 6, example: 'ABC123' }

    FleetUnitResponse:
      description: |
        Unidad de flota unificada (GET /fleet-units). Extiende FleetUnitRef con los
        datos del subtipo. `brand`/`model` pueden ser null (las carretas no los tienen).
      allOf:
        - $ref: '#/components/schemas/FleetUnitRef'
        - type: object
          required: [isActive]
          properties:
            brand:    { type: [string, 'null'], maxLength: 50 }
            model:    { type: [string, 'null'], maxLength: 50 }
            status:
              # Mismo dominio que FleetResourceStatus, inline y admitiendo null: el parser de
              # la spec runtime no soporta el `type: 'null'` suelto que usa el contrato.
              type: [string, 'null']
              enum: [AVAILABLE, MAINTENANCE, NOT_AVAILABLE, null]
              description: 'null en las escoltas: no participan de la asignacion de viajes.'
            isActive: { type: boolean }

    FleetResourceStatus:
      type: string
      enum: [AVAILABLE, MAINTENANCE, NOT_AVAILABLE]
      description: |
        Disponibilidad del recurso (unidad de flota o conductor), en mayusculas
        como el resto de los enums de la API. Donde el recurso puede no tenerla
        (las escoltas), la propiedad se declara admitiendo null.

    DriverRef:
      type: object
      description: |
        Referencia minima a un conductor (public.drivers). El id es el que guarda la
        asignacion del servicio; el nombre sale del trabajador asociado.
      required: [id, fullName]
      properties:
        id:       { type: integer }
        fullName: { type: string, example: 'Juan Pérez Huamán' }

    DriverResponse:
      allOf:
        - $ref: '#/components/schemas/DriverRef'
        - type: object
          required: [licenseNumber, status, isActive]
          properties:
            licenseNumber:   { type: string }
            licenseCategory: { type: [string, 'null'] }
            phone:           { type: [string, 'null'], pattern: '^\d{9}$' }
            status:          { $ref: '#/components/schemas/FleetResourceStatus' }
            isActive:        { type: boolean }

    WarehouseWithdrawalRequest:
      type: object
      description: |
        RN-WH2: `receivedByWorkerId` SIEMPRE obligatorio; unidad destino OPCIONAL y a lo
        sumo UNA (tractorId | trailerId | escortVehicleId, subtipos disyuntos; mas de una
        -> 400 WH-005). `withdrawnAt` lo asigna el server.
      required: [productId, quantity, receivedByWorkerId]
      properties:
        productId:          { type: integer }
        quantity:           { type: number, exclusiveMinimum: 0, description: '> 0 y <= stock disponible (en transaccion -> 409 WH-001)' }
        receivedByWorkerId: { type: integer, description: 'Quien recibe (FK public.workers). Obligatorio.' }
        tractorId:          { type: [integer, 'null'] }
        trailerId:          { type: [integer, 'null'] }
        escortVehicleId:    { type: [integer, 'null'] }
        observations:       { type: [string, 'null'] }

    WarehouseWithdrawalUpdateRequest:
      type: object
      description: |
        Body del PUT. SIN `productId`: el producto es INMUTABLE (RN-WH4, producto equivocado
        = anular y crear otro). La unidad de flota se REEMPLAZA (los tres campos null la
        quitan; a lo sumo una).
      required: [quantity, receivedByWorkerId, reason]
      properties:
        quantity:           { type: number, exclusiveMinimum: 0, description: 'Subirla valida contra el disponible SIN contar este retiro (409 WH-001); bajarla siempre es segura' }
        receivedByWorkerId: { type: integer }
        tractorId:          { type: [integer, 'null'] }
        trailerId:          { type: [integer, 'null'] }
        escortVehicleId:    { type: [integer, 'null'] }
        observations:       { type: [string, 'null'] }
        reason:             { type: string, minLength: 10, maxLength: 500, description: 'Justificacion de la edicion (RN-WH4). Va a `almacen.audit_logs`.' }

    WarehouseWithdrawalResponse:
      type: object
      required: [id, product, quantity, withdrawnAt, receivedBy, status, registeredBy, updatedAt]
      properties:
        id:          { type: integer }
        product:     { $ref: '#/components/schemas/WarehouseProductSummary' }
        quantity:    { type: number }
        withdrawnAt: { type: string, format: date-time, description: 'Lo asigna el server al registrar' }
        receivedBy:  { $ref: '#/components/schemas/WorkerResponse' }
        fleetUnit:   { $ref: '#/components/schemas/FleetUnitRef' }
        observations: { type: [string, 'null'] }
        status:       { $ref: '#/components/schemas/WarehouseRecordStatus' }
        cancelReason: { type: [string, 'null'], description: 'Presente solo si status=CANCELLED' }
        cancelledBy:  { $ref: '#/components/schemas/UserResponse' }
        cancelledAt:  { type: [string, 'null'], format: date-time }
        lastEdit:     { $ref: '#/components/schemas/WarehouseEditTrace' }
        registeredBy: { $ref: '#/components/schemas/UserResponse' }
        updatedAt:    { type: string, format: date-time, description: 'Source de la version, usar el header ETag opaco en If-Match' }

    PageOfWarehouseWithdrawal:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/WarehouseWithdrawalResponse' }

    WarehouseStatsResponse:
      type: object
      description: KPIs del strip de Existencias. Mes calendario en curso (America/Lima); solo ACTIVOS.
      required: [activeProducts, lowStockCount, entriesThisMonth, withdrawalsThisMonth]
      properties:
        activeProducts:       { type: integer }
        lowStockCount:        { type: integer, description: 'Productos activos con stock < minStock (RN-WH11)' }
        entriesThisMonth:     { type: integer, description: 'Facturas ACTIVAS registradas este mes (createdAt)' }
        withdrawalsThisMonth: { type: integer, description: 'Retiros ACTIVOS registrados este mes (withdrawnAt)' }

    WarehouseReportCut:
      type: string
      enum: [BY_UNIT, BY_PERIOD, BY_PRODUCT, BY_SUPPLIER]
      description: |
        Corte del reporte (los 4 de la pantalla Reportes):
        - `BY_UNIT`: consumo por unidad de flota (retiros sin unidad -> "Sin unidad asignada")
        - `BY_PERIOD`: consumo por semana (lunes como clave, en `detail`)
        - `BY_PRODUCT`: consumo por producto (`count` = unidades retiradas)
        - `BY_SUPPLIER`: compras por proveedor (facturas activas por `invoiceDate`)

    WarehouseReportRowResponse:
      type: object
      description: |
        Fila agregada. RN-WH7 bi-moneda SIN conversion: `amountPEN` y `amountUSD`
        acumulan por separado segun la moneda registrada (catalogo activo = PEN + USD).
      required: [label, count, amountPEN, amountUSD]
      properties:
        label:     { type: string, description: 'Etiqueta del grupo (ej: "Tracto ABC123", "Semana del 22/06", producto, proveedor)' }
        detail:    { type: [string, 'null'], description: 'Dato secundario (unidad de medida en BY_PRODUCT, fecha ISO del lunes en BY_PERIOD)' }
        count:     { type: number, description: 'Nro de movimientos (o unidades retiradas en BY_PRODUCT)' }
        amountPEN: { type: number, description: 'Valorizacion de referencia en PEN (salidas: ultimo precio de compra del producto)' }
        amountUSD: { type: number, description: 'Valorizacion de referencia en USD' }

    WarehouseReportResponse:
      type: object
      required: [cut, dateFrom, dateTo, rows, totalPEN, totalUSD, totalCount]
      properties:
        cut:      { $ref: '#/components/schemas/WarehouseReportCut' }
        dateFrom: { type: string, format: date }
        dateTo:   { type: string, format: date }
        rows:
          type: array
          description: 'Orden: BY_PERIOD cronologico ASC; el resto por monto total DESC. Lista vacia si no hubo movimientos (nunca null).'
          items: { $ref: '#/components/schemas/WarehouseReportRowResponse' }
        totalPEN:   { type: number }
        totalUSD:   { type: number }
        totalCount: { type: number }

    # -------- Operations: servicios de transporte ------------------------------
    ServiceStatus:
      type: string
      enum: [PENDING_ASSIGNMENT, PENDING_START, IN_PROGRESS, COMPLETED, CANCELLED, DELETED]
      description: |
        Ciclo de vida del servicio:
        `PENDING_ASSIGNMENT → PENDING_START → IN_PROGRESS → COMPLETED`;
        `CANCELLED` desde cualquiera de los tres no terminales; `DELETED` solo desde
        los dos pendientes. El alta siempre nace en `PENDING_ASSIGNMENT`; las transiciones
        las pide `POST /services/{id}/status`, que además REABRE un viaje cancelado o eliminado
        y lo devuelve al estado que tenía.

    TripScope:
      type: string
      enum: [LOCAL, PROVINCIA]
      description: |
        Ámbito del viaje. Dominio cerrado sin catálogo administrable: viaja como enum
        y la base de datos lo fija con una restricción, igual que el estado. No hay
        endpoint de ámbitos — el selector de la interfaz sale de este enum.

    ServiceEventType:
      type: string
      enum: [CREATED, ASSIGNMENT, STATUS_CHANGE, FIELD_EDIT, NOTE]
      description: |
        Tipo de la entrada de bitácora, para que la interfaz la muestre con su
        etiqueta sin interpretar el texto.

        `ASSIGNMENT` cubre TANTO la asignación de los recursos principales COMO los
        refuerzos sumados con el viaje en ruta: los distingue el TEXTO de la entrada,
        cuya primera línea nombra la acción.

    ServiceEventResponse:
      type: object
      description: Entrada de la bitácora del servicio (una fila por acción).
      required: [id, eventType, note, createdBy, createdAt]
      properties:
        id:        { type: integer, format: int64 }
        eventType: { $ref: '#/components/schemas/ServiceEventType' }
        note:      { type: string }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }

    ServiceCreateRequest:
      type: object
      description: |
        Precisión: hasta 2 decimales; el entero admite 8 cifras en peso y dimensiones y 10 en precio (los topes de las columnas). Fuera de eso es 400.

        Los textos libres no pueden contener el byte NUL (`\u0000`): la columna no lo admite y se rechaza con 400. En `origin` y `destination` tampoco se admite ningún carácter de control, saltos de línea incluidos: son textos de UNA línea y el servidor los registra en su log, donde un salto inventaría una línea entera. En `observations` los saltos y las tabulaciones sí son válidos.
      required: [clientId, tripScope, tentativeDate, origin, destination, cargoTypeId, weightKg, price, currencyId]
      properties:
        clientId:      { type: integer }
        tripScope:     { $ref: '#/components/schemas/TripScope' }
        tentativeDate: { type: string, format: date, description: 'Puede ser pasada (registro retroactivo). Entre 1900-01-01 y 2999-12-31: fuera de esa ventana es 400 (el formato ISO admite años que la columna no).' }
        origin:        { type: string, minLength: 1, maxLength: 255 }
        destination:   { type: string, minLength: 1, maxLength: 255 }
        cargoTypeId:   { type: integer }
        weightKg:      { type: number, format: double, exclusiveMinimum: 0 }
        lengthM:       { type: [number, 'null'], format: double, exclusiveMinimum: 0 }
        widthM:        { type: [number, 'null'], format: double, exclusiveMinimum: 0 }
        heightM:       { type: [number, 'null'], format: double, exclusiveMinimum: 0 }
        price:         { type: number, format: double, exclusiveMinimum: 0, description: 'Mayor que cero: un viaje siempre tiene precio' }
        currencyId:    { type: integer }
        observations:  { type: [string, 'null'], maxLength: 500 }

    ServiceUpdateRequest:
      type: object
      description: |
        Edición del servicio. El cliente, el ámbito del viaje y el tipo de carga NO
        viajan: son inmutables después del alta. `justification` es obligatoria: 10
        caracteres o más MEDIDOS SOBRE EL TEXTO RECORTADO (un texto corto rellenado con
        espacios se rechaza). Un cuerpo sin cambios reales responde 200 sin escribir nada.

        Precisión: hasta 2 decimales; el entero admite 8 cifras en peso y dimensiones y 10 en precio (los topes de las columnas). Fuera de eso es 400.

        Los campos opcionales NO se comportan todos igual frente a `null`: `lengthM`,
        `widthM`, `heightM` y `observations` se asignan tal cual, así que mandarlos en
        null (o ausentes) los VACÍA — un cuerpo parcial borra lo que no incluye. Las
        fechas reales, en cambio, solo CORRIGEN un valor que el servicio ya tiene: ahí
        ausente o null significa sin cambio, porque una fecha real no se borra.

        Los textos libres no pueden contener el byte NUL (`\u0000`): la columna no lo admite y se rechaza con 400. En `origin` y `destination` tampoco se admite ningún carácter de control, saltos de línea incluidos: son textos de UNA línea y el servidor los registra en su log, donde un salto inventaría una línea entera. En `observations` y `justification` los saltos y las tabulaciones sí son válidos.
      required: [tentativeDate, origin, destination, weightKg, price, currencyId, justification]
      properties:
        tentativeDate: { type: string, format: date, description: 'Puede ser pasada (registro retroactivo). Entre 1900-01-01 y 2999-12-31: fuera de esa ventana es 400 (el formato ISO admite años que la columna no).' }
        origin:        { type: string, minLength: 1, maxLength: 255 }
        destination:   { type: string, minLength: 1, maxLength: 255 }
        weightKg:      { type: number, format: double, exclusiveMinimum: 0 }
        lengthM:       { type: [number, 'null'], format: double, exclusiveMinimum: 0 }
        widthM:        { type: [number, 'null'], format: double, exclusiveMinimum: 0 }
        heightM:       { type: [number, 'null'], format: double, exclusiveMinimum: 0 }
        price:         { type: number, format: double, exclusiveMinimum: 0, description: 'Mayor que cero: un viaje siempre tiene precio' }
        currencyId:    { type: integer }
        observations:  { type: [string, 'null'], maxLength: 500 }
        startDateTime:
          type: [string, 'null']
          format: date-time
          description: |
            Corrección del inicio real. Solo se admite si el servicio YA lo tiene: la
            condición es tener la fecha, no estar en un estado (en la práctica aparece al
            ponerse en ruta). Un viaje migrado SIN la fecha no se corrige por acá: ese saneo
            va en el script de cutover. Ausente o null = sin cambio. Entre 1900 y 2999: fuera
            de esa ventana es 400. ⚠️ La fecha la fija la transición a "en ruta"; en un viaje
            que todavía no arrancó, este campo responde 400.
        endDateTime:
          type: [string, 'null']
          format: date-time
          description: |
            Corrección del fin real. Solo se admite si el servicio YA lo tiene (misma
            condición que el inicio: la fecha, no el estado) y tiene que quedar posterior
            o igual al inicio. Las mismas consecuencias que el inicio para un viaje migrado
            sin la fecha. Ausente o null = sin cambio. Entre 1900 y 2999: fuera de esa ventana
            es 400. ⚠️ La fecha la fija la transición a "completado"; en un viaje que todavía no
            cerró, este campo responde 400.
        justification: { type: string, minLength: 10, maxLength: 500, pattern: '^\s*\S[\s\S]{8,}\S\s*$', description: 'El `minLength` cuenta el texto CRUDO; el patrón expresa el mínimo real, que es sobre el texto YA RECORTADO: sin él, un cliente generado aceptaría un texto corto rellenado con espacios que el servidor rechaza' }

    AddResourcesRequest:
      type: object
      description: |
        Refuerzos de un viaje ya en ruta. Los tres recursos son opcionales por separado
        pero al menos uno tiene que venir: los tres ausentes (o los tres en null) es 400
        `COM-001`. Es una condición ENTRE campos, así que no se puede declarar en el
        esquema; la valida el servidor.

        El motivo es OBLIGATORIO, a diferencia de la nota de la asignación, y su mínimo
        se mide DESPUÉS de recortar los espacios de los bordes: diez espacios no son un
        motivo. El `pattern` dice exactamente eso (un no-espacio, ocho caracteres
        cualesquiera, un no-espacio, con espacios libres alrededor), para que un cliente
        generado no acepte lo que el servidor rechaza.

        El motivo entra en la bitácora junto con los recursos sumados y se anexa a la
        descripción de las filas de auditoría. Sus saltos de línea se APLASTAN al
        escribirlo en la bitácora (se ven como `⏎`), porque cada entrada tiene una línea
        por dato y un salto permitiría plantar una línea falsa con el formato del
        servidor. No puede contener el byte NUL (`\u0000`), que la columna no admite
        y se rechaza con 400.

        `force` ausente equivale a `false`.
      required: [reason]
      properties:
        driverId:  { type: [integer, 'null'], minimum: 1 }
        tractorId: { type: [integer, 'null'], minimum: 1 }
        trailerId: { type: [integer, 'null'], minimum: 1 }
        reason:
          type: string
          minLength: 10
          maxLength: 500
          pattern: '^\s*\S[\s\S]{8,}\S\s*$'
          description: 'Por qué se suma el refuerzo. Obligatorio; 10 caracteres o más ya recortado.'
        force:
          type: [boolean, 'null']
          default: false
          description: 'true = suma el recurso pese al conflicto OPS-002 y lo deja registrado en la bitácora y en la auditoría. Ausente, null y false son lo mismo. NO abre el duplicado del mismo viaje (OPS-003), que es duro.'

    AssignResourcesRequest:
      type: object
      description: |
        Conductor y tracto obligatorios, carreta opcional.

        La nota es libre y opcional (no tiene mínimo, a diferencia de la justificación de
        la edición): entra en la bitácora junto con los recursos asignados y se anexa a la
        descripción de las filas de auditoría. Una nota en blanco se trata como ausente. Sus
        saltos de línea se APLASTAN al escribirla en la bitácora (se ven como `⏎`), porque cada
        entrada tiene una línea por dato y un salto permitiría plantar una línea falsa con el
        formato del servidor. No puede contener el byte NUL (`\u0000`), que la columna no admite
        y se rechaza con 400.

        `force` ausente equivale a `false`.
      required: [driverId, tractorId]
      properties:
        driverId:  { type: integer, minimum: 1 }
        tractorId: { type: integer, minimum: 1 }
        trailerId: { type: [integer, 'null'], minimum: 1 }
        note:      { type: [string, 'null'], maxLength: 500 }
        force:     { type: [boolean, 'null'], default: false, description: 'true = asigna pese al conflicto OPS-002; queda registrado en la bitácora y en la auditoría. Ausente, null y false son lo mismo' }

    ChangeStatusRequest:
      type: object
      required: [target]
      properties:
        target:
          type: string
          enum: [IN_PROGRESS, COMPLETED, CANCELLED, DELETED, REOPENED]
          description: 'Estado al que se quiere IR, no el actual. Los dos pendientes no se piden: a "pendiente de inicio" se llega asignando recursos. `REOPENED` no es un estado sino una ACCIÓN: deshace una cancelación o una eliminación y devuelve el viaje al estado que tenía antes, que el servidor saca del rastro de auditoría.'
        dateTime:
          type: [string, 'null']
          format: date-time
          description: 'Inicio o fin real; ausente o null = ahora. Solo aplica al iniciar o finalizar: enviarlo al cancelar, eliminar o reabrir es 400 COM-001. Entre 1900-01-01 y 2999-12-31: fuera de esa ventana es 400. Al finalizar debe ser posterior o igual al inicio, y al iniciar no puede quedar después de un fin ya registrado (RN-OP13).'
        note:
          type: [string, 'null']
          maxLength: 500
          description: 'Opcional al iniciar o finalizar; OBLIGATORIA (10 caracteres o más) al cancelar, eliminar o reabrir (RN-OP7).'
        force:
          type: [boolean, 'null']
          default: false
          description: 'Solo al REABRIR: reabre pese al conflicto OPS-002 y lo deja registrado en la bitácora. Ausente, null y false son lo mismo (no forzar), para que un formulario que serializa el objeto entero siga andando. `true` en cualquiera de las otras cuatro transiciones es 400: ninguna moviliza recursos, y es la única bandera que autoriza pisar la reja de conflictos.'

    ServiceResourceConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          description: |
            Extensión del error para `OPS-002`: le dice a la interfaz que el conflicto se
            puede forzar y qué recurso está ocupado. Los dos campos viajan SOLO en ese
            código; los otros 409 de este endpoint usan el Problem pelado.
          properties:
            forcible: { type: boolean, description: 'true solo en OPS-002' }
            conflicts:
              type: array
              items:
                type: object
                required: [resource, resourceName, serviceCode, serviceStatus]
                properties:
                  resource:     { type: string, enum: [DRIVER, TRACTOR, TRAILER] }
                  resourceName: { type: string, description: 'Nombre del conductor o placa de la unidad' }
                  serviceCode:  { type: string, example: 'SRV-0042' }
                  serviceStatus:
                    type: string
                    enum: [PENDING_START, IN_PROGRESS]
                    description: |
                      Estado del servicio que retiene el recurso. Solo estos dos: antes de
                      asignar no hay recursos, y los terminales (completado, cancelado,
                      eliminado) ya los liberaron.

    ServiceAdditionalResourceResponse:
      type: object
      description: |
        Recurso sumado a un viaje que ya estaba en ruta (relevo de conductor, unidad de
        apoyo), con el motivo por el que se sumó y quién lo hizo.

        Una fila puede traer los tres recursos, uno solo o cualquier combinación: es el
        pedido que la creó, no un recurso suelto. Los que no participaron viajan en null.
      required: [id, reason, assignedBy, assignedAt]
      properties:
        id:         { type: integer, format: int64 }
        driver:     { oneOf: [{ $ref: '#/components/schemas/DriverRef' }], type: ['object', 'null'] }
        tractor:    { oneOf: [{ $ref: '#/components/schemas/FleetUnitRef' }], type: ['object', 'null'] }
        trailer:    { oneOf: [{ $ref: '#/components/schemas/FleetUnitRef' }], type: ['object', 'null'] }
        reason:     { type: string, maxLength: 500, description: 'Por qué se sumó. Obligatorio al crearlo, así que nunca viaja vacío.' }
        assignedBy: { $ref: '#/components/schemas/UserRef' }
        assignedAt: { type: string, format: date-time }

    ServiceDetailResponse:
      type: object
      description: |
        Detalle del servicio con su bitácora. Los recursos asignados (conductor, tracto,
        carreta) viajan desde que existe el endpoint que los asigna: son null mientras el
        viaje esté pendiente de asignación, y la carreta puede seguir en null después,
        porque es opcional.

        Las fechas reales de inicio y fin SÍ viajan: las fija la transición de estado,
        pero la edición las corrige, y sin poder leerlas esa corrección sería imposible
        de pedir y de confirmar.

        Los REFUERZOS viajan en `additionalResources` desde que existe el endpoint que
        los suma: lista vacía mientras no haya ninguno, NUNCA null.
      required: [id, code, client, origin, destination, tentativeDate, tripScope, cargoType, weightKg, status, driver, tractor, trailer, additionalResources, events, createdBy, createdAt, updatedAt]
      properties:
        id:            { type: integer, format: int64 }
        code:          { type: string, example: 'SRV-0042' }
        client:        { $ref: '#/components/schemas/ClientRef' }
        origin:        { type: string, maxLength: 255 }
        destination:   { type: string, maxLength: 255 }
        tentativeDate: { type: string, format: date }
        tripScope:     { $ref: '#/components/schemas/TripScope' }
        cargoType:     { $ref: '#/components/schemas/CargoTypeRef' }
        weightKg:      { type: number, format: double }
        lengthM:       { type: [number, 'null'], format: double }
        widthM:        { type: [number, 'null'], format: double }
        heightM:       { type: [number, 'null'], format: double }
        observations:  { type: [string, 'null'], maxLength: 500 }
        price:         { type: number, format: double, description: 'Ausente para el rol de despacho' }
        currencyCode:  { type: string, pattern: '^[A-Z]{3}$', description: 'Ausente para el rol de despacho' }
        status:        { $ref: '#/components/schemas/ServiceStatus' }
        driver:        { oneOf: [{ $ref: '#/components/schemas/DriverRef' }], type: ['object', 'null'] }
        tractor:       { oneOf: [{ $ref: '#/components/schemas/FleetUnitRef' }], type: ['object', 'null'] }
        trailer:       { oneOf: [{ $ref: '#/components/schemas/FleetUnitRef' }], type: ['object', 'null'] }
        startDateTime: { type: [string, 'null'], format: date-time, description: 'Inicio real. Lo fija la transición a "en ruta" y la edición lo corrige; null mientras el viaje no haya arrancado' }
        endDateTime:   { type: [string, 'null'], format: date-time, description: 'Fin real. Lo fija la transición a "completado" y la edición lo corrige; null mientras el viaje no haya cerrado' }
        additionalResources:
          type: array
          description: 'Refuerzos sumados con el viaje en ruta, en orden cronológico ascendente. Lista vacía si no hay, nunca null.'
          items: { $ref: '#/components/schemas/ServiceAdditionalResourceResponse' }
        events:
          type: array
          description: Bitácora en orden cronológico ascendente
          items: { $ref: '#/components/schemas/ServiceEventResponse' }
        createdBy:     { $ref: '#/components/schemas/UserRef' }
        createdAt:     { type: string, format: date-time }
        updatedAt:     { type: string, format: date-time, description: 'Ultima actualizacion. Para el If-Match reenviar el header ETag tal cual, NO este valor' }

    ServicesReportRowResponse:
      type: object
      required: [serviceId, code, clientName, tripScope, origin, destination, startDateTime, endDateTime, price, currencyCode, principalDriver, additionalDrivers]
      properties:
        serviceId:       { type: integer, format: int64 }
        code:            { type: string }
        clientName:      { type: string }
        tripScope:       { $ref: '#/components/schemas/TripScope' }
        origin:          { type: string }
        destination:     { type: string }
        startDateTime:   { type: string, format: date-time }
        endDateTime:     { type: string, format: date-time }
        price:           { type: number, format: double }
        # Se declara por FORMA y no como enum cerrado: el codigo devuelve lo que tenga
        # `public.currencies.code`, sin CHECK que lo limite, asi que un enum dejaria al cliente
        # TypeScript generado recibiendo un valor fuera de la union el dia que se siembre una
        # tercera moneda. El listado y el detalle ya se relajaron igual en el PR #141.
        currencyCode:    { type: string, pattern: '^[A-Z]{3}$' }
        principalDriver: { type: string }
        additionalDrivers:
          type: array
          description: Conductores sumados en ruta, con el motivo de cada relevo.
          items:
            type: object
            required: [name, reason]
            properties:
              name:   { type: string }
              reason: { type: string }

    ServicesReportTotalsResponse:
      type: object
      description: Una fila por moneda, sin conversión (mismo criterio que el reporte de almacén).
      required: [currencyCode, totalServices, totalRevenue]
      properties:
        currencyCode:  { type: string, pattern: '^[A-Z]{3}$' }
        totalServices: { type: integer }
        totalRevenue:  { type: number, format: double }

    ServicesReportResponse:
      type: object
      required: [weekCycle, closed, rows, totals]
      properties:
        weekCycle:
          type: object
          description: >-
            La semana que se está reportando. `end` es el MARTES inclusive, no el miércoles con el
            que se consulta la base: son dos fechas distintas separadas por un día.
          required: [start, end]
          properties:
            start: { type: string, format: date, description: 'Miércoles en que abrió (Lima)' }
            end:   { type: string, format: date, description: 'Martes en que cierra, INCLUSIVE (Lima)' }
        closed:
          type: boolean
          description: >-
            Si la semana ya cerró. La semana EN CURSO se puede consultar y devuelve `false`; lo que
            depende de esto es la exportación, no la lectura. Va UN solo campo y no dos: publicar
            además su negación deja dos formas de la misma verdad que pueden contradecirse.
        rows:
          type: array
          description: >-
            Ordenadas por fecha de fin ascendente (el desempate por id las deja en un orden estable
            entre dos impresiones de la misma semana). Lista vacía si no hubo servicios completados en
            la semana, nunca null.
          items: { $ref: '#/components/schemas/ServicesReportRowResponse' }
        totals:
          type: array
          description: >-
            Una fila por cada moneda PRESENTE en la semana, en el orden en que aparecen en las filas.
            Lista vacía si no hubo servicios, nunca null: no se publica una fila en cero por cada
            moneda del catálogo.
          items: { $ref: '#/components/schemas/ServicesReportTotalsResponse' }

    ServiceStatsResponse:
      type: object
      description: |
        La tira de indicadores que va arriba del listado. El cuerpo es IDÉNTICO para los cinco
        roles: no lleva un solo importe, así que la regla de precios no recorta nada acá.
      required: [pendingAssignment, pendingStart, inProgress, completedThisWeek, driversOnRoad, unitsOnRoad, weekCycle]
      properties:
        pendingAssignment: { type: integer, minimum: 0, description: 'Viajes esperando que se les asignen recursos. GLOBAL: sin ventana de tiempo, el ciclo semanal solo aplica a completedThisWeek' }
        pendingStart:      { type: integer, minimum: 0, description: 'Viajes con recursos asignados que todavía no arrancaron. GLOBAL: sin ventana de tiempo, el ciclo semanal solo aplica a completedThisWeek' }
        inProgress:        { type: integer, minimum: 0, description: 'Viajes en ruta. GLOBAL: sin ventana de tiempo, el ciclo semanal solo aplica a completedThisWeek' }
        completedThisWeek: { type: integer, minimum: 0, description: 'Completados con fecha de fin real dentro del ciclo operativo miércoles→martes de América/Lima (RN-OP14)' }
        driversOnRoad:
          type: object
          description: 'Conductores PRINCIPALES distintos en viajes en ruta, sobre el padrón de conductores de alta. Los refuerzos no cuentan.'
          required: [active, total]
          properties:
            active: { type: integer, minimum: 0 }
            total:  { type: integer, minimum: 0 }
        unitsOnRoad:
          type: object
          description: 'TRACTOS principales distintos en viajes en ruta, sobre el padrón de tractos de alta. Carretas y escoltas NO participan, pese al nombre del campo.'
          required: [active, total]
          properties:
            active: { type: integer, minimum: 0 }
            total:  { type: integer, minimum: 0 }
        weekCycle:
          type: object
          description: 'El ciclo vigente. `end` es el MARTES inclusive, no el miércoles con el que se consulta.'
          required: [start, end]
          properties:
            start: { type: string, format: date, description: 'Miércoles en que abrió el ciclo (Lima)' }
            end:   { type: string, format: date, description: 'Martes en que cierra, INCLUSIVE (Lima)' }

    ServiceSummaryResponse:
      type: object
      description: |
        Fila del listado. `price` y `currencyCode` están AUSENTES (no en null) para el
        rol `dispatcher`. Origen y destino viajan separados porque la tabla los muestra
        en dos líneas.

        `driver` y `tractor` son null mientras el viaje esté pendiente de asignación: la
        fila los trae desde que existe el endpoint que los asigna. La carreta no está acá
        (es opcional y la tabla no la muestra); vive en el detalle.
      required: [id, code, client, origin, destination, tentativeDate, tripScope, status, driver, tractor, createdAt]
      properties:
        id:            { type: integer, format: int64 }
        code:          { type: string, example: 'SRV-0042' }
        client:        { $ref: '#/components/schemas/ClientRef' }
        origin:        { type: string, maxLength: 255 }
        destination:   { type: string, maxLength: 255 }
        tentativeDate: { type: string, format: date }
        tripScope:     { $ref: '#/components/schemas/TripScope' }
        status:        { $ref: '#/components/schemas/ServiceStatus' }
        driver:        { oneOf: [{ $ref: '#/components/schemas/DriverRef' }], type: ['object', 'null'] }
        tractor:       { oneOf: [{ $ref: '#/components/schemas/FleetUnitRef' }], type: ['object', 'null'] }
        price:         { type: number, format: double, description: 'Ausente para el rol dispatcher' }
        currencyCode:  { type: string, pattern: '^[A-Z]{3}$', description: 'Ausente para el rol dispatcher' }
        createdAt:     { type: string, format: date-time }

    PageOfServiceSummary:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/ServiceSummaryResponse' }
