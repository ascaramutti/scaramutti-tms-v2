  /services/{id}/assignment:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }

    post:
      tags: [Operations]
      operationId: assignServiceResources
      summary: Asignar recursos principales (el servicio pasa a pendiente de inicio)
      description: |
        Conductor y tracto obligatorios, carreta opcional; solo desde
        `PENDING_ASSIGNMENT`, y al asignar el servicio pasa a `PENDING_START`.

        El estado que no admite la acción se parte en dos códigos, igual que en la
        edición: `PENDING_START`, `IN_PROGRESS` y `COMPLETED` responden 409 `OPS-006`
        (el estado no admite ESTA acción, que no es un cambio de estado), y los dos
        terminales inmutables, `CANCELLED` y `DELETED`, responden 409 `OPS-004`, el
        mismo código con el que los rechaza el PUT.

        Si un recurso ya participa de OTRO servicio en `PENDING_START` o `IN_PROGRESS`,
        sea como recurso principal o como refuerzo (se revisan AMBAS fuentes), responde
        409 `OPS-002` con `forcible: true` y el detalle en `conflicts`. El texto del error nombra
        al primero y cuenta cuántos RECURSOS distintos quedan en conflicto; la lista completa
        viaja en `conflicts`. Reintentar con
        `force: true` lo asigna igual y deja constancia en la bitácora y en la auditoría:
        el conflicto avisa, no prohíbe. Mandar `force: true` sin que haya conflicto
        asigna normal y NO deja registrado que se forzara nada.

        Los recursos tienen que existir y estar activos (400 `COM-001`), pero su
        disponibilidad NO se valida: un tracto en mantenimiento se puede asignar igual,
        porque esa es una decisión operativa y el catálogo de estados existe para ordenar
        la lista de la pantalla, no para prohibir.

        Los 400 no caen todos en el mismo lugar, igual que en la edición: los de FORMATO del
        cuerpo (obligatorios, tope de la nota, byte NUL, ids no positivos) se contestan ANTES que
        cualquier precondición del recurso, así que un id de viaje inexistente con un cuerpo
        inválido responde 400 y no 404. Los de NEGOCIO (recurso inexistente o dado de baja) se
        contestan DESPUÉS del 404 y del 409 del estado.

        Sin `If-Match`: acá la protección es el estado, no la versión (solo se asigna
        desde un único estado, que la propia operación abandona). La fila se lee bajo
        lock y los recursos pedidos se serializan entre sí, así que dos asignaciones
        simultáneas no pueden colarse sin ver el conflicto; si CUALQUIER sentencia de esa
        transacción se rinde por lock → 409 `OPS-008`, TRANSITORIO, se resuelve
        reintentando.
      x-required-roles: [admin, general_manager, operations_manager, dispatcher]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignResourcesRequest' }
            example: { driverId: 4, tractorId: 7, trailerId: 3, note: 'Sale del patio a las 05:00', force: false }
      responses:
        '200':
          description: Recursos asignados; el servicio queda pendiente de inicio
          headers:
            ETag:
              description: 'Nueva versión del recurso; reenviarla tal cual en el próximo `If-Match`, comillas incluidas'
              schema: { type: string }
            Cache-Control:
              description: 'Siempre `no-store`: el cuerpo depende del rol de quien pregunta'
              schema: { type: string }
            Vary:
              description: 'Siempre `Authorization`: el mismo ETag identifica cuerpos distintos según el rol, así que ninguna cache puede reusar uno para otro usuario'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`OPS-002` (conflicto forzable), `OPS-006` (el estado no admite la acción), `OPS-004` (cancelado o eliminado) u `OPS-008` (conflicto de lock, transitorio)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ServiceResourceConflictProblem' }
              examples:
                forcibleConflict:
                  summary: Conflicto de recursos — la interfaz ofrece "Forzar asignación"
                  value:
                    type: 'urn:tms:error:ops-002'
                    title: 'Resource conflict'
                    status: 409
                    detail: 'El conductor Juan Pérez ya está asignado al servicio SRV-0042 (en ruta).'
                    instance: '/api/v1/services/118/assignment'
                    code: 'OPS-002'
                    traceId: '3f2a1b0c-9d8e-7f6a-5b4c-3d2e1f0a9b8c'
                    forcible: true
                    conflicts:
                      - { resource: 'DRIVER', resourceName: 'Juan Pérez', serviceCode: 'SRV-0042', serviceStatus: 'IN_PROGRESS' }
                statusNotAllowed:
                  summary: El viaje ya tiene recursos asignados
                  value:
                    type: 'urn:tms:error:ops-006'
                    title: 'Conflict'
                    status: 409
                    detail: 'El estado del servicio no admite esta acción'
                    instance: '/api/v1/services/118/assignment'
                    code: 'OPS-006'
                    traceId: '7c6b5a49-3d2e-1f0a-9b8c-7d6e5f4a3b2c'

  /services/{id}/status:
    post:
      tags: [Operations]
      operationId: changeServiceStatus
      summary: Transicionar estado (iniciar / finalizar / cancelar / eliminar / reabrir)
      description: |
        RN-OP1 — transiciones válidas: pendiente de inicio → en ruta, en ruta →
        completado, cancelado desde los tres estados no terminales, y eliminado
        SOLO desde los dos pendientes, mas la REAPERTURA, que es el unico arco
        que sale de un terminal y va al estado que el rastro registre (ver mas
        abajo). El resto → 409 `OPS-001`. El paso de
        pendiente de asignación a pendiente de inicio NO se pide acá: es efecto
        de asignar recursos.

        Eliminar y cancelar son cosas distintas: `DELETED` etiqueta el registro
        que nunca debió existir (error de digitación) y lo saca de listados e
        indicadores; `CANCELLED` es un viaje real que se abortó. Un servicio en
        ruta o completado no se elimina: se cancela o se corrige. Nada se borra
        de la base de datos.

        ⚠️ Un viaje con recursos de REFUERZO todavía no se reabre hacia un estado
        que los retiene: sus adicionales también vuelven a quedar tomados y la
        verificación de disponibilidad hoy solo alcanza a los tres principales.
        Responde 409 `OPS-009` y **no es forzable**. El endpoint de refuerzos YA
        existe, así que este límite es ALCANZABLE: sumar un refuerzo, cancelar y
        querer reabrir deja al viaje sin poder volver. No lo sostiene una regla de
        negocio sino el presupuesto de esperas de bloqueo, y se levanta en su propio
        cambio, no con el endpoint de refuerzos. Reabrir hacia "pendiente de
        asignación" no lo tiene, porque ese estado no retiene nada.

        Cada transición que AVANZA exige los datos que la etapa anterior tenía
        que haber dejado: iniciar pide conductor y tracto (la carreta es opcional, hay
        carga que no la lleva) y finalizar pide la fecha de inicio. Falta alguno
        → 409 `OPS-009`.

        Esas dos son inalcanzables por esta API: a "pendiente de inicio" solo se
        llega asignando, que exige conductor y tracto, y pasar a "en ruta"
        SIEMPRE deja registrado el inicio (si `dateTime` no viene, se usa el
        momento de la llamada). O sea que ahí un `OPS-009` significa que la fila
        entró sin pasar por la aplicación —data migrada o escritura directa— y
        el dato hay que sanearlo, no reintentarlo. Las otras dos causas del
        mismo código nacen al reabrir (sin rastro de dónde venía, o con recursos
        de refuerzo) y tampoco se reintentan.

        `REOPENED` deshace una cancelación o una eliminación. No lleva estado
        de destino: el servidor lo saca de la auditoría, así que un viaje
        cancelado en ruta vuelve a en ruta y no a foja cero. Si no hay rastro
        de dónde venía (viajes migrados del sistema anterior) responde 409
        `OPS-009`, porque devolverlo a un estado por defecto lo pondría en uno
        que quizás nunca tuvo. Un viaje completado NO se reabre: terminar no es
        un error que haya que deshacer, y sus datos se corrigen editando. Es la
        transición más acotada: solo `admin` y `general_manager`, y pide motivo
        e `If-Match` igual que las dos que deshace.

        El 403 del veto se resuelve ANTES de tocar la base, así que un rol vetado recibe el mismo
        403 exista o no el viaje. Los 400 de forma del cuerpo corren todavía antes, en el mapeo del
        pedido: un rol vetado que además manda un motivo corto recibe 400 y no 403. No filtra nada
        —esos 400 solo miran el cuerpo— pero conviene saber el orden al construir la pantalla.

        El motivo se mide DESPUÉS de recortar: diez espacios no son diez caracteres. Y ningún texto
        libre puede llevar el byte NUL, que PostgreSQL no admite dentro de un texto: es 400, no 500.

        Precedencia entre los rechazos: primero se resuelve el DESTINO (de ahí salen los `OPS-009`
        de la reapertura), después el estado de la fila (`OPS-004`), después el arco (`OPS-001`) y
        recién ahí la versión (412). O sea que un `If-Match` viejo sobre un viaje ya cancelado
        recibe `OPS-004` y no 412: recargar no arregla que desde ese estado no se pueda llegar al
        pedido. Los datos de la etapa anterior (`OPS-009`) se miran DESPUÉS del 412, porque ahí
        recargar sí sirve.

        Reabrir hacia un estado que RETIENE recursos (pendiente de inicio o en
        ruta) vuelve a mirar conflictos: cancelar no limpia el conductor ni el
        tracto, pero un viaje cancelado deja de retenerlos, así que en el medio
        otro viaje se los puede haber llevado. Si eso pasó → 409 `OPS-002`
        forzable, igual que al asignar, y al reabrir con `force` la bitácora
        deja una línea por cada recurso que se pisó. Sin ese chequeo, dos viajes
        activos terminarían compartiendo un conductor sin que nadie lo haya
        decidido.

        ⚠️ La `note` es texto libre y viaja entera a la bitácora (salvo por los saltos de línea,
        que se muestran como `⏎` para que nadie pueda plantar ahí una línea con el formato del
        servidor). Al cancelar, eliminar y reabrir es OBLIGATORIA, la escriben roles que SÍ ven
        los importes, y la bitácora la lee todo el que pueda leer el detalle del viaje, incluido
        el despacho, que no ve precios. Quien la escribe puede volcar ahí un importe y el despacho
        lo leería, de forma PERMANENTE (ningún endpoint la edita ni la borra). Riesgo ACEPTADO
        (decisión del dueño, 2026-08-07, la misma que rige para la `justification` del PUT): el
        servidor no divulga los importes que él guarda, pero no filtra lo que una persona escribe.

        La línea que deja el forzado nombra el CÓDIGO y el ESTADO del otro viaje con el que se
        comparte el recurso, y también queda persistida. Hoy no filtra nada porque los cinco roles
        que leen el detalle pueden pedir ese otro viaje de frente; el día que el detalle autorice
        por fila, hay que filtrar también la bitácora, porque este canal sobrevive a la respuesta
        y el del 409 no.

        Cancelar y eliminar NO exigen esos datos previos: son las salidas, y
        tienen que estar disponibles justamente para los viajes que quedaron a
        medias. Lo que sí exigen es del PEDIDO, no del viaje: motivo de 10
        caracteres o más e `If-Match` (RN-OP7). Junto con la reapertura son las transiciones más
        exigentes en lo que la llamada tiene que traer, y las menos exigentes en
        el estado del viaje.

        `dateTime` es opcional (por defecto, ahora) y solo aplica al iniciar o
        finalizar. Mandarlo al cancelar, eliminar o reabrir es 400 `COM-001`: esas
        tres no fechan el viaje sino la decisión, y aceptar el dato para
        descartarlo en silencio dejaría al cliente creyendo que guardó una marca
        que nunca existió. RN-OP13 — al finalizar, la fecha de fin no puede ser
        anterior a la de inicio (400 `COM-001`).

        RN-OP7 — cancelar y eliminar exigen motivo de 10 caracteres o más, no
        los puede hacer `dispatcher` (403: opera el viaje, no decide matarlo ni
        descartarlo) y piden `If-Match` con el ETag del detalle, porque son
        destructivos y el estado que el usuario vio en pantalla pudo haber
        cambiado. Ahí `If-Match` ausente o sin coincidir → 412 `COM-004`.

        Al iniciar y al finalizar el header es OPCIONAL, pero si viene se
        EVALÚA: sin coincidir → 412. No se ignora. RFC 9110 §13.1.1 obliga a
        evaluar toda precondición recibida, y descartarla le daría al cliente
        una protección que cree tener y no tiene. La condicionalidad (obligatorio
        en tres de los cinco targets) no se puede declarar en el esquema porque depende de
        un campo del cuerpo: la valida el servidor.

        `sales` no participa de las transiciones: registra y edita el servicio,
        pero la operación del viaje es del despacho y la gerencia (misma regla
        que el sistema anterior).
      x-required-roles: [admin, general_manager, operations_manager, dispatcher]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - name: If-Match
          in: header
          required: false
          description: 'Obligatorio cuando `target` es `CANCELLED`, `DELETED` o `REOPENED` (ausente o sin coincidir → 412 `COM-004`). Al iniciar y al finalizar es opcional, pero si se envía se evalúa igual: sin coincidir → 412.'
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeStatusRequest' }
            examples:
              start:   { summary: Iniciar,   value: { target: 'IN_PROGRESS', dateTime: '2026-07-10T05:12:00Z' } }
              finish:  { summary: Finalizar, value: { target: 'COMPLETED', note: 'Descarga conforme, sin observaciones' } }
              cancel:  { summary: Cancelar,  value: { target: 'CANCELLED', note: 'El cliente reprogramó el embarque para agosto' } }
              delete:  { summary: Eliminar,  value: { target: 'DELETED', note: 'Registro duplicado por error de digitación' } }
              reopen:  { summary: 'Reabrir (deshace cancelar o eliminar; pide motivo e If-Match)', value: { target: 'REOPENED', note: 'El cliente retomó el embarque que había reprogramado' } }
      responses:
        '200':
          description: Estado actualizado
          headers:
            ETag: { schema: { type: string }, description: 'Nueva versión del recurso; reenviarla tal cual (comillas incluidas) en el próximo If-Match' }
            Cache-Control: { schema: { type: string }, description: '`no-store`: el cuerpo depende del rol que pregunta (al despacho le faltan los importes)' }
            Vary: { schema: { type: string }, description: '`Authorization`: el mismo ETag identifica cuerpos distintos según el rol, así que ninguna caché puede reusar uno para otro usuario' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 'Transición inválida (`OPS-001`), servicio ya cancelado o eliminado (`OPS-004`), recurso ya tomado por otro viaje al reabrir (`OPS-002`, forzable), viaje al que le faltan los datos de la etapa anterior (`OPS-009`: sin conductor y tracto al iniciar o al reabrir hacia un estado que los pide, sin fecha de inicio al cerrar, con un rastro que no dice de dónde venía al reabrir —o que apunta a un estado desconocido, o a uno del que no se vuelve—, o con recursos de refuerzo que todavía no se pueden verificar al reabrir), o conflicto transitorio de bloqueo (`OPS-008`: otra operación tiene el viaje tomado; se reintenta)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ServiceResourceConflictProblem' }
              example:
                type: 'urn:tms:error:ops-001'
                title: 'Invalid status transition'
                status: 409
                detail: 'No se puede pasar de "completado" a "en ruta"'
                instance: '/api/v1/services/118/status'
                code: 'OPS-001'
                traceId: '1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d'
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /services/{id}/resources:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }

    post:
      tags: [Operations]
      operationId: addServiceResources
      summary: Agregar recursos adicionales (solo con el viaje en ruta)
      description: |
        RN-OP5 — refuerzos de un viaje que YA arrancó: el relevo de un conductor que
        agotó su descanso reglamentario, la unidad de apoyo que sale a un varado. Al
        menos uno de `driverId`, `tractorId` o `trailerId` (ninguno → 400 `COM-001`) y
        motivo OBLIGATORIO de 10 caracteres o más, medidos DESPUÉS de recortar los
        espacios de los bordes.

        Los recursos NO reemplazan a los principales: se suman. El viaje se queda en
        `IN_PROGRESS` y sus conductor, tracto y carreta originales no se tocan. Un
        pedido con los tres recursos deja UNA fila de refuerzo, no tres.

        El estado que no admite la acción se parte en dos códigos, igual que en la
        asignación: `PENDING_ASSIGNMENT`, `PENDING_START` y `COMPLETED` responden 409
        `OPS-006` (el estado no admite ESTA acción), y los dos terminales inmutables,
        `CANCELLED` y `DELETED`, responden 409 `OPS-004`, el mismo código con el que
        los rechaza el PUT.

        Los dos conflictos de recurso son DISTINTOS y se evalúan en este orden, que no
        es cosmético:

        1. RN-OP4 — el recurso ya participa de ESTE MISMO viaje, sea como principal o
           como refuerzo agregado antes (se revisan AMBAS fuentes) → 409 `OPS-003`,
           DURO: `force` no lo saltea y el Problem viaja pelado, sin `forcible` ni
           `conflicts`.
        2. RN-OP3 — el recurso está tomado por OTRO viaje en `PENDING_START` o
           `IN_PROGRESS`, como principal o como refuerzo (también ambas fuentes) → 409
           `OPS-002` con `forcible: true` y el detalle en `conflicts`. Reintentar con
           `force: true` lo suma igual y deja constancia en la bitácora y en la
           auditoría: el conflicto avisa, no prohíbe.

        Si `OPS-002` se evaluara primero, un `force: true` colaría el duplicado que
        RN-OP4 declara no forzable. Mandar `force: true` sin que haya conflicto suma
        el refuerzo normal y NO deja registrado que se forzara nada.

        Los recursos tienen que existir y estar activos (400 `COM-001`), pero su
        disponibilidad NO se valida: sumar un refuerzo ELIGE (a diferencia de reabrir,
        que RESTAURA), así que rige el mismo criterio que la asignación y un tracto en
        mantenimiento se puede sumar igual.

        Sin `If-Match`, igual que la asignación pero por una razón DISTINTA, y por eso
        se escribe: la asignación se auto-protege porque ABANDONA el estado que la
        habilita, y esta se queda en "en ruta". Lo que rechaza el reintento acá es
        `OPS-003` — el mismo recurso sobre el mismo viaje rebota duro. Un `If-Match`
        que llegue igual se ignora. La fila se lee bajo lock y los recursos pedidos se
        serializan entre sí, así que dos refuerzos simultáneos no pueden colarse sin
        ver el conflicto; si CUALQUIER sentencia de esa transacción se rinde por lock →
        409 `OPS-008`, TRANSITORIO, se resuelve reintentando.

        Los 400 no caen todos en el mismo lugar, igual que en la asignación: los de
        FORMATO del cuerpo (al menos un recurso, mínimo y tope del motivo, byte NUL,
        ids no positivos, `force` no booleano) se contestan ANTES que cualquier
        precondición, así que un id de viaje inexistente con un cuerpo inválido
        responde 400 y no 404. Los de NEGOCIO (recurso inexistente o dado de baja) se
        contestan DESPUÉS del 404 y del 409 del estado.

        Límite conocido: un viaje que recibió refuerzos ya no se puede REABRIR una vez
        cancelado o eliminado (409 `OPS-009`, no forzable). No es una regla de negocio
        sino el presupuesto de esperas de lock, que no alcanza para verificar una lista
        de recursos de largo variable; se levanta en su propio cambio.
      x-required-roles: [admin, general_manager, operations_manager, dispatcher]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddResourcesRequest' }
            examples:
              driverRelay:
                summary: Relevo de conductor
                value: { driverId: 9, reason: 'Relevo por descanso reglamentario del conductor principal' }
              backupUnit:
                summary: Unidad de apoyo, forzando el conflicto
                value: { tractorId: 7, trailerId: 3, reason: 'Apoyo por varadura en el km 214 de la Panamericana', force: true }
      responses:
        '200':
          description: Refuerzos sumados; el viaje sigue en ruta
          headers:
            ETag:
              description: 'Nueva versión del recurso; reenviarla tal cual (comillas incluidas) en el próximo `If-Match`'
              schema: { type: string }
            Cache-Control:
              description: '`no-store`: el cuerpo depende del rol que pregunta (al despacho le faltan los importes)'
              schema: { type: string }
            Vary:
              description: '`Authorization`: el mismo ETag identifica cuerpos distintos según el rol, así que ninguna caché puede reusar uno para otro usuario'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 'En orden de PRECEDENCIA: `OPS-004` (cancelado o eliminado), `OPS-006` (el estado no admite la acción), `OPS-003` (el recurso ya participa de este mismo viaje; duro, no forzable) y `OPS-002` (tomado por otro viaje activo; forzable). Además `OPS-008` (conflicto de lock, transitorio) desde cualquier punto.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ServiceResourceConflictProblem' }
              examples:
                duplicateInSameService:
                  summary: El recurso ya está en este viaje — la interfaz NO ofrece forzar
                  value:
                    type: 'urn:tms:error:ops-003'
                    title: 'Duplicate resource'
                    status: 409
                    detail: 'El conductor Juan Pérez ya participa de este servicio.'
                    instance: '/api/v1/services/118/resources'
                    code: 'OPS-003'
                    traceId: '8e7d6c5b-4a39-2817-0f6e-5d4c3b2a1908'
                forcibleConflict:
                  summary: Tomado por otro viaje — la interfaz ofrece "Forzar"
                  value:
                    type: 'urn:tms:error:ops-002'
                    title: 'Resource conflict'
                    status: 409
                    detail: 'El conductor Juan Pérez ya está asignado al servicio SRV-0042 (en ruta).'
                    instance: '/api/v1/services/118/resources'
                    code: 'OPS-002'
                    traceId: '3f2a1b0c-9d8e-7f6a-5b4c-3d2e1f0a9b8c'
                    forcible: true
                    conflicts:
                      - { resource: 'DRIVER', resourceName: 'Juan Pérez', serviceCode: 'SRV-0042', serviceStatus: 'IN_PROGRESS' }

# =============================================================================

components:
# =============================================================================

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT firmado con RS256. Claims esperados:
        `sub` (userId), `username`, `role`, `fullName`, `position`, `type`, `iat`, `exp`.

  parameters:
    Page:
      name: page
      in: query
      description: Página (base 0)
      schema: { type: integer, default: 0, minimum: 0 }
    Size:
      name: size
      in: query
      description: Tamaño de página (máx. 100)
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
    IdLong:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    IfMatch:
      name: If-Match
      in: header
      description: ETag/version del recurso para optimistic locking.
      schema: { type: string }

  responses:
    Unauthorized:
      description: Token de acceso ausente, expirado o inválido
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            tokenMissing:
              summary: No se envió header Authorization
              value:
                type: 'urn:tms:error:auth-006'
                title: 'Token missing'
                status: 401
                detail: 'Falta el header Authorization con un token Bearer'
                instance: '/api/v1/auth/me'
                code: 'AUTH-006'
                traceId: '4a5b6c7d-8e9f-0a1b-2c3d-4e5f6a7b8c9d'
            tokenExpired:
              summary: Token de acceso expirado
              value:
                type: 'urn:tms:error:auth-007'
                title: 'Token expired'
                status: 401
                detail: 'El token de acceso expiró. Use /auth/refresh para renovarlo.'
                instance: '/api/v1/auth/me'
                code: 'AUTH-007'
                traceId: '8d2e4f6a-1b3c-4d5e-7f8a-9b0c1d2e3f4a'
            tokenInvalid:
              summary: Token mal formado o no firmado por este servidor
              value:
                type: 'urn:tms:error:auth-008'
                title: 'Token invalid'
                status: 401
                detail: 'El token de acceso es inválido o está mal formado'
                instance: '/api/v1/auth/me'
                code: 'AUTH-008'
                traceId: '5c1a2b3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d'

    BadRequest:
      description: Solicitud inválida (validación, formato, valores fuera de rango)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            validationFailed:
              summary: Errores de validación por campo
              value:
                type: 'urn:tms:error:com-001'
                title: 'Validation failed'
                status: 400
                detail: 'La solicitud contiene errores de validación'
                instance: '/api/v1/clients'
                code: 'COM-001'
                traceId: '7c4d2f8a-1b3e-4f9a-8c2d-5e7b1a9c3d4f'
                errors:
                  - field: 'name'
                    message: 'no debe estar vacío'
                    code: 'REQUIRED'
                  - field: 'ruc'
                    message: 'debe tener exactamente 11 dígitos'
                    code: 'PATTERN'

    Forbidden:
      description: Autenticado pero sin permisos para esta operación
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            insufficientRole:
              summary: Rol insuficiente para la operación
              value:
                type: 'urn:tms:error:com-003'
                title: 'Forbidden'
                status: 403
                detail: 'No tiene permisos para acceder a este recurso'
                instance: '/api/v1/clients'
                code: 'COM-003'
                traceId: '6f4e3d2c-1b0a-9f8e-7d6c-5b4a3f2e1d0c'

    Conflict:
      description: Conflicto (recurso ya existe, restricción de unicidad violada)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            duplicateServiceDetected:
              summary: Servicio duplicado detectado (protección anti doble-click backend-side)
              value:
                type: 'urn:tms:error:ops-007'
                title: 'Conflict'
                status: 409
                detail: 'Se detectó un servicio idéntico creado hace menos de 30 segundos'
                instance: '/api/v1/services'
                code: 'OPS-007'
                traceId: '8f9a0b1c-2d3e-4f5a-6b7c-8d9e0f1a2b3c'
            serviceNotEditable:
              summary: Servicio cancelado o eliminado (inmutable)
              value:
                type: 'urn:tms:error:ops-004'
                title: 'Conflict'
                status: 409
                detail: 'El servicio está cancelado o eliminado: ya no admite cambios'
                instance: '/api/v1/services/42'
                code: 'OPS-004'
                traceId: '9a0b1c2d-3e4f-5a6b-7c8d-9e0f1a2b3c4d'
            serviceLocked:
              summary: Fila tomada por otra operación (conflicto transitorio)
              value:
                type: 'urn:tms:error:ops-008'
                title: 'Conflict'
                status: 409
                detail: 'No se pudo completar la operación por un bloqueo temporal en la base de datos, reintente en unos segundos'
                instance: '/api/v1/services/42'
                code: 'OPS-008'
                traceId: 'a1b2c3d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d'
            duplicateRuc:
              summary: RUC duplicado al crear cliente
              value:
                type: 'urn:tms:error:cli-001'
                title: 'Conflict'
                status: 409
                detail: 'Ya existe un cliente con RUC 20123456789'
                instance: '/api/v1/clients'
                code: 'CLI-001'
                traceId: '4d5e6f7a-8b9c-0d1e-2f3a-4b5c6d7e8f9a'
            duplicateClientName:
              summary: Nombre de cliente duplicado al crear cliente
              value:
                type: 'urn:tms:error:cli-002'
                title: 'Conflict'
                status: 409
                detail: 'Ya existe un cliente con el nombre Acme Corp'
                instance: '/api/v1/clients'
                code: 'CLI-002'
                traceId: '5e6f7a8b-9c0d-1e2f-3a4b-5c6d7e8f9a0b'
            duplicateCargoTypeName:
              summary: Nombre de tipo de carga duplicado al crear cargo type
              value:
                type: 'urn:tms:error:cgt-001'
                title: 'Conflict'
                status: 409
                detail: 'Ya existe un tipo de carga con el nombre indicado'
                instance: '/api/v1/cargo-types'
                code: 'CGT-001'
                traceId: '6f7a8b9c-0d1e-2f3a-4b5c-6d7e8f9a0b1c'
            duplicateQuotationCode:
              summary: Código de cotización duplicado (race condition extrema sobre el advisory lock)
              value:
                type: 'urn:tms:error:quo-001'
                title: 'Conflict'
                status: 409
                detail: 'El código 2026-00042 ya está en uso, reintente'
                instance: '/api/v1/quotations'
                code: 'QUO-001'
                traceId: '7e8f9a0b-1c2d-3e4f-5a6b-7c8d9e0f1a2b'
            duplicateQuotationDetected:
              summary: Cotización duplicada detectada (protección anti doble-click backend-side)
              value:
                type: 'urn:tms:error:quo-002'
                title: 'Conflict'
                status: 409
                detail: 'Se detectó una cotización idéntica creada hace menos de 30 segundos'
                instance: '/api/v1/quotations'
                code: 'QUO-002'
                traceId: '8f9a0b1c-2d3e-4f5a-6b7c-8d9e0f1a2b3c'
            invalidStatusTransition:
              summary: Transición de estado no permitida (PATCH /quotations/{id}/status)
              value:
                type: 'urn:tms:error:quo-005'
                title: 'Conflict'
                status: 409
                detail: 'No se puede pasar de REJECTED a SENT'
                instance: '/api/v1/quotations/142/status'
                code: 'QUO-005'
                traceId: '9a0b1c2d-3e4f-5a6b-7c8d-9e0f1a2b3c4d'
            terminalNotEditable:
              summary: Intento de editar una cotización en estado terminal (PUT /quotations/{id})
              value:
                type: 'urn:tms:error:quo-006'
                title: 'Conflict'
                status: 409
                detail: 'No se puede editar una cotizacion en estado ACCEPTED'
                instance: '/api/v1/quotations/142'
                code: 'QUO-006'
                traceId: 'a0b1c2d3-4e5f-6a7b-8c9d-0e1f2a3b4c5d'

    NotFound:
      description: Recurso no encontrado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            serviceNotFound:
              summary: Servicio de transporte inexistente
              value:
                type: 'urn:tms:error:ops-005'
                title: 'Resource not found'
                status: 404
                detail: 'El servicio indicado no existe'
                instance: '/api/v1/services/999'
                code: 'OPS-005'
                traceId: '9f2c1e4a-3b7d-4c2e-9a1f-6d5b8c3e7a12'
            quotationNotFound:
              summary: Cotización inexistente
              value:
                type: 'urn:tms:error:quo-003'
                title: 'Resource not found'
                status: 404
                detail: 'La cotización con id 999 no existe'
                instance: '/api/v1/quotations/999'
                code: 'QUO-003'
                traceId: '2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e'
            productNotFound:
              summary: Producto de almacén inexistente
              value:
                type: 'urn:tms:error:wh-003'
                title: 'Resource not found'
                status: 404
                detail: 'El producto con id 999 no existe'
                instance: '/api/v1/warehouse/products/999'
                code: 'WH-003'
                traceId: '2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e'
    PreconditionFailed:
      description: Optimistic lock — el recurso fue modificado desde que se leyó
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            staleVersion:
              summary: Versión obsoleta (otro usuario editó primero)
              value:
                type: 'urn:tms:error:com-004'
                title: 'Precondition failed'
                status: 412
                detail: 'El recurso fue modificado por otro usuario. Recargue antes de editar.'
                instance: '/api/v1/quotations/142'
                code: 'COM-004'
                traceId: '0a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d'

    ConflictDuplicate:
      description: Duplicado de catálogo del módulo Almacén — nombre/código/RUC ya existe → WH-010
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: 'urn:tms:error:wh-010'
            title: 'Conflict'
            status: 409
            detail: 'Ya existe un registro con ese valor en el catálogo'
            instance: '/api/v1/warehouse/suppliers'
            code: 'WH-010'
            traceId: 'a0b1c2d3-4e5f-6a7b-8c9d-0e1f2a3b4c5d'


  schemas:

    # -------- Errores RFC 7807 ---------------------------------------------
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: URI que identifica el tipo de error (ver catálogo de errores)
          example: 'urn:tms:error:auth-001'
        title:    { type: string, example: 'Invalid credentials' }
        status:   { type: integer, example: 401 }
        detail:
          type: [string, 'null']
          example: 'Usuario o contraseña incorrectos'
        instance:
          type: [string, 'null']
          example: '/api/v1/auth/login'
        code:
          type: [string, 'null']
          description: Código corto del error para que el frontend pueda matchear sin parsear `detail`.
          example: 'AUTH-001'
        traceId:
          type: [string, 'null']
          description: Identificador de la traza para correlacionar con logs.
          example: '7c4d2f8a-1b3e-4f9a-8c2d-5e7b1a9c3d4f'
        errors:
          description: Errores de validación por campo (presente solo cuando aplica).
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:   { type: string, example: 'username' }
              message: { type: string, example: 'no debe estar vacío' }
              code:    { type: [string, 'null'], example: 'REQUIRED' }

    # -------- Enums ---------------------------------------------------------
    UserRole:
      type: string
      enum: [admin, sales, dispatcher, general_manager, operations_manager, finance_manager, warehouse_keeper]

    # -------- Auth ----------------------------------------------------------
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9._-]+$'
          example: 'lcampos'
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 100

    LoginResponse:
      type: object
      required: [token, expiresAt, expiresIn, user]
      properties:
        token:        { type: string, description: 'JWT de acceso' }
        refreshToken: { type: [string, 'null'], description: 'Token para renovar la sesión sin re-login' }
        expiresAt:    { type: string, format: date-time }
        expiresIn:    { type: integer, format: int64, description: 'Segundos hasta expiración del access token', example: 3600 }
        user:         { $ref: '#/components/schemas/UserResponse' }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 200
          maxLength: 4096
          description: 'JWT firmado emitido previamente por /auth/login o /auth/refresh.'

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password, minLength: 8, maxLength: 100 }
        newPassword:     { type: string, format: password, minLength: 8, maxLength: 100 }

    UserRef:
      description: Referencia mínima a un usuario (para embeber en respuestas)
      type: object
      required: [id, username, fullName]
      properties:
        id:       { type: integer, format: int32 }
        username: { type: string, example: 'lcampos' }
        fullName: { type: string, example: 'Valeria Torres' }
        position: { type: [string, 'null'], description: 'Cargo del trabajador (ej: Ejecutiva de Ventas)', example: 'Ejecutiva de Ventas' }

    UserResponse:
      allOf:
        - $ref: '#/components/schemas/UserRef'
        - type: object
          required: [role, isActive]
          properties:
            role:     { $ref: '#/components/schemas/UserRole' }
            isActive: { type: boolean }

    # -------- Catálogos: Currency ------------------------------------------
    CurrencyResponse:
      type: object
      required: [id, code, symbol, isActive]
      properties:
        id:       { type: integer, format: int32 }
        code:     { type: string, pattern: '^[A-Z]{3}$', example: 'PEN' }
        symbol:   { type: string, maxLength: 5, example: 'S/' }
        name:     { type: [string, 'null'], maxLength: 50 }
        isActive: { type: boolean }

    # -------- Catálogos: PaymentTerm ---------------------------------------
    PaymentTermResponse:
      type: object
      required: [id, name, days, isActive]
      properties:
        id:       { type: integer, format: int32 }
        name:     { type: string, maxLength: 100, example: '30 días' }
        days:     { type: integer, format: int32, minimum: 0, example: 30 }
        isActive: { type: boolean }

    # -------- Catálogos: Condition ----------------------------------------
    ConditionResponse:
      type: object
      required: [id, text, displayOrder, isActive]
      properties:
        id:           { type: integer, format: int32 }
        text:         { type: string, example: 'En caso el cliente cuente con seguro de carga, deberá incluir como beneficiario a Transportes Scaramutti S.A.C. ...' }
        displayOrder: { type: integer, format: int32, minimum: 1, example: 2 }
        isActive:     { type: boolean }

    QuotationConditionResponse:
      type: object
      required: [id, text, displayOrder, isActive]
      properties:
        id:           { type: integer, format: int32, example: 3 }
        text:         { type: string }
        displayOrder: { type: integer, format: int32, example: 2 }
        isActive:     { type: boolean, description: 'true salvo que la condicion se haya desactivado en el catalogo tras linkearse (snapshot historico, RN-05).' }

    # -------- CargoTypes ---------------------------------------------------
    CargoTypeRef:
      type: object
      required: [id, name]
      properties:
        id:   { type: integer, format: int32 }
        name: { type: string }

    CargoTypeResponse:
      allOf:
        - $ref: '#/components/schemas/CargoTypeRef'
        - type: object
          required: [standardWeight, isActive]
          properties:
            description:    { type: [string, 'null'] }
            standardWeight: { type: number, format: double, minimum: 0 }
            standardLength: { type: [number, 'null'], format: double, minimum: 0 }
            standardWidth:  { type: [number, 'null'], format: double, minimum: 0 }
            standardHeight: { type: [number, 'null'], format: double, minimum: 0 }
            isActive:       { type: boolean }

    PageOfCargoType:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/CargoTypeResponse' }

    CargoTypeRequest:
      type: object
      required: [name, standardWeight]
      properties:
        name:           { type: string, minLength: 1, maxLength: 100 }
        description:    { type: [string, 'null'] }
        standardWeight: { type: number, format: double, minimum: 0 }
        standardLength: { type: [number, 'null'], format: double, minimum: 0 }
        standardWidth:  { type: [number, 'null'], format: double, minimum: 0 }
        standardHeight: { type: [number, 'null'], format: double, minimum: 0 }

    # -------- Clients ------------------------------------------------------
    ClientRef:
      description: |
        Referencia a un cliente con datos de contacto (live, no snapshot).
        Si el cliente actualiza sus datos, las cotizaciones existentes verán los
        nuevos valores en su `client` embebido, excepto `quotations.contactName`
        (que sí se persiste como snapshot independiente).
      type: object
      required: [id, name, ruc]
      properties:
        id:          { type: integer, format: int32 }
        name:        { type: string }
        ruc:         { type: string, pattern: '^\d{11}$' }
        phone:       { type: [string, 'null'], pattern: '^\d{9}$' }
        contactName: { type: [string, 'null'], maxLength: 100 }

    ClientResponse:
      allOf:
        - $ref: '#/components/schemas/ClientRef'
        - type: object
          required: [isActive, createdAt]
          properties:
            isActive:  { type: boolean }
            createdAt: { type: string, format: date-time }

    ClientRequest:
      type: object
      required: [name, ruc]
      properties:
        name:        { type: string, minLength: 1, maxLength: 200 }
        ruc:         { type: string, pattern: '^\d{11}$' }
        phone:       { type: [string, 'null'], pattern: '^\d{9}$' }
        contactName: { type: [string, 'null'], maxLength: 100 }

    # -------- Paginación ---------------------------------------------------
    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages, numberOfElements, first, last, empty]
      properties:
        page:              { type: integer, format: int32, example: 0 }
        size:              { type: integer, format: int32, example: 20 }
        totalElements:     { type: integer, format: int64, example: 137 }
        totalPages:        { type: integer, format: int32, example: 7 }
        numberOfElements:  { type: integer, format: int32, description: 'Cantidad de items en la página actual', example: 20 }
        first:             { type: boolean, description: '¿Es la primera página?' }
        last:              { type: boolean, description: '¿Es la última página?' }
        empty:             { type: boolean, description: '¿La página actual está vacía?' }

    PageOfClient:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/ClientResponse' }

    QuotationSummary:
      description: |
        Versión reducida de cotización para el listado. `client` usa el subset
        del bounded context (id+name+ruc, consistente con el detalle).
        `totalAmount`/`itemsCount` se computan en runtime (no persistidos);
        `itemsCount` cuenta solo ítems root.
      type: object
      required:
        - id
        - code
        - quotationType
        - status
        - client
        - currencyCode
        - totalAmount
        - itemsCount
        - validityDays
        - isExpired
        - createdAt
        - createdBy
      properties:
        id:            { type: integer, format: int64 }
        code:          { type: string }
        quotationType: { $ref: '#/components/schemas/QuotationType' }
        status:        { $ref: '#/components/schemas/QuotationStatus' }
        client:        { $ref: '#/components/schemas/QuotationClientSummary' }
        currencyCode:  { type: string }
        totalAmount:   { type: number, format: double }
        itemsCount:    { type: integer, format: int32, description: 'Cantidad de ítems root (no incluye hijos del Servicio Integral)', example: 3 }
        validityDays:  { type: integer }
        expiresAt:     { type: string, format: date-time }
        isExpired:     { type: boolean }
        origin:        { type: [string, 'null'] }
        destination:   { type: [string, 'null'] }
        createdAt:     { type: string, format: date-time }
        createdBy:     { $ref: '#/components/schemas/UserResponse' }

    PageOfQuotationSummary:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/QuotationSummary' }

    # -------- Catálogos: QuotationServiceType ------------------------------
    QuotationServiceKind:
      type: string
      enum: [SERVICIO, ALQUILER, COMPLEMENTARIO, INTEGRAL]
      description: |
        Categoría del servicio. El backend la **computa** desde el prefijo del
        `code` (S→SERVICIO, A→ALQUILER, C→COMPLEMENTARIO, I→INTEGRAL): no es
        columna en BD. Se expone en el response para que el frontend filtre sin
        conocer la convención del prefijo.

        Reglas del wizard:
        - `quotationType=TRANSPORTE` → muestra SERVICIO + COMPLEMENTARIO + INTEGRAL
        - `quotationType=ALQUILER`   → muestra solo ALQUILER

    QuotationServiceTypeResponse:
      allOf:
        - $ref: '#/components/schemas/QuotationServiceTypeRef'
        - type: object
          required: [isActive]
          properties:
            description: { type: [string, 'null'] }
            isActive:    { type: boolean }

    # -------- Quotations ---------------------------------------------------
    QuotationType:
      type: string
      enum: [TRANSPORTE, ALQUILER]
      description: |
        - `TRANSPORTE`: requiere `origin` y `destination`. Usa tipos de servicio de transporte y complementarios.
        - `ALQUILER`: sin ruta. Solo tipos de servicio de alquiler.

    QuotationStatus:
      type: string
      enum: [DRAFT, SENT, ACCEPTED, REJECTED, EXPIRED]
      description: |
        Ciclo de vida (eje único). Máquina de estados (ADR-004):
        `DRAFT → SENT → {ACCEPTED | REJECTED | EXPIRED}`.

        - `DRAFT`: cotización en edición, no enviada al cliente.
        - `SENT`: ya enviada al cliente. Único estado que puede vencer.
        - `ACCEPTED`: el cliente la aceptó. Terminal (inmutable).
        - `REJECTED`: el cliente la rechazó (lleva `rejectionReason`). Terminal (inmutable).
        - `EXPIRED`: venció sin respuesta. Terminal (inmutable). Lo produce el job, no el usuario.

        `isExpired` se deriva del `status`: es `true` si y solo si `status == EXPIRED`.
        El job de vencimiento diario (ADR-005) pasa `SENT → EXPIRED` cuando
        `createdAt + validityDays < now()`; mientras tanto una `SENT` vencida sigue
        reportando `isExpired=false` (ventana ≤24h hasta la próxima corrida). `DRAFT` y
        los terminales no-`EXPIRED` devuelven `false`.

    QuotationServiceTypeRef:
      type: object
      required: [id, code, name, kind]
      properties:
        id:   { type: integer, format: int32 }
        code: { type: string, example: 'SCB' }
        name: { type: string, example: 'Servicio de transporte en Cama Baja' }
        kind: { $ref: '#/components/schemas/QuotationServiceKind' }

    QuotationStandbyCostRequest:
      type: object
      required: [pricePerDay]
      properties:
        pricePerDay: { type: number, format: double, minimum: 0 }
        includesIgv: { type: boolean, default: false }

    QuotationStandbyCostResponse:
      type: object
      required: [id, pricePerDay, includesIgv]
      properties:
        id:           { type: integer, format: int64 }
        pricePerDay:  { type: number, format: double, minimum: 0 }
        includesIgv:  { type: boolean }

    QuotationConfigResponse:
      description: |
        Constantes runtime del módulo Quotations expuestas al frontend.
        Los valores vienen del config del backend (`app.quotations.*`) o de
        constantes del validator. Cacheable agresivamente (raramente cambian).
      type: object
      required: [igvPercentage, maxRootItems, defaultValidityDays]
      properties:
        igvPercentage:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: 'IGV nacional vigente. Se persiste como snapshot en cada `quotation_items.igv_percentage` al crear.'
          example: 18.00
        maxRootItems:
          type: integer
          minimum: 1
          description: 'Máximo de ítems root permitidos por cotización (hijos del Servicio Integral no cuentan).'
          example: 5
        defaultValidityDays:
          type: integer
          minimum: 1
          description: 'Validez por defecto sugerida para precargar el form (el usuario puede editarla).'
          example: 15

    # ----- Quotation embedded summaries (Adapter / Anti-Corruption Layer) ---
    # Vistas resumidas de entidades externas (Client, Currency, etc.) embebidas
    # dentro del response de cotizacion. Subset intencional de los Response DTOs
    # de origen — solo los campos relevantes al contexto de cotizacion. Aislan
    # el bounded context Quotations de cambios futuros en los DTOs de otros modulos.

    QuotationClientSummary:
      type: object
      required: [id, name, ruc]
      properties:
        id:   { type: integer, format: int32 }
        name: { type: string, description: 'Razon social del cliente' }
        ruc:  { type: string, pattern: '^\d{11}$' }

    QuotationCurrencySummary:
      type: object
      required: [id, code, symbol]
      properties:
        id:     { type: integer, format: int32 }
        code:   { type: string, description: 'Codigo ISO 4217', pattern: '^[A-Z]{3}$' }
        symbol: { type: string, maxLength: 5 }

    QuotationPaymentTermSummary:
      type: object
      required: [id, name, days]
      properties:
        id:   { type: integer, format: int32 }
        name: { type: string }
        days: { type: integer, minimum: 0 }

    QuotationServiceTypeSummary:
      type: object
      required: [id, code, name, kind]
      properties:
        id:   { type: integer, format: int32 }
        code: { type: string, pattern: '^[A-Z]{2,10}$' }
        name: { type: string }
        kind: { type: string, description: 'Categoria del servicio (SERVICIO/ALQUILER/COMPLEMENTARIO/INTEGRAL)' }

    QuotationCargoTypeSummary:
      description: |
        Subset minimo del tipo de carga para embeber en items de la cotizacion.
        Las dimensiones del catalogo (standardWeight/Length/Width/Height) NO se
        incluyen aca: el item persiste su propio weightKg/lengthMeters/...
        como snapshot. Los valores de referencia del catalogo siguen disponibles
        via GET /catalogs/cargo-types/{id} si se necesitan.
      type: object
      required: [id, name]
      properties:
        id:   { type: integer, format: int32 }
        name: { type: string }

    QuotationItemRequest:
      description: |
        Item de cotización. **`unitPrice` es requerido para ítems root**; para hijos del
        Servicio Integral debe omitirse o enviarse como 0 (en su lugar puede enviarse
        `internalReferencePrice`).
      type: object
      required: [serviceTypeId, quantity]
      properties:
        itemNumber:
          type: [integer, 'null']
          format: int32
          description: 'Si se omite, lo asigna el backend en orden de aparición. Si la cotización tiene Integral, debe ser `1`.'
        parentItemNumber:
          type: [integer, 'null']
          format: int32
          description: 'Para ítems hijos del Integral, referencia al `itemNumber` del padre dentro del mismo request (siempre `1`).'
        serviceTypeId: { type: integer, format: int32 }
        cargoTypeId:   { type: [integer, 'null'], format: int32 }
        observations:  { type: [string, 'null'] }
        weightKg:      { type: [number, 'null'], format: double, minimum: 0 }
        lengthMeters:  { type: [number, 'null'], format: double, minimum: 0 }
        widthMeters:   { type: [number, 'null'], format: double, minimum: 0 }
        heightMeters:  { type: [number, 'null'], format: double, minimum: 0 }
        quantity:      { type: integer, minimum: 1, default: 1 }
        unitPrice:
          type: [number, 'null']
          format: double
          minimum: 0
          description: 'Requerido para ítems root. Para hijos del Integral debe omitirse o ser 0.'
        internalReferencePrice:
          type: [number, 'null']
          format: double
          minimum: 0
          description: 'Solo válido para hijos del Integral. Opcional. NO se muestra en el PDF.'
        # igvPercentage NO se acepta en el request — el backend lo resuelve desde
        # config (IGV nacional uniforme). Se persiste como snapshot en cada item
        # y se devuelve en el response.
        insuredAmount: { type: [number, 'null'], format: double, minimum: 0, description: 'Solo válido si `serviceTypeId` corresponde a SEG.' }
        standby:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/QuotationStandbyCostRequest'

    QuotationItemResponse:
      description: |
        Ítem de cotización. Puede ser **root** (sin `parentItemId`) o **hijo del Servicio
        Integral** (con `parentItemId` apuntando al padre).

        **Pricing según tipo:**
        - Ítems root: `unitPrice` es el precio que paga el cliente, IGV calculado al 18%.
        - Hijos del Integral: `unitPrice` no aplica (siempre 0); usan `internalReferencePrice`
          opcional, que es referencia histórica interna y NO se muestra en el PDF al cliente.
          La suma de referencias de hijos puede exceder el precio del padre (es el descuento
          implícito del paquete Integral).
      type: object
      required: [id, itemNumber, displayLabel, serviceType, quantity, igvPercentage, subtotal]
      properties:
        id:             { type: integer, format: int64 }
        parentItemId:
          type: [integer, 'null']
          format: int64
          description: 'NULL para ítems root. Set para ítems hijos del Servicio Integral.'
        itemNumber:     { type: integer, format: int32 }
        displayLabel:
          type: string
          description: 'Numeración de presentación jerárquica: root "1","2"; hijo del Integral "1.a","1.b". Derivada de itemNumber + jerarquía, NO persistida. El frontend la muestra; itemNumber sigue siendo la numeración técnica (plana, contigua).'
        serviceType:    { $ref: '#/components/schemas/QuotationServiceTypeSummary' }
        cargoType:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/QuotationCargoTypeSummary'
        observations:   { type: [string, 'null'] }
        weightKg:       { type: [number, 'null'], format: double, minimum: 0 }
        lengthMeters:   { type: [number, 'null'], format: double, minimum: 0 }
        widthMeters:    { type: [number, 'null'], format: double, minimum: 0 }
        heightMeters:   { type: [number, 'null'], format: double, minimum: 0 }
        quantity:       { type: integer, minimum: 1 }
        unitPrice:
          type: number
          format: double
          minimum: 0
          description: 'Precio unitario que paga el cliente. Aplica solo para ítems root. En hijos del Integral siempre es 0 (usar `internalReferencePrice`).'
        internalReferencePrice:
          type: [number, 'null']
          format: double
          minimum: 0
          description: 'Precio interno de referencia. Solo aplica para ítems hijos del Servicio Integral. NO se muestra en el PDF al cliente. Opcional.'
        igvPercentage:  { type: number, format: double, minimum: 0, maximum: 100, example: 18.00 }
        subtotal:
          type: number
          format: double
          description: '`unitPrice * quantity` para root; 0 para hijos del Integral (no entran al total de la cotización).'
        insuredAmount:
          type: [number, 'null']
          format: double
          minimum: 0
          description: 'Solo aplica para ítems de tipo Seguro de Carga (SEG).'
        standby:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/QuotationStandbyCostResponse'
        children:
          description: 'Ítems hijos (presente solo en ítems padre del Servicio Integral).'
          type: array
          items: { $ref: '#/components/schemas/QuotationItemResponse' }

    QuotationRequest:
      description: |
        ## Reglas de negocio (validadas por backend)

        - **Máximo 5 ítems root** (los hijos del Servicio Integral no cuentan).
        - **Servicio Integral**: si la cotización tiene un ítem con `serviceType.code='INT'`:
          - debe ser el primer ítem (`itemNumber=1`),
          - debe tener al menos **2 ítems hijos** (referenciados vía `parentItemNumber=1`),
          - los hijos deben incluir al menos **1 servicio de tipo TRANSPORTE (kind=S)** y
            al menos **1 servicio de tipo COMPLEMENTARIO (kind=C)**,
          - solo puede haber un Integral por cotización.
        - **Origen/destino**: requeridos si `quotationType=TRANSPORTE`, ignorados si `ALQUILER`.
        - **`contactName`**: snapshot editable. Se precarga desde `client.contactName` en el
          formulario, pero el usuario puede editarlo. Lo que se guarda es el valor final del
          formulario, congelado al momento de crear/editar la cotización.
        - **Anti-duplicado**: el backend rechaza con `409 QUO-002` si llega un POST con
          mismo `clientId` + mismo set de `serviceTypeId`s + mismo usuario creador dentro
          de los últimos 30 segundos (protección anti doble-click backend-side).
      type: object
      required: [quotationType, clientId, contactName, currencyId, validityDays, items]
      properties:
        quotationType:        { $ref: '#/components/schemas/QuotationType' }
        clientId:             { type: integer, format: int32 }
        contactName:          { type: string, minLength: 1, maxLength: 200, description: 'Obligatorio — la cotización siempre se dirige a alguien. Snapshot al momento de cotizar (se precarga del cliente, el usuario puede editarlo, queda congelado).' }
        contactPhone:         { type: [string, 'null'], pattern: '^\d{9}$', description: 'Snapshot editable del telefono de contacto (9 digitos numericos). Se precarga del cliente y queda congelado en la cotización.' }
        currencyId:           { type: integer, format: int32 }
        paymentTermId:        { type: [integer, 'null'], format: int32 }
        tentativeServiceDate: { type: [string, 'null'], format: date }
        validityDays:         { type: integer, minimum: 1, maximum: 365, example: 15 }
        origin:
          type: [string, 'null']
          description: 'Requerido si `quotationType=TRANSPORTE`. Validado por backend.'
          maxLength: 255
        destination:
          type: [string, 'null']
          description: 'Requerido si `quotationType=TRANSPORTE`. Validado por backend.'
          maxLength: 255
        clientNote:
          type: [string, 'null']
          maxLength: 500
          description: 'Observación opcional visible para el cliente (se renderiza en el PDF tras el stand-by y en la UI). Texto libre.'
        internalNote:
          type: [string, 'null']
          maxLength: 500
          description: 'Observación opcional SOLO interna. NUNCA se incluye en el PDF ni en ninguna salida hacia el cliente (RN-03).'
        items:
          type: array
          minItems: 1
          description: 'Lista plana de ítems root e hijos. Los hijos referencian al padre vía `parentItemNumber`. Máximo 5 ítems root (validado por backend).'
          items: { $ref: '#/components/schemas/QuotationItemRequest' }
        conditionIds:
          type: [array, 'null']
          maxItems: 20
          description: |
            Ids de las condiciones generales del catálogo que aplican a la cotización
            (checkboxes en el wizard). Opcional: `null` o `[]` = sin condiciones (el usuario
            puede desmarcar todas). Máximo 20 elementos (`400 COM-001` si se excede). Al
            crear/editar (escritura), todas deben existir y estar **activas** (Opción B): una
            condición desactivada → `409 QUO-007`; ids repetidos o inexistentes → `400 COM-001`.
          items: { type: integer, format: int32 }

    QuotationResponse:
      type: object
      required:
        - id
        - code
        - quotationType
        - status
        - client
        - currency
        - validityDays
        - expiresAt
        - isExpired
        - items
        - conditions
        - totalSubtotal
        - totalIgv
        - totalAmount
        - createdBy
        - updatedBy
        - createdAt
        - updatedAt
      properties:
        id:            { type: integer, format: int64 }
        code:          { type: string, example: '2026-00042' }
        quotationType: { $ref: '#/components/schemas/QuotationType' }
        status:        { $ref: '#/components/schemas/QuotationStatus' }
        client:        { $ref: '#/components/schemas/QuotationClientSummary' }
        contactName:
          type: [string, 'null']
          description: 'Snapshot del contacto al momento de cotizar (queda fijo aunque cambie el cliente master).'
        contactPhone:
          type: [string, 'null']
          pattern: '^\d{9}$'
          description: 'Snapshot del telefono de contacto al momento de cotizar (9 digitos). Queda fijo aunque cambie el cliente master.'
        currency:      { $ref: '#/components/schemas/QuotationCurrencySummary' }
        paymentTerm:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/QuotationPaymentTermSummary'
        tentativeServiceDate: { type: [string, 'null'], format: date }
        validityDays: { type: integer, minimum: 1, maximum: 365, example: 15 }
        expiresAt:    { type: string, format: date-time, description: 'createdAt + validityDays (computado)' }
        isExpired:    { type: boolean, description: 'status == EXPIRED (lo persiste el job diario, ADR-005; no se recalcula por fechas)' }
        origin:       { type: [string, 'null'] }
        destination:  { type: [string, 'null'] }
        clientNote:   { type: [string, 'null'], maxLength: 500, description: 'Observación visible para el cliente (PDF + UI).' }
        internalNote: { type: [string, 'null'], maxLength: 500, description: 'Observación SOLO interna; se devuelve a los roles que editan, nunca en el PDF (RN-03).' }
        rejectionReason: { type: [string, 'null'], maxLength: 500, description: 'Motivo del rechazo. Presente solo si status=REJECTED. INTERNO — se devuelve a los roles que editan, NUNCA en el PDF (ADR-007).' }
        totalSubtotal: { type: number, format: double, description: 'Suma de items.subtotal' }
        totalIgv:      { type: number, format: double, description: 'IGV total' }
        totalAmount:   { type: number, format: double, description: 'Total = subtotal + IGV' }
        items:
          type: array
          items: { $ref: '#/components/schemas/QuotationItemResponse' }
        conditions:
          type: array
          description: 'Condiciones generales linkeadas, ordenadas por displayOrder ASC (RN-04). Incluye TODAS las linkeadas, activas O inactivas (RN-05, snapshot). Vacia si no hay (nunca null).'
          items: { $ref: '#/components/schemas/QuotationConditionResponse' }
        createdBy: { $ref: '#/components/schemas/UserResponse' }
        updatedBy: { $ref: '#/components/schemas/UserResponse' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: 'Source de la versión para optimistic locking (mismo valor que el header ETag).' }

    WarehouseProductCategoryResponse:
