# ==========================================
# Gateway — variante para el compose de INTEGRACIÓN LOCAL.
# Un solo origin ruteado por prefijo de path, contra nombres de contenedor
# fijos por HTTP.
#
# ⚠️ La que corre en PRODUCCIÓN es `default.conf.template`, que usa HTTPS y
# ${INTERNAL_SUFFIX}. Las dos tienen que declarar el MISMO ruteo: un cambio
# aplicado en una sola pasa la prueba local y rompe Azure, o al revés.
# ==========================================
server {
    listen 80;

    # Redirects RELATIVOS: nginx no conoce el puerto externo (8085 del gateway
    # en integración, 8080 del frontend v2 en acceso directo) y los 302
    # absolutos lo perdían. El browser resuelve contra el host:puerto actual.
    absolute_redirect off;

    # Health propio del gateway: no depende de ningún destino, así que
    # responde aunque un upstream esté caído.
    location = /gateway/health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # --- v2: API (Quarkus) ---
    # proxy_pass sin URI: reenvía el path original intacto (/api/v1/...).
    location /api/v1/ {
        proxy_pass http://scaramutti-tms-v2-backend-prod:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- v2: SPA (React, servida bajo /cotizaciones/) ---
    location /cotizaciones/ {
        proxy_pass http://scaramutti-tms-v2-frontend-prod:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sin slash final → normalizar
    location = /cotizaciones {
        return 302 /cotizaciones/;
    }

    # --- Contrato NEUTRAL de la plataforma: /login ---
    # La pantalla de login única es un detalle interno: HOY vive en la SPA de
    # v2. Los consumidores (bookmarks, futuros servicios) referencian
    # /login; si el auth se extrae a su propio servicio, SOLO cambia esta línea.
    location = /login {
        return 302 /cotizaciones/login;
    }
    # /api/v1 exacto (sin slash) cae en `location /` y su 302 perdería el
    # método y el cuerpo. El 308 los preserva (importa para POST/PUT).
    location = /api/v1 {
        return 308 /api/v1/;
    }

    # --- Todo lo demás va a la SPA ---
    # Acá vivía el bloque que ruteaba a v1, retirado en el cutover.
    #
    # Importa el porqué: nginx resuelve los destinos de `proxy_pass` AL
    # ARRANCAR, y si uno no resuelve NO levanta. Escalar una aplicación a cero
    # no rompe esa resolución (medido); borrarla sí la rompería (no
    # verificado). El orden vale igual bajo las dos: al retirar un destino se
    # despliega primero el gateway que ya no lo nombra.
    #
    # El 302 además evita que los enlaces guardados de v1 queden en la nada.
    location / {
        return 302 /cotizaciones/;
    }
}
