# Conf de nginx para el frontend de STAGING.
# Igual a frontend/nginx.conf salvo el upstream del proxy y el largo de los
# comentarios: acá apunta al backend de staging (la conf horneada en la imagen
# apunta al de prod). El compose la monta encima de la conf horneada, así que un
# cambio en frontend/nginx.conf NO llega a staging si no se replica acá.
server {
    listen 80;

    # Redirects RELATIVOS: nginx no conoce el puerto externo y en un redirect
    # absoluto lo perdía. Ya no hay 302 escritos acá, pero la directiva se queda:
    # `try_files` con `$uri/` emite un 301 implícito al agregar la barra final.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Los assets llevan un hash del contenido en el nombre, así que una de esas
    # URLs nunca cambia de contenido: se puede guardar un año sin volver a
    # preguntar. Va antes por legibilidad; nginx elige por prefijo más largo.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # La SPA se sirve desde la raíz del dominio. Hasta la mudanza de 2026-09 vivía
    # bajo /cotizaciones, el prefijo con el que convivía con la v1 detrás de un
    # gateway; retirada la v1, el prefijo dejó de tener sentido y las rutas viejas
    # no tienen redirección acá: las resuelve la aplicación, que manda a cada rol a
    # su pantalla principal.
    #
    # El documento sí cambia con cada despliegue: `no-cache` obliga a revalidarlo,
    # y con el ETag que nginx ya manda, revalidar cuesta un 304.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Proxy al backend Quarkus de staging
    location /api/ {
        proxy_pass http://backend-staging:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
