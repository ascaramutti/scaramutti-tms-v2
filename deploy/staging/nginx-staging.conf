# Conf de nginx para el frontend de STAGING.
# Igual a frontend/nginx.conf salvo el upstream del proxy y el largo de los
# comentarios: acá apunta al backend de staging (la conf horneada en la imagen
# apunta al de prod). El compose la monta encima de la conf horneada, así que un
# cambio en frontend/nginx.conf NO llega a staging si no se replica acá.
server {
    listen 80;

    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Los assets llevan un hash del contenido en el nombre: esa URL nunca cambia
    # de contenido y se puede guardar un año sin volver a preguntar.
    location /cotizaciones/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # La SPA vive bajo /cotizaciones/ (Vite base). El documento sí cambia con cada
    # despliegue: `no-cache` obliga a revalidarlo, y con el ETag eso cuesta un 304.
    location /cotizaciones/ {
        try_files $uri $uri/ /cotizaciones/index.html;
        add_header Cache-Control "no-cache";
    }

    location = / {
        return 302 /cotizaciones/;
    }

    # Cortesía de transición: bookmarks viejos a las rutas pre-/cotizaciones
    location = /login {
        return 302 /cotizaciones/login;
    }
    location = /cuenta/cambiar-contrasena {
        return 302 /cotizaciones/cuenta/cambiar-contrasena;
    }

    # Proxy al backend Quarkus de staging
    location /api/ {
        proxy_pass http://backend-staging:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
