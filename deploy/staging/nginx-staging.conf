# Conf de nginx para el frontend de STAGING.
# Igual a frontend/nginx.conf salvo el upstream del proxy: acá apunta al
# backend de staging (la conf horneada en la imagen apunta al de prod).
server {
    listen 80;

    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # La SPA vive bajo /cotizaciones/ (Vite base)
    location /cotizaciones/ {
        try_files $uri $uri/ /cotizaciones/index.html;
    }

    location = / {
        return 302 /cotizaciones/;
    }

    # Cortesía de transición: bookmarks viejos a las rutas pre-/cotizaciones
    location = /login {
        return 302 /cotizaciones/login;
    }
    location = /cuenta/cambiar-contrasena {
        return 302 /cotizaciones/cuenta/cambiar-contrasena;
    }

    # Proxy al backend Quarkus de staging
    location /api/ {
        proxy_pass http://backend-staging:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
