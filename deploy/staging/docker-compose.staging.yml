# ==========================================
# Docker Compose - STAGING (server on-prem, acceso solo por Tailscale)
# DB restaurada del backup diario de prod (restore-staging-db.sh) +
# backend/frontend construidos desde develop por el runner self-hosted.
#
# Valores reales (IPs, passwords, rutas de claves) viven en un env file
# LOCAL del server fuera del repo (ver README.md); acá solo variables.
#   docker compose --env-file /opt/tms-staging/staging.env \
#     -f deploy/staging/docker-compose.staging.yml up -d
# ==========================================
name: scaramutti-tms-v2-staging

services:
  db-staging:
    # Pineado ≥16.14: el dump diario usa \restrict (psql 16.10+); una imagen
    # postgres:16 vieja cacheada en el server rompería el restore.
    image: postgres:16.14
    container_name: scaramutti-tms-v2-db-staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?falta DB_USERNAME en el env file}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el env file}
      POSTGRES_DB: ${STAGING_DB_NAME:-scaramutti_tms_staging}
    volumes:
      - db-staging-data:/var/lib/postgresql/data
      # Crea los roles que el dump de prod (Azure) referencia (azure_pg_admin)
      - ./init:/docker-entrypoint-initdb.d:ro
    # Sin ports: solo el backend habla con la DB por la red interna del compose.
    networks:
      - staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-staging:
    build:
      context: ../../backend
      target: production
    image: scaramutti-tms-v2-backend-staging
    container_name: scaramutti-tms-v2-backend-staging
    restart: unless-stopped
    environment:
      QUARKUS_PROFILE: prod
      DB_USERNAME: ${DB_USERNAME:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      DB_JDBC_URL: jdbc:postgresql://db-staging:5432/${STAGING_DB_NAME:-scaramutti_tms_staging}
      # Front y API comparten origin (nginx hace proxy) → CORS casi no aplica,
      # pero la propiedad es obligatoria. Ej: http://<ip-tailscale>:8088
      CORS_ORIGINS: ${CORS_ORIGINS:?falta CORS_ORIGINS en el env file}
      # Con esquema file: — sin él SmallRye lo trata como URL y el login
      # revienta con MalformedURLException (mismo formato que integration)
      JWT_PUBLIC_KEY_LOCATION: file:/app/keys/publicKey.pem
      JWT_PRIVATE_KEY_LOCATION: file:/app/keys/privateKey.pem
      ACCESS_TOKEN_LIFESPAN_SECONDS: ${ACCESS_TOKEN_LIFESPAN_SECONDS:-900}
      REFRESH_TOKEN_LIFESPAN_SECONDS: ${REFRESH_TOKEN_LIFESPAN_SECONDS:-28800}
    volumes:
      # Claves JWT propias de staging (NO las de prod), generadas en el server
      - ${STAGING_KEYS_DIR:?falta STAGING_KEYS_DIR en el env file}:/app/keys:ro
    expose:
      - "8080"
    networks:
      - staging
    depends_on:
      db-staging:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/api/v1/q/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  frontend-staging:
    build:
      context: ../../frontend
      target: production
      args:
        VITE_API_BASE_URL: /api/v1
    image: scaramutti-tms-v2-frontend-staging
    container_name: scaramutti-tms-v2-frontend-staging
    restart: unless-stopped
    volumes:
      # Sobreescribe la conf horneada (apunta al backend de PROD por nombre)
      - ./nginx-staging.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Publicado SOLO en la interfaz de Tailscale del server (repo público:
      # la IP real va en el env file local, nunca acá).
      - "${STAGING_BIND_IP:?falta STAGING_BIND_IP en el env file}:${STAGING_HTTP_PORT:-8088}:80"
    networks:
      - staging
    depends_on:
      backend-staging:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

networks:
  staging:
    driver: bridge

volumes:
  db-staging-data:
