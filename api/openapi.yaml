  # ----- Catalogs: Quotation Conditions --------------------------------------

  /quotation-conditions:
    get:
      tags: [Catalogs]
      operationId: listQuotationConditions
      summary: Listar condiciones generales del catálogo (filtrable por isActive)
      description: |
        Catálogo de condiciones generales del PDF, ordenadas por `displayOrder` ascendente
        (ADR-009/ADR-010). Sigue la **convención de filtro nullable** del resto de catálogos
        (`listCurrencies`/`listPaymentTerms`/`listQuotationServiceTypes`):
        - `isActive` **omitido** → todas (activas + inactivas).
        - `isActive=true` → solo activas — lo que usa el **wizard** para elegir (RN-07).
        - `isActive=false` → solo inactivas.

        Un mismo endpoint sirve al wizard (hoy) y a un futuro CRUD admin del catálogo
        (DA-02) sin cambios. El snapshot histórico de una cotización (incluidas las
        inactivas linkeadas) se resuelve en su detalle (`QuotationResponse.conditions`),
        no acá.

        Acceso: cualquier usuario autenticado, igual que el resto de catálogos del módulo.
        Cacheable (cambia raramente).
      parameters:
        - name: isActive
          in: query
          required: false
          description: 'Filtro nullable (convención de catálogos): omitido = todas; true = solo activas (lo que usa el wizard, RN-07); false = solo inactivas.'
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConditionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

