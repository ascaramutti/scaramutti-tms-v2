  # ----- Catálogos compartidos (schema public) --------------------------------

  /workers:
    get:
      tags: [SharedCatalogs]
      operationId: listWorkers
      summary: Listar trabajadores (combobox "quién recibe" del retiro)
      description: |
        Catálogo compartido `public.workers` (solo lectura desde v2; el ABM sigue
        en v1). **Solo búsqueda rápida — SIN creación al vuelo** (regla del dueño
        2026-07-04: trabajadores y unidades de flota nunca se crean desde
        almacén; RN-WH9). Sin paginar — plantilla chica. `q` es multi-palabra
        case-insensitive (≥ 3 caracteres): cada palabra debe matchear en el
        nombre O el apellido (RN-WH14); para no filtrar, OMITIR el parámetro.
        Operaciones NO lo consume: para asignar un viaje necesita conductores
        (`GET /drivers`), no la planilla completa.
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper]
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 3, maxLength: 200 } }
        - { name: isActive, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Trabajadores
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkerResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /fleet-units:
    get:
      tags: [SharedCatalogs]
      operationId: listFleetUnits
      summary: Listar unidades de flota unificadas (tractos + carretas + escoltas)
      description: |
        Vista unificada de los tres subtipos DISYUNTOS de la flota
        (`public.tractors`, `public.trailers`, `public.escort_vehicles` — esta
        última nace con la V003). El supertipo físico `fleet_units` llega en la
        fase flota/RRHH; mientras tanto la unión se hace en código.
        **Solo búsqueda rápida/selección — SIN creación al vuelo** (regla del
        dueño 2026-07-04: la flota nunca se crea desde almacén; RN-WH9).

        **`id` es el id de la tabla del SUBTIPO** — la dirección de una unidad es
        el par `(kind, id)`; el frontend lo mapea a `tractorId | trailerId |
        escortVehicleId` en el request del retiro. Sin paginar — flota chica.

        Lo consumen los dos módulos: almacén elige la unidad destino del retiro
        (los tres subtipos) y operaciones elige tracto y carreta al asignar un
        viaje (`?kind=TRACTOR` / `?kind=TRAILER`), por eso la respuesta incluye
        `status` (disponibilidad). Las escoltas no participan de la asignación de
        viajes: su `status` viaja en null. Además de quienes asignan recursos,
        `sales` puede consultarlos: registra y edita servicios.
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper, dispatcher, sales]
      parameters:
        - name: kind
          in: query
          description: Filtra por subtipo. Omitido = los tres.
          schema: { $ref: '#/components/schemas/FleetUnitKind' }
        - { name: isActive, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Unidades de flota
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FleetUnitResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /drivers:
    get:
      tags: [SharedCatalogs]
      operationId: listDrivers
      summary: Listar conductores (combobox de asignación del viaje)
      description: |
        Catálogo compartido `public.drivers`: quién puede conducir, con su
        licencia y su disponibilidad. El nombre sale del trabajador asociado, y
        el `id` que devuelve es el que guarda la asignación del servicio.
        **Solo lectura desde v2, sin creación al vuelo** — el alta de conductores
        pertenece a la futura gestión de flota y personal. Sin paginar: plantilla
        chica. Además de quienes asignan recursos, `sales` puede consultarlos:
        registra y edita servicios.
      x-required-roles: [admin, general_manager, operations_manager, dispatcher, sales]
      parameters:
        - { name: isActive, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Conductores con su disponibilidad
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DriverResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ----- Warehouse: catálogos del módulo (schema almacen) ---------------------
  # Prefijo /warehouse/* para todo lo propio del módulo (evita colisiones de
  # paths genéricos como /products con futuros módulos). Patrón combobox
  # buscar + crear al vuelo (RN-WH9): GET con búsqueda + POST desde el modal.

  /warehouse/product-categories:
    get:
      tags: [Warehouse]
      operationId: listWarehouseProductCategories
      summary: Listar categorías de producto
      description: Catálogo chico — sin paginar. Orden natural `name` ASC.
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper]
      parameters:
        - { name: isActive, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Categorías
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WarehouseProductCategoryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Warehouse]
      operationId: createWarehouseProductCategory
      summary: Crear categoría de producto (al vuelo desde el form)
      description: Nombre único (case-insensitive efectivo) → `409 WH-010` (RN-WH10).
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseProductCategoryRequest' }
            example: { name: 'Filtros', description: 'Filtros de aceite, aire y combustible' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseProductCategoryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Nombre duplicado → WH-010
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: 'urn:tms:error:wh-010'
                title: 'Conflict'
                status: 409
                detail: "Ya existe una categoría con el nombre 'Filtros'"
                instance: '/api/v1/warehouse/product-categories'
                code: 'WH-010'
                traceId: '1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d'

  /warehouse/units-of-measure:
    get:
      tags: [Warehouse]
      operationId: listWarehouseUnitsOfMeasure
      summary: Listar unidades de medida (lista CERRADA)
      description: |
        Catálogo chico (seed UND, LT, GAL, KG, MT, CJA, JGO) — sin paginar.
        Orden `code` ASC. **Lista CERRADA — SIN POST** (regla del dueño
        2026-07-04): no se crea al vuelo; agregar una unidad nueva = seed/
        migración coordinada. El select del form es de solo selección.
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper]
      parameters:
        - { name: isActive, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Unidades de medida
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WarehouseUnitOfMeasureResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /warehouse/suppliers:
    get:
      tags: [Warehouse]
      operationId: listWarehouseSuppliers
      summary: Buscar proveedores (paginado)
      description: |
        Con `q` filtra por substring case-insensitive en `name` y `ruc` (ILIKE
        acelerado por GIN trgm `idx_suppliers_name_trgm`), ranking `similarity`
        DESC, tiebreak `name` ASC. Multi-palabra: `q` se tokeniza por espacios y
        cada palabra debe matchear en ALGÚN campo (AND de ORs) — RN-WH14.
        Sin `q`: `name` ASC. Para no filtrar, OMITIR el parámetro (no enviarlo
        vacío).
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper]
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 3, maxLength: 200 } }
        - { name: isActive, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Página de proveedores
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOfWarehouseSupplier' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Warehouse]
      operationId: createWarehouseSupplier
      summary: Crear proveedor (al vuelo desde el form de factura)
      description: '`name` y `ruc` únicos → `409 WH-010` (el `detail` dice cuál chocó).'
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseSupplierRequest' }
            example: { name: 'REPUESTOS DIÉSEL S.A.C.', ruc: '20512345678', phone: '014567890', contactName: 'Juan Ramos' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseSupplierResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ConflictDuplicate' }

  # ----- Warehouse: productos, stock y kardex ---------------------------------

  /warehouse/products:
    get:
      tags: [Warehouse]
      operationId: listWarehouseProducts
      summary: Listar productos CON su stock actual (Existencias y comboboxes)
      description: |
        Un solo listado sirve a la pantalla Existencias y a los comboboxes de
        producto (decisión D-4 del contrato): cada fila trae `stock` y `lowStock`
        LEÍDOS de la VIEW `almacen.product_stock` (RN-WH1 — nunca persistidos).

        `q` (≥ 3) filtra por substring case-insensitive en `name`, `code`,
        `brand` y `partNumber` (GIN trgm en `name`), ranking `similarity` DESC,
        tiebreak `name` ASC. Multi-palabra: cada palabra de `q` debe matchear
        en ALGÚN campo (AND de ORs) — "filtro bosch" encuentra name=Filtro +
        brand=Bosch (RN-WH14). `attributes` (JSONB) NO se busca. Sin `q`:
        `name` ASC.
        `lowStock = stock < minStock` (estricto) — derivado en código de la VIEW
        + `min_stock`; NO es columna (RN-WH11).
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper]
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 3, maxLength: 200 } }
        - { name: categoryId, in: query, schema: { type: integer } }
        - { name: isActive, in: query, schema: { type: boolean } }
        - name: lowOnly
          in: query
          description: 'Si `true`, solo productos con `stock < minStock` (badge "Bajo").'
          schema: { type: boolean, default: false }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Página de productos con stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOfWarehouseProduct' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Warehouse]
      operationId: createWarehouseProduct
      summary: Crear producto (al vuelo desde la factura o desde Existencias)
      description: |
        Identidad ÚNICA compuesta `(name, brand, partNumber)` → `409 WH-010`
        (Δ-2, RN-WH10): mismo nombre y marca pueden coexistir con distinto n° de
        parte (variantes/modelos); comparación case-insensitive y los opcionales
        vacíos cuentan como "sin valor" (el backend normaliza trim + vacío→null;
        índice con COALESCE — dos genéricos idénticos sin marca/parte también
        chocan). El `code` (SKU) lo asigna siempre el backend (`PRO-NNNN`,
        correlativo); no se acepta en el request.
        `attributes` = objeto JSON libre clave-valor (JSONB).
        Un producto nuevo **nace con stock 0** — su primera factura es su primer
        movimiento; el corte inicial es SOLO para inventario pre-existente (RN-WH6).
        Duplicados: el guardián es el índice único de identidad compuesta → `409
        WH-010`; no hay cabecera de idempotencia (redundante frente al índice,
        consistente con el resto del módulo).
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseProductRequest' }
            example:
              name: 'Filtro de aceite XYZ'
              categoryId: 7
              unitOfMeasureId: 1
              brand: 'Bosch'
              partNumber: 'F026407123'
              attributes: { rosca: '3/4-16' }
              minStock: 4
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseProductResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ConflictDuplicate' }

  /warehouse/products/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Warehouse]
      operationId: getWarehouseProduct
      summary: Obtener producto por ID (con stock actual)
      description: |
        El header `ETag` (versión opaca del `updatedAt`) es el que exige el PUT
        vía `If-Match` para el optimistic locking. Usar el HEADER, no el
        `updatedAt` del body (lección del CRUD de cotizaciones: difieren por µs
        entre memoria y BD y provocan un 412 espurio).
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper]
      responses:
        '200':
          description: Producto con stock
          headers:
            ETag: { schema: { type: string }, description: Versión opaca para If-Match }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseProductResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Warehouse]
      operationId: updateWarehouseProduct
      summary: Actualizar producto (catálogo — sin justificación)
      description: |
        Edición de catálogo: nombre, categoría, marca, nº de parte, atributos,
        `minStock`, observaciones, `isActive` (soft delete). La **unidad de
        medida NO viaja** — se fija al crear y es inmutable (P-1 respondida por
        el dueño 2026-07-04: "solo se permite crear; la edición se verá luego").
        NO exige justificación — la regla editar-con-justificación (RN-WH4)
        aplica a movimientos de stock (entradas/retiros), no al catálogo
        (RN-WH15; P-2 respondida: sin auditoría). Identidad compuesta
        `(name, brand, partNumber)` única (Δ-2) y `code` único → `409 WH-010`.
        No afecta el kardex (los movimientos referencian por id).
        `If-Match` obligatorio (optimistic locking): versión vieja → `412
        COM-004`. El ETag a enviar es el HEADER del GET o del PUT anterior.
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper]
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseProductUpdateRequest' }
      responses:
        '200':
          description: Actualizado
          headers:
            ETag: { schema: { type: string }, description: Nueva versión opaca para el próximo If-Match }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseProductResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ConflictDuplicate' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /warehouse/products/{id}/stock:
    get:
      tags: [Warehouse]
      operationId: getWarehouseProductStock
      summary: Stock disponible en vivo (form de retiro)
      description: |
        Lectura puntual de la VIEW `almacen.product_stock` — el form de retiro
        muestra el disponible al elegir producto y bloquea el submit si excede
        (espejo UX). La validación AUTORITATIVA sigue siendo la del POST/PUT del
        retiro en transacción (`409 WH-001`, RN-WH2).
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Stock del producto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseProductStockResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /warehouse/products/{id}/kardex:
    get:
      tags: [Warehouse]
      operationId: getWarehouseProductKardex
      summary: Kardex del producto (movimientos con saldo corrido)
      description: |
        Lee la VIEW `almacen.stock_movements`: APERTURA ∪ ENTRADAS activas ∪
        SALIDAS activas — los ANULADOS no aparecen (su efecto fue revertido;
        quedan visibles en sus listados con badge y motivo). Orden `movedAt`
        DESC (más reciente arriba). `balance` = saldo DESPUÉS del movimiento,
        calculado por el backend sobre la historia completa — correcto aunque se
        pagine o filtre por fechas (RN-WH13).
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: dateFrom, in: query, description: 'Desde (inclusive, América/Lima)', schema: { type: string, format: date } }
        - { name: dateTo, in: query, description: 'Hasta (inclusive del día completo, América/Lima)', schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Página de movimientos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOfWarehouseKardexMovement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----- Warehouse: corte inicial de inventario --------------------------------

  /warehouse/opening-balances:
    get:
      tags: [Warehouse]
      operationId: listWarehouseOpeningBalances
      summary: Listar cortes iniciales registrados
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper]
      parameters:
        - { name: productId, in: query, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Página de aperturas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOfWarehouseOpeningBalance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Warehouse]
      operationId: createWarehouseOpeningBalance
      summary: Registrar corte inicial de un producto ("con cuánto arranca")
      description: |
        RN-WH6: UNA apertura por producto e INMUTABLE (sin PUT/DELETE — una
        corrección se hace anulando retiros o registrando una entrada). Es el
        primer movimiento del kardex (`APERTURA`). Solo para inventario existente
        al arranque (o al incorporar un producto que ya existía físicamente).

        - Producto con apertura ya registrada → **409 `WH-009`** (UNIQUE en BD).
        - Producto que ya tiene movimientos → **409 `WH-011`** (una apertura
          posterior falsearía el saldo corrido — decisión D-5).
        - Producto inexistente o inactivo → **400 `WH-004`**.

        Registrarlo queda restringido a `admin`: fija la línea base del kardex, es
        inmutable y no tiene anulación, así que un error solo se corrige en base de
        datos. Consultar las aperturas sigue abierto a los roles del módulo.
      x-required-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseOpeningBalanceRequest' }
            example: { productId: 12, quantity: 6, observations: 'Conteo físico del 30/06' }
      responses:
        '201':
          description: Registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseOpeningBalanceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: WH-009 (apertura duplicada) o WH-011 (producto con movimientos)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                openingAlreadyExists:
                  summary: El producto ya tiene su corte inicial
                  value:
                    type: 'urn:tms:error:wh-009'
                    title: 'Conflict'
                    status: 409
                    detail: "El producto 'Filtro de aceite XYZ' ya tiene corte inicial registrado"
                    instance: '/api/v1/warehouse/opening-balances'
                    code: 'WH-009'
                    traceId: '2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e'
                productHasMovements:
                  summary: El producto ya tiene movimientos (la apertura falsearía el kardex)
                  value:
                    type: 'urn:tms:error:wh-011'
                    title: 'Conflict'
                    status: 409
                    detail: "El producto 'Filtro de aceite XYZ' ya tiene movimientos; el corte inicial solo aplica a productos sin historial"
                    instance: '/api/v1/warehouse/opening-balances'
                    code: 'WH-011'
                    traceId: '3c4d5e6f-7a8b-9c0d-1e2f-3a4b5c6d7e8f'

  # ----- Warehouse: entradas (facturas de compra) -------------------------------

  /warehouse/purchase-invoices:
    get:
      tags: [Warehouse]
      operationId: listWarehousePurchaseInvoices
      summary: Listar entradas (facturas de compra) con filtros
      description: |
        Orden `createdAt` DESC. Incluye las ANULADAS (badge + motivo en la UI) —
        filtrable por `status`. `q` (≥ 3) busca substring case-insensitive en
        `invoiceNumber`, `guideNumber` y nombre del proveedor; multi-palabra:
        cada palabra debe matchear en ALGÚN campo (AND de ORs, RN-WH14). `total` e
        `itemsCount` se calculan de los ítems — los totales NO se persisten
        (patrón v2, columna eliminada en rev. 2).
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper]
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 3, maxLength: 200 } }
        - { name: supplierId, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/WarehouseRecordStatus' } }
        - { name: dateFrom, in: query, description: '`invoiceDate` desde (inclusive)', schema: { type: string, format: date } }
        - { name: dateTo, in: query, description: '`invoiceDate` hasta (inclusive)', schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Página de facturas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOfWarehousePurchaseInvoiceSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Warehouse]
      operationId: createWarehousePurchaseInvoice
      summary: Registrar entrada — factura con N ítems (transaccional)
      description: |
        Crea factura + ítems en UNA transacción; cada ítem suma stock (vía VIEW).
        Los productos se referencian por `productId` — el "crear producto al
        vuelo" llama antes a `POST /warehouse/products` desde el modal (decisión
        D-3: sin producto inline en este body).

        - Unicidad proveedor+número **solo entre ACTIVAS** (UNIQUE parcial
          `uq_purchase_invoices_active`): duplicado → **409 `WH-002`** (RN-WH5).
          Una factura anulada libera su número para la corregida.
        - Proveedor/moneda/producto inexistente o inactivo → **400 `WH-004`**.
        - `currencyId` fija la moneda de la factura (RN-WH7 — sin conversión).
          El select de moneda reusa `GET /currencies` de cotizaciones.
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehousePurchaseInvoiceRequest' }
            example:
              supplierId: 4
              invoiceNumber: 'F001-00123'
              invoiceDate: '2026-07-02'
              guideNumber: 'T001-0004567'
              currencyId: 2
              observations: 'Compra repuestos mantenimiento preventivo'
              items:
                - { productId: 12, quantity: 10, unitPrice: 45.00 }
                - { productId: 31, quantity: 24, unitPrice: 18.50 }
      responses:
        '201':
          description: Creada
          headers:
            ETag: { schema: { type: string }, description: Versión opaca para If-Match (PUT/cancel) }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehousePurchaseInvoiceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Nº de factura duplicado para ese proveedor (entre ACTIVAS) → WH-002
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: 'urn:tms:error:wh-002'
                title: 'Conflict'
                status: 409
                detail: 'Ya existe la factura F001-00123 de REPUESTOS DIÉSEL S.A.C.'
                instance: '/api/v1/warehouse/purchase-invoices'
                code: 'WH-002'
                traceId: '4d5e6f7a-8b9c-0d1e-2f3a-4b5c6d7e8f9a'

  /warehouse/purchase-invoices/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Warehouse]
      operationId: getWarehousePurchaseInvoice
      summary: Detalle de una entrada (cabecera + ítems)
      description: |
        Incluye `lastEdit` (rastro del último `FIELD_EDIT` en `almacen.audit_logs`;
        `null` si nunca se editó — decisión D-10) y los campos de anulación si
        `status=CANCELLED`. El header `ETag` (versión opaca del `updatedAt`) es el
        que exigen PUT y cancel vía `If-Match` — usar el HEADER, no el `updatedAt`
        del body (lección del CRUD de cotizaciones: difieren por µs → 412 espurio).
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper]
      responses:
        '200':
          description: Detalle completo
          headers:
            ETag: { schema: { type: string }, description: Versión opaca para If-Match }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehousePurchaseInvoiceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Warehouse]
      operationId: updateWarehousePurchaseInvoice
      summary: Editar entrada (justificación obligatoria)
      description: |
        RN-WH4: `reason` ≥ 10 → `almacen.audit_logs` con el diff por campo.
        Reemplazo completo: los `items` del body sustituyen a los existentes.

        - **`supplierId` INMUTABLE** — no viaja en el body (proveedor equivocado
          = anular y re-registrar).
        - **Guarda de stock** (misma transacción, RN-WH4): el stock del producto
          no puede quedar negativo tras la edición — por producto afectado,
          `apertura + entradas_tras_edición − salidas_activas ≥ 0` (la apertura
          cuenta como stock disponible, igual que en la cancelación); si quedaría
          negativo → **409 `WH-006`** (el `detail` nombra el producto — ej.: sin
          apertura, la factura decía 10, ya se retiraron 9 → no puede bajar a 8).
        - Anulada → **409 `WH-008`** · nº duplicado entre ACTIVAS → **409 `WH-002`**.
        - `If-Match` obligatorio; versión vieja → **412 `COM-004`**.
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper]
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehousePurchaseInvoiceUpdateRequest' }
      responses:
        '200':
          description: Actualizada
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehousePurchaseInvoiceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: WH-006 (dejaría stock negativo) / WH-008 (anulada) / WH-002 (duplicado)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                editWouldLeaveNegativeStock:
                  summary: Ya se retiró más de lo que quedaría tras la edición
                  value:
                    type: 'urn:tms:error:wh-006'
                    title: 'Conflict'
                    status: 409
                    detail: "De 'Filtro de aceite XYZ' ya se retiraron 9 UND y con este cambio las entradas quedarían en 8. Corrige primero los retiros."
                    instance: '/api/v1/warehouse/purchase-invoices/12'
                    code: 'WH-006'
                    traceId: '5e6f7a8b-9c0d-1e2f-3a4b-5c6d7e8f9a0b'
                recordCancelled:
                  summary: La factura está anulada (inmutable)
                  value:
                    type: 'urn:tms:error:wh-008'
                    title: 'Conflict'
                    status: 409
                    detail: 'Una factura anulada no se puede editar'
                    instance: '/api/v1/warehouse/purchase-invoices/12'
                    code: 'WH-008'
                    traceId: '6f7a8b9c-0d1e-2f3a-4b5c-6d7e8f9a0b1c'
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /warehouse/purchase-invoices/{id}/cancel:
    post:
      tags: [Warehouse]
      operationId: cancelWarehousePurchaseInvoice
      summary: Anular entrada (con motivo — "eliminar" no existe)
      description: |
        "La factura se registró por error" (RN-WH3). Nada se borra:
        `status→CANCELLED` + motivo + quién + cuándo (CHECK de consistencia en
        BD). Deja de mover stock/kardex/reportes; queda visible en el listado.

        - **Guarda**: el stock del producto no puede caer en negativo al
          descontar esta factura — por producto, `apertura +
          entradas_sin_esta_factura − salidas_activas ≥ 0`; si no →
          **409 `WH-007`** (anular retiros o registrar otra entrada primero).
          El stock es fungible: NO se rastrea de qué factura salió cada unidad
          (sin lotes) — la única guarda real es el no-negativo (ruling del
          dueño 2026-07-04).
        - Ya anulada → **409 `WH-008`**.
        - `If-Match` obligatorio (decisión D-7) → **412 `COM-004`**.
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseCancelRequest' }
            example: { reason: 'Factura registrada por error: correspondía al proveedor LUBRICANTES DEL PERÚ' }
      responses:
        '200':
          description: Anulada
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehousePurchaseInvoiceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: WH-007 (el stock quedaría negativo al descontarla) / WH-008 (ya anulada)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: 'urn:tms:error:wh-007'
                title: 'Conflict'
                status: 409
                detail: "No se puede anular: el stock de 'Filtro de aceite XYZ' quedaría en -3 al descontar esta factura. Anula retiros o registra otra entrada primero."
                instance: '/api/v1/warehouse/purchase-invoices/12/cancel'
                code: 'WH-007'
                traceId: '7a8b9c0d-1e2f-3a4b-5c6d-7e8f9a0b1c2d'
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  # ----- Warehouse: salidas (retiros) -------------------------------------------

  /warehouse/withdrawals:
    get:
      tags: [Warehouse]
      operationId: listWarehouseWithdrawals
      summary: Listar retiros con filtros
      description: |
        Orden `withdrawnAt` DESC. Incluye los ANULADOS (badge + motivo) —
        filtrable por `status`. Filtros de unidad excluyentes en la práctica
        (una unidad por retiro), combinables con los demás.
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper]
      parameters:
        - { name: productId, in: query, schema: { type: integer } }
        - { name: receivedByWorkerId, in: query, schema: { type: integer } }
        - { name: tractorId, in: query, schema: { type: integer } }
        - { name: trailerId, in: query, schema: { type: integer } }
        - { name: escortVehicleId, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/WarehouseRecordStatus' } }
        - { name: dateFrom, in: query, description: '`withdrawnAt` desde (inclusive, América/Lima)', schema: { type: string, format: date } }
        - { name: dateTo, in: query, description: '`withdrawnAt` hasta (inclusive del día completo, América/Lima)', schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Página de retiros
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOfWarehouseWithdrawal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Warehouse]
      operationId: createWarehouseWithdrawal
      summary: Registrar retiro (valida stock en transacción)
      description: |
        RN-WH2 — la regla estrella del módulo:
        - `receivedByWorkerId` (quién recibe) **SIEMPRE obligatorio** (FK
          `public.workers`).
        - Unidad destino **OPCIONAL y a lo sumo UNA**: `tractorId` | `trailerId`
          | `escortVehicleId` (subtipos disyuntos; CHECK `chk_withdrawals_one_unit`).
          Más de una → **400 `WH-005`**.
        - `quantity > 0` y **≤ stock disponible**, validado en la MISMA
          transacción con lock del producto (`SELECT … FOR UPDATE` — concurrencia
          decidida en diseño, decisión D-2/D-12, no best-effort): si excede →
          **409 `WH-001`** con el disponible en el `detail`. Se eligió 409 sobre
          422 por consistencia con el resto del contrato (409 = conflicto con el
          estado actual del recurso).
        - `withdrawnAt` lo pone el server (ahora); `registeredBy` = usuario del token.
        - Producto/trabajador/unidad inexistente o inactivo → **400 `WH-004`**.
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseWithdrawalRequest' }
            example:
              productId: 12
              quantity: 2
              receivedByWorkerId: 8
              tractorId: 5
              observations: 'Cambio de aceite programado'
      responses:
        '201':
          description: Registrado
          headers:
            ETag: { schema: { type: string }, description: Versión opaca para If-Match (PUT/cancel) }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseWithdrawalResponse' }
        '400':
          description: Validación — incluye WH-005 (más de una unidad) y WH-004 (catálogo)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                multipleFleetUnits:
                  summary: Tracto y carreta a la vez (la unidad destino es disyunta)
                  value:
                    type: 'urn:tms:error:wh-005'
                    title: 'Bad Request'
                    status: 400
                    detail: 'La unidad destino admite a lo sumo una: tracto, carreta O escolta'
                    instance: '/api/v1/warehouse/withdrawals'
                    code: 'WH-005'
                    traceId: '8b9c0d1e-2f3a-4b5c-6d7e-8f9a0b1c2d3e'
                inactiveCatalog:
                  summary: Producto, trabajador o unidad inexistente/inactivo
                  value:
                    type: 'urn:tms:error:wh-004'
                    title: 'Bad Request'
                    status: 400
                    detail: 'El producto seleccionado no existe o está inactivo'
                    instance: '/api/v1/warehouse/withdrawals'
                    code: 'WH-004'
                    traceId: '9c0d1e2f-3a4b-5c6d-7e8f-9a0b1c2d3e4f'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Stock insuficiente → WH-001
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: 'urn:tms:error:wh-001'
                title: 'Conflict'
                status: 409
                detail: 'Stock insuficiente: solo hay 4 UND disponibles de Filtro de aceite XYZ'
                instance: '/api/v1/warehouse/withdrawals'
                code: 'WH-001'
                traceId: '0d1e2f3a-4b5c-6d7e-8f9a-0b1c2d3e4f5a'

  /warehouse/withdrawals/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Warehouse]
      operationId: getWarehouseWithdrawal
      summary: Detalle de un retiro
      description: |
        Incluye `lastEdit` (último `FIELD_EDIT` de `almacen.audit_logs`; `null`
        si nunca se editó) y los campos de anulación si `status=CANCELLED`.
        Header `ETag` = versión opaca para el `If-Match` de PUT/cancel.
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper]
      responses:
        '200':
          description: Detalle
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseWithdrawalResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Warehouse]
      operationId: updateWarehouseWithdrawal
      summary: Editar retiro (justificación obligatoria)
      description: |
        Caso real: "pidieron 10 pero usaron 7". RN-WH4: `reason` ≥ 10 →
        `almacen.audit_logs`. Editables: cantidad, quién recibe, unidad de
        flota, observaciones.

        - **`productId` INMUTABLE** — no viaja en el body (producto equivocado =
          anular y crear otro).
        - **Guarda de stock**: subir la cantidad valida contra el disponible SIN
          contar este mismo retiro (misma transacción); si excede → **409
          `WH-001`**. Bajarla siempre es segura (devuelve stock).
        - La unidad de flota se REEMPLAZA: a lo sumo una; los tres campos `null`
          la quitan. Más de una → **400 `WH-005`**.
        - Anulado → **409 `WH-008`** · `If-Match` obligatorio → **412 `COM-004`**.
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper]
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseWithdrawalUpdateRequest' }
            example:
              quantity: 7
              receivedByWorkerId: 8
              tractorId: 5
              reason: 'Se pidieron 10 filtros pero el mantenimiento usó 7; se devuelven 3'
      responses:
        '200':
          description: Actualizado
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseWithdrawalResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: WH-001 (excede stock sin contar este retiro) / WH-008 (anulado)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: 'urn:tms:error:wh-001'
                title: 'Conflict'
                status: 409
                detail: 'Stock insuficiente: solo hay 6 UND disponibles (sin contar este retiro)'
                instance: '/api/v1/warehouse/withdrawals/31'
                code: 'WH-001'
                traceId: '1e2f3a4b-5c6d-7e8f-9a0b-1c2d3e4f5a6b'
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /warehouse/withdrawals/{id}/cancel:
    post:
      tags: [Warehouse]
      operationId: cancelWarehouseWithdrawal
      summary: Anular retiro (con motivo — el stock vuelve solo)
      description: |
        Caso real: "el camión no necesitaba el repuesto" (RN-WH3).
        `status→CANCELLED` + motivo + quién + cuándo. SIEMPRE segura — devuelve
        stock (las VIEWs excluyen anulados). Ya anulado → **409 `WH-008`**.
        `If-Match` obligatorio → **412 `COM-004`**.
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseCancelRequest' }
            example: { reason: 'El tracto no necesitaba el repuesto; era un problema eléctrico' }
      responses:
        '200':
          description: Anulado
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseWithdrawalResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Ya anulado → WH-008
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  # ----- Warehouse: dashboard y reportes ----------------------------------------

  /warehouse/stats:
    get:
      tags: [Warehouse]
      operationId: getWarehouseStats
      summary: KPIs del strip de Existencias
      description: |
        Contadores del mes calendario en curso (América/Lima). Solo registros
        ACTIVOS. `lowStockCount` = productos activos con `stock < minStock` (RN-WH11).
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper]
      responses:
        '200':
          description: Contadores del strip
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseStatsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /warehouse/reports:
    get:
      tags: [Warehouse]
      operationId: getWarehouseReport
      summary: Reporte agregado por corte (unidad / período / producto / proveedor)
      description: |
        Los 4 cortes de la pantalla Reportes. Solo registros ACTIVOS. RN-WH7 —
        **bi-moneda SIN conversión**: los montos se agregan POR MONEDA tal como
        se registró cada factura; almacén entrega cantidades, contabilidad
        valoriza sobre el reporte.

        - `BY_UNIT` / `BY_PRODUCT` / `BY_PERIOD`: consumos (retiros activos con
          `withdrawnAt` en el rango); el valor de cada salida usa el **último
          precio de compra** del producto (con su moneda) como referencia.
          `BY_PERIOD` agrupa por semana (lunes como clave, en `detail`).
        - `BY_SUPPLIER`: compras (facturas activas por `invoiceDate` en el
          rango), valorizadas con sus propios ítems.
        - Rango América/Lima, ambos extremos inclusivos; `dateFrom > dateTo` →
          400 `COM-001`. Exportación = client-side (sin endpoint, como el
          reporte de operaciones).
      x-required-roles: [admin, general_manager, operations_manager, finance_manager, warehouse_keeper]
      parameters:
        - { name: cut, in: query, required: true, schema: { $ref: '#/components/schemas/WarehouseReportCut' } }
        - { name: dateFrom, in: query, required: true, schema: { type: string, format: date } }
        - { name: dateTo, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Filas + totales por moneda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ----- Operations: servicios de transporte (schema operaciones) -------------
  # Control de viajes: alta, edición con justificación, transiciones de estado,
  # asignación de recursos con conflictos forzables, bitácora y reporte.

  /services:
    get:
      tags: [Operations]
      operationId: listServices
      summary: Listar servicios con filtros
      description: |
        RN-OP15 — búsqueda `q` de 3 caracteres o más sobre código, cliente
        (nombre/RUC), origen y destino, **multi-palabra**: `q` se tokeniza por
        espacios y cada palabra debe matchear en algún campo ("IPH piura"
        encuentra al cliente IPH con destino Piura). Los filtros se combinan
        entre sí. Orden fijo por fecha de creación descendente: no hay parámetro
        de ordenamiento. Los servicios eliminados (`DELETED`) NO aparecen salvo
        pedirlos explícitamente con `status=DELETED`.

        RN-OP8 — al rol `dispatcher` el servidor le OMITE `price` y
        `currencyCode` de cada fila (ausentes, no null).
      x-required-roles: [admin, sales, general_manager, operations_manager, dispatcher]
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 3, maxLength: 200 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ServiceStatus' } }
        - { name: clientId, in: query, description: Filtra por cliente exacto, schema: { type: integer } }
        - { name: dateFrom, in: query, description: Fecha tentativa desde (inclusive), schema: { type: string, format: date } }
        - { name: dateTo, in: query, description: Fecha tentativa hasta (inclusive), schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Página de servicios
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOfServiceSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [Operations]
      operationId: createService
      summary: Crear servicio
      description: |
        El servicio nace en `PENDING_ASSIGNMENT` y el backend le asigna el
        código (RN-OP11): `SRV-` seguido del id del servicio, rellenado con ceros
        a la izquierda hasta un mínimo de 4 dígitos; a partir del id 10000 el
        código crece a 5 o más dígitos y **nunca se trunca**.

        RN-OP9 — la fecha tentativa PUEDE ser pasada (registro retroactivo); la
        interfaz avisa, el servidor no bloquea. Cliente, tipo de carga o moneda
        inexistentes o inactivos → 400 `COM-001`. El alta escribe la primera
        línea de la bitácora y su registro de auditoría.

        Contra el doble-click: un alta con el mismo cliente, la misma ruta y el
        mismo usuario dentro de los 30 segundos previos responde 409 `OPS-007`
        (mismo criterio que `QUO-002` en cotizaciones). No es una restricción de
        unicidad — dos viajes iguales separados en el tiempo se registran sin
        problema, y el código permite al cliente distinguir este 409 benigno de
        un conflicto real.
      x-required-roles: [admin, sales, general_manager, operations_manager]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceCreateRequest' }
            example:
              clientId: 12
              tripScope: 'PROVINCIA'
              tentativeDate: '2026-07-10'
              origin: 'Piura'
              destination: 'Lima — Callao'
              cargoTypeId: 3
              weightKg: 28000
              lengthM: 12.5
              price: 5800
              currencyId: 1
              observations: 'Coordinar ingreso al puerto con 24 h de anticipación'
      responses:
        '201':
          description: Servicio creado
          headers:
            Location: { schema: { type: string }, description: URL del recurso creado }
            ETag: { schema: { type: string }, description: 'Versión opaca del recurso (usarla en el If-Match posterior)' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /services/stats:
    get:
      tags: [Operations]
      operationId: getServiceStats
      summary: Indicadores del tablero operativo
      description: |
        RN-OP14 — `completedThisWeek` y `weekCycle` usan el ciclo operativo de la
        empresa: miércoles 00:00 a martes 23:59, hora de América/Lima.

        Los contadores de recursos miden lo MISMO que el tablero del sistema
        anterior, para que el número no cambie de significado con el cambio de
        sistema: `driversOnRoad` = conductores PRINCIPALES distintos en
        servicios en ruta (los refuerzos no cuentan) sobre el total de
        conductores activos (`public.drivers`); `unitsOnRoad` = tractos
        PRINCIPALES distintos en servicios en ruta (los de refuerzo tampoco
        cuentan) sobre el total de TRACTOS activos (carretas y escoltas no
        participan del indicador).

        En ambos objetos, `active` = el numerador (los que están en ruta AHORA)
        y `total` = el denominador (el padrón vigente de ese recurso).
      x-required-roles: [admin, sales, general_manager, operations_manager, dispatcher]
      responses:
        '200':
          description: Contadores del tablero
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceStatsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /services/report:
    get:
      tags: [Operations]
      operationId: getServicesReport
      summary: Reporte de servicios completados por rango
      description: |
        Servicios completados con fecha de fin dentro del rango (fechas
        América/Lima, ambos extremos inclusive). Totales POR MONEDA sin
        conversión, mismo criterio que el reporte de almacén. `from > to` → 400
        `COM-001`. Exportación = client-side (sin endpoint).

        RN-OP8 — es un reporte de facturación: `dispatcher` recibe 403.
      x-required-roles: [admin, sales, general_manager, operations_manager]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Filas + totales por moneda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServicesReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /services/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }

    get:
      tags: [Operations]
      operationId: getService
      summary: Detalle del servicio (con bitácora y recursos)
      description: |
        Incluye la bitácora (`events`, orden cronológico) y los recursos
        adicionales asignados en ruta. Devuelve el header `ETag` que exigen el
        PUT, la cancelación y la eliminación. RN-OP8 — `dispatcher` no recibe
        `price` ni `currencyCode`.
      x-required-roles: [admin, sales, general_manager, operations_manager, dispatcher]
      responses:
        '200':
          description: Detalle completo
          headers:
            ETag: { schema: { type: string }, description: 'Versión opaca del recurso (usarla en el If-Match)' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    put:
      tags: [Operations]
      operationId: updateService
      summary: Editar servicio (justificación obligatoria)
      description: |
        RN-OP6 — editables: origen, destino, fecha tentativa, peso, dimensiones,
        precio, moneda, observaciones y las fechas reales de inicio y fin.
        Cliente, ámbito del viaje y tipo de carga son INMUTABLES después del
        alta (si se equivocaron, se crea otro servicio), por eso no viajan en el
        body. Cada campo cambiado deja su línea de auditoría y una entrada de
        bitácora con la justificación.

        Las fechas reales solo se CORRIGEN acá, no se fijan: cada una es
        editable únicamente cuando el servicio ya la tiene (el inicio desde que
        está en ruta; el fin solo completado); mandarla antes → 400 `COM-001`.
        Ausente = sin cambio; `null` NO se acepta (una fecha real nunca se
        borra). Cerrar el viaje sigue siendo la transición de estado, no este
        endpoint.
        Al corregir rige RN-OP13: fin >= inicio (400 `COM-001`).

        RN-OP10 — un body sin cambios reales responde 200 sin escribir auditoría
        ni tocar la fecha de actualización.

        El servicio cancelado o eliminado es inmutable → 409 `OPS-004`. El
        completado SÍ se edita (corrección de datos). Concurrencia: `If-Match`
        con el ETag del detalle; ausente o sin coincidir → 412 `COM-004`.
      x-required-roles: [admin, sales, general_manager, operations_manager]
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceUpdateRequest' }
      responses:
        '200':
          description: Servicio actualizado (o sin cambios)
          headers:
            ETag: { schema: { type: string }, description: Nueva versión opaca del recurso }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /services/{id}/assignment:
    post:
      tags: [Operations]
      operationId: assignServiceResources
      summary: Asignar recursos principales (el servicio pasa a pendiente de inicio)
      description: |
        RN-OP2 — conductor y tracto obligatorios, carreta opcional; solo desde
        `PENDING_ASSIGNMENT`. Otro estado → 409 `OPS-006`.

        RN-OP3 — si un recurso ya participa de OTRO servicio activo, sea como
        recurso principal o como refuerzo (se revisan AMBAS fuentes; el sistema
        anterior solo miraba los principales acá), responde 409
        `OPS-002` con `forcible: true` y el detalle en `conflicts`. Reintentar con
        `force: true` lo asigna igual y deja constancia en la bitácora y en la
        auditoría (así trabajaba el sistema anterior: el conflicto avisa, no
        prohíbe).
      x-required-roles: [admin, general_manager, operations_manager, dispatcher]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignResourcesRequest' }
            example: { driverId: 4, tractorId: 7, trailerId: 3, note: 'Sale del patio a las 05:00', force: false }
      responses:
        '200':
          description: Recursos asignados; el servicio queda pendiente de inicio
          headers:
            ETag: { schema: { type: string }, description: Nueva versión opaca del recurso }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`OPS-006` (el estado no admite la acción) u `OPS-002` (conflicto forzable)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ServiceResourceConflictProblem' }
              examples:
                forcibleConflict:
                  summary: Conflicto de recursos — la interfaz ofrece "Forzar asignación"
                  value:
                    type: 'urn:tms:error:ops-002'
                    title: 'Resource conflict'
                    status: 409
                    detail: 'El conductor Juan Pérez ya está asignado al servicio SRV-0042 (en ruta).'
                    instance: '/api/v1/services/118/assignment'
                    code: 'OPS-002'
                    traceId: '3f2a1b0c-9d8e-7f6a-5b4c-3d2e1f0a9b8c'
                    forcible: true
                    conflicts:
                      - { resource: 'DRIVER', resourceName: 'Juan Pérez', serviceCode: 'SRV-0042', serviceStatus: 'IN_PROGRESS' }

  /services/{id}/status:
    post:
      tags: [Operations]
      operationId: changeServiceStatus
      summary: Transicionar estado (iniciar / finalizar / cancelar / eliminar)
      description: |
        RN-OP1 — transiciones válidas: pendiente de inicio → en ruta, en ruta →
        completado, cancelado desde los tres estados no terminales, y eliminado
        SOLO desde los dos pendientes. El resto → 409 `OPS-001`. El paso de
        pendiente de asignación a pendiente de inicio NO se pide acá: es efecto
        de asignar recursos.

        Eliminar y cancelar son cosas distintas: `DELETED` etiqueta el registro
        que nunca debió existir (error de digitación) y lo saca de listados e
        indicadores; `CANCELLED` es un viaje real que se abortó. Un servicio en
        ruta o completado no se elimina: se cancela o se corrige. Nada se borra
        de la base de datos.

        `dateTime` es opcional (por defecto, ahora) y solo aplica al iniciar o
        finalizar; se ignora al cancelar o eliminar. RN-OP13 — al finalizar, la
        fecha de fin no puede ser anterior a la de inicio (400 `COM-001`).

        RN-OP7 — cancelar y eliminar exigen motivo de 10 caracteres o más, no
        los puede hacer `dispatcher` (403: opera el viaje, no decide matarlo ni
        descartarlo) y piden `If-Match` con el ETag del detalle, porque son
        destructivos y el estado que el usuario vio en pantalla pudo haber
        cambiado. `If-Match` ausente o sin coincidir → 412 `COM-004`, el mismo
        comportamiento que en el resto de la API; la condicionalidad (solo se
        exige en esos dos targets) no se puede declarar en el esquema, la valida
        el servidor.

        `sales` no participa de las transiciones: registra y edita el servicio,
        pero la operación del viaje es del despacho y la gerencia (misma regla
        que el sistema anterior).
      x-required-roles: [admin, general_manager, operations_manager, dispatcher]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - name: If-Match
          in: header
          required: false
          description: 'Obligatorio cuando `target` es `CANCELLED` o `DELETED` (ausente o sin coincidir → 412 `COM-004`); se ignora en las demás transiciones.'
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeStatusRequest' }
            examples:
              start:   { summary: Iniciar,   value: { target: 'IN_PROGRESS', dateTime: '2026-07-10T05:12:00Z' } }
              finish:  { summary: Finalizar, value: { target: 'COMPLETED', note: 'Descarga conforme, sin observaciones' } }
              cancel:  { summary: Cancelar,  value: { target: 'CANCELLED', note: 'El cliente reprogramó el embarque para agosto' } }
              delete:  { summary: Eliminar,  value: { target: 'DELETED', note: 'Registro duplicado por error de digitación' } }
      responses:
        '200':
          description: Estado actualizado
          headers:
            ETag: { schema: { type: string }, description: Nueva versión opaca del recurso }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 'Transición inválida (`OPS-001`) o servicio ya cancelado o eliminado (`OPS-004`)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: 'urn:tms:error:ops-001'
                title: 'Invalid status transition'
                status: 409
                detail: 'No se puede pasar de "Completado" a "En ruta".'
                instance: '/api/v1/services/118/status'
                code: 'OPS-001'
                traceId: '1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d'
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /services/{id}/resources:
    post:
      tags: [Operations]
      operationId: addServiceResources
      summary: Agregar recursos adicionales (solo con el viaje en ruta)
      description: |
        RN-OP5 — solo con el servicio en ruta (otro estado → 409 `OPS-006`), al
        menos un recurso y motivo de 10 caracteres o más.

        RN-OP4 — un recurso que ya participa del MISMO servicio → 409 `OPS-003`,
        duro: no se fuerza. RN-OP3 — ocupado en OTRO servicio activo (como
        principal o como refuerzo, ambas fuentes) → 409 `OPS-002`, forzable con
        `force: true`.
      x-required-roles: [admin, general_manager, operations_manager, dispatcher]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddResourcesRequest' }
            example: { driverId: 9, reason: 'Relevo por descanso reglamentario del conductor principal', force: false }
      responses:
        '200':
          description: Recursos agregados
          headers:
            ETag: { schema: { type: string }, description: Nueva versión opaca del recurso }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`OPS-006` (el estado no admite la acción), `OPS-002` (forzable) u `OPS-003` (duro)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ServiceResourceConflictProblem' }

# =============================================================================
components:
# =============================================================================

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT firmado con HS256/RS256. Claims esperados:
        `sub` (userId), `username`, `role`, `iat`, `exp`.

  parameters:
    IdLong:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    IdInt:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int32 }
    Page:
      name: page
      in: query
      description: Página (base 0)
      schema: { type: integer, default: 0, minimum: 0 }
    Size:
      name: size
      in: query
      description: Tamaño de página (máx. 100)
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
    Sort:
      name: sort
      in: query
      description: 'Campo y dirección, formato `campo,asc|desc`. Repetible para múltiples campos.'
      schema:
        type: array
        items: { type: string }
      example: ['createdAt,desc']
    IfMatch:
      name: If-Match
      in: header
      description: ETag/version del recurso para optimistic locking.
      schema: { type: string }

  responses:
    BadRequest:
      description: Solicitud inválida (validación, formato, valores fuera de rango)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            validationFailed:
              summary: Errores de validación por campo
              value:
                type: 'urn:tms:error:com-001'
                title: 'Validation failed'
                status: 400
                detail: 'La solicitud contiene errores de validación'
                instance: '/api/v1/quotations'
                code: 'COM-001'
                traceId: '7c4d2f8a-1b3e-4f9a-8c2d-5e7b1a9c3d4f'
                errors:
                  - field: 'items[0].unitPrice'
                    message: 'debe ser mayor a 0'
                    code: 'MIN_VALUE'
                  - field: 'origin'
                    message: 'requerido cuando quotationType=TRANSPORTE'
                    code: 'REQUIRED'
            invalidEnum:
              summary: Valor de enum inválido
              value:
                type: 'urn:tms:error:com-001'
                title: 'Validation failed'
                status: 400
                detail: "Valor 'OTRO' no es válido para quotationType (esperado: TRANSPORTE | ALQUILER)"
                instance: '/api/v1/quotations'
                code: 'COM-002'
                traceId: '9e1f3c5d-2a4b-4c6e-9d8f-1b2a3c4d5e6f'
    Unauthorized:
      description: Token de acceso ausente, expirado o inválido
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            tokenExpired:
              summary: Token de acceso expirado
              value:
                type: 'urn:tms:error:auth-007'
                title: 'Token expired'
                status: 401
                detail: 'El token de acceso expiró. Use /auth/refresh para renovarlo.'
                instance: '/api/v1/quotations'
                code: 'AUTH-007'
                traceId: '8d2e4f6a-1b3c-4d5e-7f8a-9b0c1d2e3f4a'
            tokenInvalid:
              summary: Token mal formado o no firmado por este servidor
              value:
                type: 'urn:tms:error:auth-008'
                title: 'Token invalid'
                status: 401
                detail: 'El token de acceso es inválido'
                instance: '/api/v1/quotations'
                code: 'AUTH-008'
                traceId: '5c1a2b3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d'
            tokenMissing:
              summary: No se envió header Authorization
              value:
                type: 'urn:tms:error:auth-006'
                title: 'Token missing'
                status: 401
                detail: 'Falta el header Authorization con un token Bearer'
                instance: '/api/v1/quotations'
                code: 'AUTH-006'
                traceId: '4a5b6c7d-8e9f-0a1b-2c3d-4e5f6a7b8c9d'
    Forbidden:
      description: Autenticado pero sin permisos para esta operación
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            insufficientRole:
              summary: Rol insuficiente para la operación
              value:
                type: 'urn:tms:error:com-003'
                title: 'Forbidden'
                status: 403
                detail: 'El rol sales no puede eliminar cotizaciones'
                instance: '/api/v1/quotations/142'
                code: 'COM-003'
                traceId: '6f4e3d2c-1b0a-9f8e-7d6c-5b4a3f2e1d0c'
    NotFound:
      description: Recurso no encontrado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            quotationNotFound:
              summary: Cotización inexistente
              value:
                type: 'urn:tms:error:quo-003'
                title: 'Resource not found'
                status: 404
                detail: 'La cotización con id 999 no existe'
                instance: '/api/v1/quotations/999'
                code: 'QUO-003'
                traceId: '2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e'
            productNotFound:
              summary: Producto de almacén inexistente
              value:
                type: 'urn:tms:error:wh-003'
                title: 'Resource not found'
                status: 404
                detail: 'El producto con id 999 no existe'
                instance: '/api/v1/warehouse/products/999'
                code: 'WH-003'
                traceId: '2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e'
            serviceNotFound:
              summary: Servicio de operaciones inexistente
              value:
                type: 'urn:tms:error:ops-005'
                title: 'Resource not found'
                status: 404
                detail: 'El servicio con id 999 no existe'
                instance: '/api/v1/services/999'
                code: 'OPS-005'
                traceId: '2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e'
    Conflict:
      description: Conflicto (recurso ya existe, restricción de unicidad violada)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            duplicateRuc:
              summary: RUC duplicado al crear cliente
              value:
                type: 'urn:tms:error:cli-001'
                title: 'Conflict'
                status: 409
                detail: 'Ya existe un cliente con RUC 20123456789'
                instance: '/api/v1/clients'
                code: 'CLI-001'
                traceId: '4d5e6f7a-8b9c-0d1e-2f3a-4b5c6d7e8f9a'
            duplicateClientName:
              summary: Nombre de cliente duplicado al crear cliente
              value:
                type: 'urn:tms:error:cli-002'
                title: 'Conflict'
                status: 409
                detail: 'Ya existe un cliente con el nombre Acme Corp'
                instance: '/api/v1/clients'
                code: 'CLI-002'
                traceId: '5e6f7a8b-9c0d-1e2f-3a4b-5c6d7e8f9a0b'
            duplicateQuotationCode:
              summary: Código de cotización duplicado (race condition extrema sobre el advisory lock)
              value:
                type: 'urn:tms:error:quo-001'
                title: 'Conflict'
                status: 409
                detail: 'El código 2026-00042 ya está en uso, reintente'
                instance: '/api/v1/quotations'
                code: 'QUO-001'
                traceId: '7e8f9a0b-1c2d-3e4f-5a6b-7c8d9e0f1a2b'
            duplicateQuotationDetected:
              summary: Cotización duplicada detectada (protección anti doble-click backend-side)
              value:
                type: 'urn:tms:error:quo-002'
                title: 'Conflict'
                status: 409
                detail: 'Se detectó una cotización idéntica creada hace menos de 30 segundos'
                instance: '/api/v1/quotations'
                code: 'QUO-002'
                traceId: '8f9a0b1c-2d3e-4f5a-6b7c-8d9e0f1a2b3c'
            duplicateServiceDetected:
              summary: Servicio duplicado detectado (protección anti doble-click backend-side)
              value:
                type: 'urn:tms:error:ops-007'
                title: 'Conflict'
                status: 409
                detail: 'Se detectó un servicio idéntico creado hace menos de 30 segundos'
                instance: '/api/v1/services'
                code: 'OPS-007'
                traceId: '8f9a0b1c-2d3e-4f5a-6b7c-8d9e0f1a2b3c'
            invalidStatusTransition:
              summary: Transición de estado no permitida (PATCH /quotations/{id}/status)
              value:
                type: 'urn:tms:error:quo-005'
                title: 'Conflict'
                status: 409
                detail: 'No se puede pasar de REJECTED a SENT'
                instance: '/api/v1/quotations/142/status'
                code: 'QUO-005'
                traceId: '9a0b1c2d-3e4f-5a6b-7c8d-9e0f1a2b3c4d'
            terminalNotEditable:
              summary: Intento de editar una cotización en estado terminal (PUT /quotations/{id})
              value:
                type: 'urn:tms:error:quo-006'
                title: 'Conflict'
                status: 409
                detail: 'No se puede editar una cotizacion en estado ACCEPTED'
                instance: '/api/v1/quotations/142'
                code: 'QUO-006'
                traceId: 'a0b1c2d3-4e5f-6a7b-8c9d-0e1f2a3b4c5d'
            inactiveConditionSelected:
              summary: Condición desactivada en la selección al crear/editar (Opción B, RN-06)
              value:
                type: 'urn:tms:error:quo-007'
                title: 'Conflict'
                status: 409
                detail: "La condición 'En caso el cliente cuente con seguro de carga...' fue desactivada; quítala para guardar"
                instance: '/api/v1/quotations'
                code: 'QUO-007'
                traceId: 'b1c2d3e4-5f6a-7b8c-9d0e-1f2a3b4c5d6e'
    PreconditionFailed:
      description: Optimistic lock — el recurso fue modificado desde que se leyó
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            staleVersion:
              summary: Versión obsoleta (otro usuario editó primero)
              value:
                type: 'urn:tms:error:com-004'
                title: 'Precondition failed'
                status: 412
                detail: 'El recurso fue modificado por otro usuario. Recargue antes de editar.'
                instance: '/api/v1/quotations/142'
                code: 'COM-004'
                traceId: '0a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d'

    ConflictDuplicate:
      description: Duplicado de catálogo del módulo Almacén — nombre/código/RUC ya existe → WH-010
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: 'urn:tms:error:wh-010'
            title: 'Conflict'
            status: 409
            detail: "Ya existe un producto con el nombre 'Filtro de aceite XYZ'"
            instance: '/api/v1/warehouse/products'
            code: 'WH-010'
            traceId: 'a0b1c2d3-4e5f-6a7b-8c9d-0e1f2a3b4c5d'

  schemas:

    # -------- Errores RFC 7807 ---------------------------------------------
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: URI que identifica el tipo de error (ver catálogo de errores)
          example: 'urn:tms:error:validation-failed'
        title:    { type: string, example: 'Validation failed' }
        status:   { type: integer, example: 400 }
        detail:
          type: [string, 'null']
          example: 'El campo "code" no debe estar vacío'
        instance:
          type: [string, 'null']
          example: '/api/v1/quotations'
        code:
          type: [string, 'null']
          description: Código corto del error para que el frontend pueda matchear sin parsear `detail`.
          example: 'VALIDATION_FAILED'
        traceId:
          type: [string, 'null']
          description: Identificador de la traza para correlacionar con logs.
          example: '7c4d2f8a-1b3e-4f9a-8c2d-5e7b1a9c3d4f'
        errors:
          description: Errores de validación por campo (presente solo cuando aplica).
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:   { type: string, example: 'items[0].unitPrice' }
              message: { type: string, example: 'debe ser mayor a 0' }
              code:    { type: [string, 'null'], example: 'MIN_VALUE' }

    # -------- Paginación ----------------------------------------------------
    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages, numberOfElements, first, last, empty]
      properties:
        page:              { type: integer, format: int32, example: 0 }
        size:              { type: integer, format: int32, example: 20 }
        totalElements:     { type: integer, format: int64, example: 137 }
        totalPages:        { type: integer, format: int32, example: 7 }
        numberOfElements:  { type: integer, format: int32, description: 'Cantidad de items en la página actual', example: 20 }
        first:             { type: boolean, description: '¿Es la primera página?' }
        last:              { type: boolean, description: '¿Es la última página?' }
        empty:             { type: boolean, description: '¿La página actual está vacía?' }

    # -------- Enums ---------------------------------------------------------
    QuotationType:
      type: string
      enum: [TRANSPORTE, ALQUILER]
      description: |
        - `TRANSPORTE`: requiere `origin` y `destination`. Usa tipos de servicio de transporte y complementarios.
        - `ALQUILER`: sin ruta. Solo tipos de servicio de alquiler.

    QuotationStatus:
      type: string
      enum: [DRAFT, SENT, ACCEPTED, REJECTED, EXPIRED]
      description: |
        Ciclo de vida (eje único). Máquina de estados (ADR-004):
        `DRAFT → SENT → {ACCEPTED | REJECTED | EXPIRED}`.

        - `DRAFT`: cotización en edición, no enviada al cliente.
        - `SENT`: ya enviada al cliente. Único estado que puede vencer.
        - `ACCEPTED`: el cliente la aceptó. Terminal (inmutable).
        - `REJECTED`: el cliente la rechazó (lleva `rejectionReason`). Terminal (inmutable).
        - `EXPIRED`: venció sin respuesta. Terminal (inmutable). Lo produce el job, no el usuario.

        `isExpired` se deriva del `status`: es `true` si y solo si `status == EXPIRED`.
        El job de vencimiento diario (ADR-005) pasa `SENT → EXPIRED` cuando
        `createdAt + validityDays < now()`; mientras tanto una `SENT` vencida sigue
        reportando `isExpired=false` (ventana ≤24h hasta la próxima corrida). `DRAFT` y
        los terminales no-`EXPIRED` devuelven `false`.

    UserRole:
      type: string
      enum: [admin, sales, dispatcher, general_manager, operations_manager, finance_manager, warehouse_keeper]

    # -------- Auth ----------------------------------------------------------
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9._-]+$'
          example: 'lcampos'
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 100

    LoginResponse:
      type: object
      required: [token, expiresAt, expiresIn, user]
      properties:
        token:        { type: string, description: 'JWT de acceso' }
        refreshToken: { type: [string, 'null'], description: 'Token para renovar la sesión sin re-login' }
        expiresAt:    { type: string, format: date-time }
        expiresIn:    { type: integer, format: int64, description: 'Segundos hasta expiración del access token', example: 3600 }
        user:         { $ref: '#/components/schemas/UserResponse' }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 200
          maxLength: 4096
          description: 'JWT firmado emitido previamente por /auth/login o /auth/refresh.'

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password, minLength: 8, maxLength: 100 }
        newPassword:     { type: string, format: password, minLength: 8, maxLength: 100 }

    UserRef:
      description: Referencia mínima a un usuario (para embeber en respuestas)
      type: object
      required: [id, username, fullName]
      properties:
        id:       { type: integer, format: int32 }
        username: { type: string }
        fullName: { type: string, example: 'Valeria Torres' }
        position: { type: [string, 'null'], description: 'Cargo del trabajador (ej: Ejecutiva de Ventas)', example: 'Ejecutiva de Ventas' }

    UserResponse:
      allOf:
        - $ref: '#/components/schemas/UserRef'
        - type: object
          required: [role, isActive]
          properties:
            role:     { $ref: '#/components/schemas/UserRole' }
            isActive: { type: boolean }

    # -------- Catálogos: Client --------------------------------------------
    ClientRef:
      description: |
        Referencia a un cliente con datos de contacto (live, no snapshot).
        Si el cliente actualiza sus datos, las cotizaciones existentes verán los
        nuevos valores en su `client` embebido, excepto `quotations.contactName`
        (que sí se persiste como snapshot independiente).
      type: object
      required: [id, name, ruc]
      properties:
        id:          { type: integer, format: int32 }
        name:        { type: string }
        ruc:         { type: string, pattern: '^\d{11}$' }
        phone:       { type: [string, 'null'], pattern: '^\d{9}$' }
        contactName: { type: [string, 'null'], maxLength: 100 }

    ClientResponse:
      allOf:
        - $ref: '#/components/schemas/ClientRef'
        - type: object
          required: [isActive, createdAt]
          properties:
            isActive:  { type: boolean }
            createdAt: { type: string, format: date-time }

    ClientRequest:
      type: object
      required: [name, ruc]
      properties:
        name:        { type: string, minLength: 1, maxLength: 200 }
        ruc:         { type: string, pattern: '^\d{11}$' }
        phone:       { type: [string, 'null'], pattern: '^\d{9}$' }
        contactName: { type: [string, 'null'], maxLength: 100 }

    PageOfClient:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/ClientResponse' }

    # -------- Catálogos: Currency ------------------------------------------
    CurrencyResponse:
      type: object
      required: [id, code, symbol, isActive]
      properties:
        id:       { type: integer, format: int32 }
        code:     { type: string, pattern: '^[A-Z]{3}$', example: 'PEN' }
        symbol:   { type: string, maxLength: 5, example: 'S/' }
        name:     { type: [string, 'null'], maxLength: 50 }
        isActive: { type: boolean }

    CurrencyRequest:
      type: object
      required: [code, symbol]
      properties:
        code:   { type: string, pattern: '^[A-Z]{3}$' }
        symbol: { type: string, maxLength: 5 }
        name:   { type: [string, 'null'], maxLength: 50 }

    # -------- Catálogos: CargoType -----------------------------------------
    CargoTypeRef:
      type: object
      required: [id, name]
      properties:
        id:   { type: integer, format: int32 }
        name: { type: string }

    CargoTypeResponse:
      allOf:
        - $ref: '#/components/schemas/CargoTypeRef'
        - type: object
          required: [standardWeight, isActive]
          properties:
            description:    { type: [string, 'null'] }
            standardWeight: { type: number, format: double, minimum: 0 }
            standardLength: { type: [number, 'null'], format: double, minimum: 0 }
            standardWidth:  { type: [number, 'null'], format: double, minimum: 0 }
            standardHeight: { type: [number, 'null'], format: double, minimum: 0 }
            isActive:       { type: boolean }

    PageOfCargoType:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/CargoTypeResponse' }

    CargoTypeRequest:
      type: object
      required: [name, standardWeight]
      properties:
        name:           { type: string, minLength: 1, maxLength: 100 }
        description:    { type: [string, 'null'] }
        standardWeight: { type: number, format: double, minimum: 0 }
        standardLength: { type: [number, 'null'], format: double, minimum: 0 }
        standardWidth:  { type: [number, 'null'], format: double, minimum: 0 }
        standardHeight: { type: [number, 'null'], format: double, minimum: 0 }

    # -------- Catálogos: QuotationServiceType ------------------------------
    QuotationServiceKind:
      type: string
      enum: [SERVICIO, ALQUILER, COMPLEMENTARIO, INTEGRAL]
      description: |
        Categoría del servicio. El backend la **computa** desde el prefijo del
        `code` (S→SERVICIO, A→ALQUILER, C→COMPLEMENTARIO, I→INTEGRAL): no es
        columna en BD. Se expone en el response para que el frontend filtre sin
        conocer la convención del prefijo.

        Reglas del wizard:
        - `quotationType=TRANSPORTE` → muestra SERVICIO + COMPLEMENTARIO + INTEGRAL
        - `quotationType=ALQUILER`   → muestra solo ALQUILER

    QuotationServiceTypeRef:
      type: object
      required: [id, code, name, kind]
      properties:
        id:   { type: integer, format: int32 }
        code: { type: string, example: 'SCB' }
        name: { type: string, example: 'Servicio de transporte en Cama Baja' }
        kind: { $ref: '#/components/schemas/QuotationServiceKind' }

    QuotationServiceTypeResponse:
      allOf:
        - $ref: '#/components/schemas/QuotationServiceTypeRef'
        - type: object
          required: [isActive]
          properties:
            description: { type: [string, 'null'] }
            isActive:    { type: boolean }

    QuotationServiceTypeRequest:
      type: object
      required: [code, name]
      properties:
        code:        { type: string, minLength: 2, maxLength: 10, pattern: '^[A-Z]{2,10}$', description: 'Debe empezar con S/A/C/I según la categoría (ver QuotationServiceKind).' }
        name:        { type: string, maxLength: 100 }
        description: { type: [string, 'null'] }

    # -------- Catálogos: PaymentTerm ---------------------------------------
    PaymentTermResponse:
      type: object
      required: [id, name, days, isActive]
      properties:
        id:       { type: integer, format: int32 }
        name:     { type: string, maxLength: 100, example: '30 días' }
        days:     { type: integer, format: int32, minimum: 0, example: 30 }
        isActive: { type: boolean }

    PaymentTermRequest:
      type: object
      required: [name, days]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        days: { type: integer, format: int32, minimum: 0 }

    # -------- Catálogos: Conditions ---------------------------------------
    ConditionResponse:
      description: |
        Condición general del catálogo, tal como la lista `GET /quotation-conditions`.
        Expone `isActive` (igual que `CurrencyResponse`/`PaymentTermResponse`/`QuotationServiceTypeResponse`)
        porque el endpoint es filtrable y puede devolver inactivas (`?isActive` omitido o `false`).
        El wizard pide `?isActive=true` y muestra solo las activas (RN-07).
      type: object
      required: [id, text, displayOrder, isActive]
      properties:
        id:           { type: integer, format: int32, example: 3 }
        text:         { type: string, example: 'En caso el cliente cuente con seguro de carga, deberá incluir como beneficiario a Transportes Scaramutti S.A.C. ...' }
        displayOrder: { type: integer, format: int32, description: 'Orden de impresión en el PDF (ASC, RN-04).', example: 2 }
        isActive:     { type: boolean, description: 'Si la condición está vigente en el catálogo. El wizard filtra por true (RN-07).' }

    QuotationConditionResponse:
      description: |
        Condición linkeada a una cotización, tal como aparece en `QuotationResponse.conditions`.
        El detalle/PDF resuelve **todas** las linkeadas, activas O inactivas (RN-05, fidelidad
        del snapshot), por eso este schema **sí** expone `isActive`: una condición desactivada
        después de emitida la cotización sigue apareciendo con `isActive=false`.
      type: object
      required: [id, text, displayOrder, isActive]
      properties:
        id:           { type: integer, format: int32, example: 3 }
        text:         { type: string }
        displayOrder: { type: integer, format: int32, description: 'Orden de impresión en el PDF (ASC, RN-04).', example: 2 }
        isActive:     { type: boolean, description: 'true salvo que la condición se haya desactivado en el catálogo tras linkearse (snapshot histórico, RN-05).' }

    # -------- Settings ------------------------------------------------------
    SystemSettingResponse:
      type: object
      required: [key, value, updatedAt]
      properties:
        key:       { type: string, example: 'quotation_default_validity_days' }
        value:     { type: string }
        updatedAt: { type: string, format: date-time }

    # -------- Cotizaciones --------------------------------------------------
    QuotationResponse:
      type: object
      required:
        - id
        - code
        - quotationType
        - status
        - client
        - currency
        - validityDays
        - expiresAt
        - isExpired
        - items
        - conditions
        - totalSubtotal
        - totalIgv
        - totalAmount
        - createdBy
        - updatedBy
        - createdAt
        - updatedAt
      properties:
        id:            { type: integer, format: int64 }
        code:          { type: string, example: '2026-00042' }
        quotationType: { $ref: '#/components/schemas/QuotationType' }
        status:        { $ref: '#/components/schemas/QuotationStatus' }
        client:        { $ref: '#/components/schemas/QuotationClientSummary' }
        contactName:
          type: [string, 'null']
          description: 'Snapshot del contacto al momento de cotizar (queda fijo aunque cambie el cliente master).'
        contactPhone:
          type: [string, 'null']
          pattern: '^\d{9}$'
          description: 'Snapshot del telefono de contacto al momento de cotizar (9 digitos). Queda fijo aunque cambie el cliente master.'
        currency:      { $ref: '#/components/schemas/QuotationCurrencySummary' }
        paymentTerm:
          anyOf:
            - $ref: '#/components/schemas/QuotationPaymentTermSummary'
            - type: 'null'
        tentativeServiceDate: { type: [string, 'null'], format: date }
        validityDays: { type: integer, minimum: 1, maximum: 365, example: 15 }
        expiresAt:    { type: string, format: date-time, description: 'createdAt + validityDays (computado)' }
        isExpired:    { type: boolean, description: 'status == EXPIRED (lo persiste el job diario, ADR-005; no se recalcula por fechas)' }
        origin:       { type: [string, 'null'] }
        destination:  { type: [string, 'null'] }
        clientNote:   { type: [string, 'null'], maxLength: 500, description: 'Observación visible para el cliente (PDF + UI).' }
        internalNote: { type: [string, 'null'], maxLength: 500, description: 'Observación SOLO interna; se devuelve a los roles que editan, nunca en el PDF (RN-03).' }
        rejectionReason: { type: [string, 'null'], maxLength: 500, description: 'Motivo del rechazo. Presente solo si status=REJECTED. INTERNO — se devuelve a los roles que editan, NUNCA en el PDF (ADR-007).' }
        totalSubtotal: { type: number, format: double, description: 'Suma de items.subtotal' }
        totalIgv:      { type: number, format: double, description: 'IGV total' }
        totalAmount:   { type: number, format: double, description: 'Total = subtotal + IGV' }
        items:
          type: array
          items: { $ref: '#/components/schemas/QuotationItemResponse' }
        conditions:
          type: array
          description: |
            Condiciones generales linkeadas a esta cotización, ordenadas por `displayOrder`
            ASC (RN-04). Incluye **todas** las linkeadas, activas O inactivas (RN-05): una
            condición desactivada en el catálogo tras emitirse la cotización sigue acá con
            `isActive=false` (fidelidad del snapshot). Lista vacía si la cotización no tiene
            condiciones (nunca `null`). Es la fuente que el PDF usa para las cláusulas (ya no
            `system_settings['quotation.pdf_terms']`); la tabla de bancos `[[BANK_ACCOUNTS]]`
            se agrega aparte, siempre (RN-09, ADR-010 §5).
          items: { $ref: '#/components/schemas/QuotationConditionResponse' }
        createdBy: { $ref: '#/components/schemas/UserResponse' }
        updatedBy: { $ref: '#/components/schemas/UserResponse' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: 'Source de la versión para optimistic locking (mismo valor que el header ETag).' }

    QuotationSummary:
      description: Versión reducida para el listado
      type: object
      required:
        - id
        - code
        - quotationType
        - status
        - client
        - currencyCode
        - totalAmount
        - itemsCount
        - validityDays
        - isExpired
        - createdAt
        - createdBy
      properties:
        id:            { type: integer, format: int64 }
        code:          { type: string }
        quotationType: { $ref: '#/components/schemas/QuotationType' }
        status:        { $ref: '#/components/schemas/QuotationStatus' }
        client:        { $ref: '#/components/schemas/QuotationClientSummary' }
        currencyCode:  { type: string }
        totalAmount:   { type: number, format: double }
        itemsCount:    { type: integer, format: int32, description: 'Cantidad de ítems root (no incluye hijos del Servicio Integral)', example: 3 }
        validityDays:  { type: integer }
        expiresAt:     { type: string, format: date-time }
        isExpired:     { type: boolean }
        origin:        { type: [string, 'null'] }
        destination:   { type: [string, 'null'] }
        createdAt:     { type: string, format: date-time }
        createdBy:     { $ref: '#/components/schemas/UserResponse' }

    PageOfQuotationSummary:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/QuotationSummary' }

    QuotationRequest:
      description: |
        ## Reglas de negocio (validadas por backend)

        - **Máximo 5 ítems root** (los hijos del Servicio Integral no cuentan).
        - **Servicio Integral**: si la cotización tiene un ítem con `serviceType.code='INT'`:
          - debe ser el primer ítem (`itemNumber=1`),
          - debe tener al menos **2 ítems hijos** (referenciados vía `parentItemNumber=1`),
          - los hijos deben incluir al menos **1 servicio de tipo TRANSPORTE (kind=S)** y
            al menos **1 servicio de tipo COMPLEMENTARIO (kind=C)**,
          - solo puede haber un Integral por cotización.
        - **Origen/destino**: requeridos si `quotationType=TRANSPORTE`, ignorados si `ALQUILER`.
        - **`contactName`**: obligatorio. Snapshot editable. Se precarga desde `client.contactName`
          en el formulario, pero el usuario puede editarlo. Lo que se guarda es el valor final del
          formulario, congelado al momento de crear/editar la cotización.
        - **Anti-duplicado**: el backend rechaza con `409 QUO-002` si llega un POST con
          mismo `clientId` + mismo set de `serviceTypeId`s + mismo usuario creador dentro
          de los últimos 30 segundos (protección anti doble-click backend-side).
      type: object
      required: [quotationType, clientId, contactName, currencyId, validityDays, items]
      properties:
        quotationType:        { $ref: '#/components/schemas/QuotationType' }
        clientId:             { type: integer, format: int32 }
        contactName:          { type: string, minLength: 1, maxLength: 200, description: 'Obligatorio — la cotización siempre se dirige a alguien. Snapshot al momento de cotizar (se precarga del cliente, el usuario puede editarlo, queda congelado).' }
        contactPhone:         { type: [string, 'null'], pattern: '^\d{9}$', description: 'Snapshot editable del telefono de contacto (9 digitos numericos). Se precarga del cliente y queda congelado en la cotización.' }
        currencyId:           { type: integer, format: int32 }
        paymentTermId:        { type: [integer, 'null'], format: int32 }
        tentativeServiceDate: { type: [string, 'null'], format: date }
        validityDays:         { type: integer, minimum: 1, maximum: 365, example: 15 }
        origin:
          type: [string, 'null']
          description: 'Requerido si `quotationType=TRANSPORTE`. Validado por backend.'
          maxLength: 255
        destination:
          type: [string, 'null']
          description: 'Requerido si `quotationType=TRANSPORTE`. Validado por backend.'
          maxLength: 255
        clientNote:
          type: [string, 'null']
          maxLength: 500
          description: 'Observación opcional visible para el cliente (se renderiza en el PDF tras el stand-by y en la UI). Texto libre.'
        internalNote:
          type: [string, 'null']
          maxLength: 500
          description: 'Observación opcional SOLO interna. NUNCA se incluye en el PDF ni en ninguna salida hacia el cliente (RN-03).'
        items:
          type: array
          minItems: 1
          description: 'Lista plana de ítems root e hijos. Los hijos referencian al padre vía `parentItemNumber`. Máximo 5 ítems root (validado por backend).'
          items: { $ref: '#/components/schemas/QuotationItemRequest' }
        conditionIds:
          type: [array, 'null']
          maxItems: 20
          description: |
            IDs de las condiciones generales (`ConditionResponse.id`) que aplican a esta
            cotización; reemplaza el set de la junction `quotation_conditions` (ADR-009/010).
            En el `PUT` **reemplaza** el set completo (mismo patrón "replace" que los ítems).

            - **Opción B (RN-06)**: todas deben estar **activas**. Si alguna está
              `is_active=false` → **409 `QUO-007`** (el `detail` nombra la condición); no se
              persiste.
            - **Duplicados / id inexistente** → **400 `COM-001`** (validación; ni 500 ni fila
              duplicada — la PK compuesta lo refuerza en DB).
            - **Más de 20 elementos** → **400 `COM-001`** (tope `maxItems`; guard de tamaño
              para no armar un `IN` gigante contra Postgres).
            - **Ausente o lista vacía** → cotización **sin** condiciones = válido (el usuario
              puede desmarcar todas). El front normalmente manda todas las activas pre-checkeadas.
          items: { type: integer, format: int32 }
          example: [1, 3]

    QuotationItemResponse:
      description: |
        Ítem de cotización. Puede ser **root** (sin `parentItemId`) o **hijo del Servicio
        Integral** (con `parentItemId` apuntando al padre).

        **Pricing según tipo:**
        - Ítems root: `unitPrice` es el precio que paga el cliente, IGV calculado al 18%.
        - Hijos del Integral: `unitPrice` no aplica (siempre 0); usan `internalReferencePrice`
          opcional, que es referencia histórica interna y NO se muestra en el PDF al cliente.
          La suma de referencias de hijos puede exceder el precio del padre (es el descuento
          implícito del paquete Integral).
      type: object
      required: [id, itemNumber, displayLabel, serviceType, quantity, igvPercentage, subtotal]
      properties:
        id:             { type: integer, format: int64 }
        parentItemId:
          type: [integer, 'null']
          format: int64
          description: 'NULL para ítems root. Set para ítems hijos del Servicio Integral.'
        itemNumber:     { type: integer, format: int32 }
        displayLabel:
          type: string
          description: 'Numeración de presentación jerárquica: root "1","2"; hijo del Integral "1.a","1.b". Derivada de itemNumber + jerarquía, NO persistida. El frontend la muestra; itemNumber sigue siendo la numeración técnica (plana, contigua).'
        serviceType:    { $ref: '#/components/schemas/QuotationServiceTypeSummary' }
        cargoType:
          anyOf:
            - $ref: '#/components/schemas/QuotationCargoTypeSummary'
            - type: 'null'
        observations:   { type: [string, 'null'] }
        weightKg:       { type: [number, 'null'], format: double, minimum: 0 }
        lengthMeters:   { type: [number, 'null'], format: double, minimum: 0 }
        widthMeters:    { type: [number, 'null'], format: double, minimum: 0 }
        heightMeters:   { type: [number, 'null'], format: double, minimum: 0 }
        quantity:       { type: integer, minimum: 1 }
        unitPrice:
          type: number
          format: double
          minimum: 0
          description: 'Precio unitario que paga el cliente. Aplica solo para ítems root. En hijos del Integral siempre es 0 (usar `internalReferencePrice`).'
        internalReferencePrice:
          type: [number, 'null']
          format: double
          minimum: 0
          description: 'Precio interno de referencia. Solo aplica para ítems hijos del Servicio Integral. NO se muestra en el PDF al cliente. Opcional.'
        igvPercentage:  { type: number, format: double, minimum: 0, maximum: 100, example: 18.00 }
        subtotal:
          type: number
          format: double
          description: '`unitPrice * quantity` para root; 0 para hijos del Integral (no entran al total de la cotización).'
        insuredAmount:
          type: [number, 'null']
          format: double
          minimum: 0
          description: 'Solo aplica para ítems de tipo Seguro de Carga (SEG).'
        standby:
          anyOf:
            - $ref: '#/components/schemas/QuotationStandbyCostResponse'
            - type: 'null'
        children:
          description: 'Ítems hijos (presente solo en ítems padre del Servicio Integral).'
          type: array
          items: { $ref: '#/components/schemas/QuotationItemResponse' }

    QuotationItemRequest:
      description: |
        Item de cotización. **`unitPrice` es requerido para ítems root**; para hijos del
        Servicio Integral debe omitirse o enviarse como 0 (en su lugar puede enviarse
        `internalReferencePrice`).
      type: object
      required: [serviceTypeId, quantity]
      properties:
        itemNumber:
          type: [integer, 'null']
          format: int32
          description: 'Si se omite, lo asigna el backend en orden de aparición. Si la cotización tiene Integral, debe ser `1`.'
        parentItemNumber:
          type: [integer, 'null']
          format: int32
          description: 'Para ítems hijos del Integral, referencia al `itemNumber` del padre dentro del mismo request (siempre `1`).'
        serviceTypeId: { type: integer, format: int32 }
        cargoTypeId:   { type: [integer, 'null'], format: int32 }
        observations:  { type: [string, 'null'] }
        weightKg:      { type: [number, 'null'], format: double, minimum: 0 }
        lengthMeters:  { type: [number, 'null'], format: double, minimum: 0 }
        widthMeters:   { type: [number, 'null'], format: double, minimum: 0 }
        heightMeters:  { type: [number, 'null'], format: double, minimum: 0 }
        quantity:      { type: integer, minimum: 1, default: 1 }
        unitPrice:
          type: [number, 'null']
          format: double
          minimum: 0
          description: 'Requerido para ítems root. Para hijos del Integral debe omitirse o ser 0.'
        internalReferencePrice:
          type: [number, 'null']
          format: double
          minimum: 0
          description: 'Solo válido para hijos del Integral. Opcional. NO se muestra en el PDF.'
        # igvPercentage NO se acepta en el request — el backend lo resuelve desde
        # config (IGV nacional uniforme). Se persiste como snapshot en cada item
        # y se devuelve en el response.
        insuredAmount: { type: [number, 'null'], format: double, minimum: 0, description: 'Solo válido si `serviceTypeId` corresponde a SEG.' }
        standby:
          anyOf:
            - $ref: '#/components/schemas/QuotationStandbyCostRequest'
            - type: 'null'

    QuotationStandbyCostResponse:
      type: object
      required: [id, pricePerDay, includesIgv]
      properties:
        id:           { type: integer, format: int64 }
        pricePerDay:  { type: number, format: double, minimum: 0 }
        includesIgv:  { type: boolean }

    QuotationConfigResponse:
      description: |
        Constantes runtime del módulo Quotations expuestas al frontend.
        Los valores vienen del config del backend (`app.quotations.*`) o de
        constantes del validator. Cacheable agresivamente (raramente cambian).
      type: object
      required: [igvPercentage, maxRootItems, defaultValidityDays]
      properties:
        igvPercentage:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: 'IGV nacional vigente. Se persiste como snapshot en cada `quotation_items.igv_percentage` al crear.'
          example: 18.00
        maxRootItems:
          type: integer
          minimum: 1
          description: 'Máximo de ítems root permitidos por cotización (hijos del Servicio Integral no cuentan).'
          example: 5
        defaultValidityDays:
          type: integer
          minimum: 1
          description: 'Validez por defecto sugerida para precargar el form (el usuario puede editarla).'
          example: 15

    # ----- Quotation embedded summaries (Adapter / Anti-Corruption Layer) ---
    # Vistas resumidas de entidades externas (Client, Currency, etc.) embebidas
    # dentro del response de cotizacion. Subset intencional de los Response DTOs
    # de origen — solo los campos relevantes al contexto de cotizacion. Aislan
    # el bounded context Quotations de cambios futuros en los DTOs de otros modulos.

    QuotationClientSummary:
      type: object
      required: [id, name, ruc]
      properties:
        id:   { type: integer, format: int32 }
        name: { type: string, description: 'Razon social del cliente' }
        ruc:  { type: string, pattern: '^\d{11}$' }

    QuotationCurrencySummary:
      type: object
      required: [id, code, symbol]
      properties:
        id:     { type: integer, format: int32 }
        code:   { type: string, description: 'Codigo ISO 4217', pattern: '^[A-Z]{3}$' }
        symbol: { type: string, maxLength: 5 }

    QuotationPaymentTermSummary:
      type: object
      required: [id, name, days]
      properties:
        id:   { type: integer, format: int32 }
        name: { type: string }
        days: { type: integer, minimum: 0 }

    QuotationServiceTypeSummary:
      type: object
      required: [id, code, name, kind]
      properties:
        id:   { type: integer, format: int32 }
        code: { type: string, pattern: '^[A-Z]{2,10}$' }
        name: { type: string }
        kind: { type: string, description: 'Categoria del servicio (SERVICIO/ALQUILER/COMPLEMENTARIO/INTEGRAL)' }

    QuotationCargoTypeSummary:
      description: |
        Subset minimo del tipo de carga para embeber en items de la cotizacion.
        Las dimensiones del catalogo (standardWeight/Length/Width/Height) NO se
        incluyen aca: el item persiste su propio weightKg/lengthMeters/...
        como snapshot. Los valores de referencia del catalogo siguen disponibles
        via GET /catalogs/cargo-types/{id} si se necesitan.
      type: object
      required: [id, name]
      properties:
        id:   { type: integer, format: int32 }
        name: { type: string }

    QuotationStandbyCostRequest:
      type: object
      required: [pricePerDay]
      properties:
        pricePerDay: { type: number, format: double, minimum: 0 }
        includesIgv: { type: boolean, default: false }

    WorkerResponse:
      type: object
      description: Trabajador de `public.workers` (catálogo compartido con v1; read-only desde v2).
      required: [id, fullName, isActive]
      properties:
        id:       { type: integer }
        fullName: { type: string, example: 'Juan Pérez Huamán' }
        position: { type: [string, 'null'], example: 'Mecánico' }
        isActive: { type: boolean }

    FleetUnitKind:
      type: string
      enum: [TRACTOR, TRAILER, ESCORT]
      description: |
        Subtipo de la flota — generalización DISYUNTA y TOTAL (decisión del dueño
        2026-07-03): toda unidad es exactamente un subtipo. `ESCORT` = vehículo
        escolta (`public.escort_vehicles`, tabla nueva aditiva de la V003; el
        supertipo físico `fleet_units` llega en la fase flota/RRHH).

    FleetUnitRef:
      type: object
      description: |
        Referencia mínima a una unidad de flota. `id` es el id de la tabla del
        SUBTIPO — la dirección completa es el par `(kind, id)`.
      required: [kind, id, plate]
      properties:
        kind:  { $ref: '#/components/schemas/FleetUnitKind' }
        id:    { type: integer }
        plate: { type: string, minLength: 6, maxLength: 6, description: 'Placa de 6 caracteres SIN guión (estándar del dueño; la presentación lo agrega)', example: 'ABC123' }

    FleetUnitResponse:
      allOf:
        - $ref: '#/components/schemas/FleetUnitRef'
        - type: object
          required: [isActive]
          properties:
            brand:    { type: [string, 'null'], maxLength: 50 }
            model:    { type: [string, 'null'], maxLength: 50 }
            status:
              description: 'null en las escoltas: no participan de la asignación de viajes.'
              anyOf:
                - $ref: '#/components/schemas/FleetResourceStatus'
                - type: 'null'
            isActive: { type: boolean }

    FleetResourceStatus:
      type: string
      enum: [AVAILABLE, MAINTENANCE, NOT_AVAILABLE]
      description: |
        Disponibilidad del recurso (unidad de flota o conductor), en mayúsculas
        como el resto de los enums de la API. Donde el recurso puede no tenerla
        (las escoltas), la propiedad se declara admitiendo null.

    DriverRef:
      type: object
      description: |
        Referencia mínima a un conductor (`public.drivers`). El `id` es el que
        guarda la asignación del servicio; el nombre sale del trabajador asociado.
      required: [id, fullName]
      properties:
        id:       { type: integer }
        fullName: { type: string, example: 'Juan Pérez Huamán' }

    DriverResponse:
      allOf:
        - $ref: '#/components/schemas/DriverRef'
        - type: object
          required: [licenseNumber, status, isActive]
          properties:
            licenseNumber:   { type: string }
            licenseCategory: { type: [string, 'null'] }
            phone:           { type: [string, 'null'], pattern: '^\d{9}$' }
            status:          { $ref: '#/components/schemas/FleetResourceStatus' }
            isActive:        { type: boolean }

    # -------- Warehouse: catálogos del módulo ----------------------------------
    WarehouseProductCategoryResponse:
      type: object
      required: [id, name, isActive]
      properties:
        id:          { type: integer }
        name:        { type: string, maxLength: 100, example: 'Filtros' }
        description: { type: [string, 'null'] }
        isActive:    { type: boolean }

    WarehouseProductCategoryRequest:
      type: object
      required: [name]
      properties:
        name:        { type: string, minLength: 3, maxLength: 100 }
        description: { type: [string, 'null'] }

    WarehouseUnitOfMeasureResponse:
      type: object
      required: [id, code, name, isActive]
      properties:
        id:       { type: integer }
        code:     { type: string, maxLength: 10, example: 'GAL' }
        name:     { type: string, maxLength: 50, example: 'Galón' }
        isActive: { type: boolean }

    WarehouseSupplierResponse:
      type: object
      required: [id, name, isActive, createdAt]
      properties:
        id:          { type: integer }
        name:        { type: string, maxLength: 200, example: 'REPUESTOS DIÉSEL S.A.C.' }
        ruc:         { type: [string, 'null'], pattern: '^\d{11}$' }
        phone:       { type: [string, 'null'], pattern: '^\d{9}$', description: 'Canal peruano de 9 dígitos (estándar del dueño v9 CONFIRMADO, como clients)' }
        contactName: { type: [string, 'null'], maxLength: 100 }
        isActive:    { type: boolean }
        createdAt:   { type: string, format: date-time }

    WarehouseSupplierRequest:
      type: object
      required: [name]
      properties:
        name:        { type: string, minLength: 3, maxLength: 200 }
        ruc:         { type: [string, 'null'], pattern: '^\d{11}$' }
        phone:       { type: [string, 'null'], pattern: '^\d{9}$' }
        contactName: { type: [string, 'null'], maxLength: 100 }

    PageOfWarehouseSupplier:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/WarehouseSupplierResponse' }

    # -------- Warehouse: productos y stock --------------------------------------
    WarehouseProductSummary:
      type: object
      description: Referencia mínima a un producto para embeber en ítems, retiros y aperturas.
      required: [id, name, unitCode]
      properties:
        id:       { type: integer }
        code:     { type: [string, 'null'], maxLength: 30, example: 'PRO-0012' }
        name:     { type: string, maxLength: 200, example: 'Filtro de aceite XYZ' }
        unitCode: { type: string, maxLength: 10, description: 'Código de la unidad de medida (para pintar cantidades)', example: 'UND' }

    WarehouseProductRequest:
      type: object
      required: [name, categoryId, unitOfMeasureId]
      properties:
        name:            { type: string, minLength: 3, maxLength: 200, description: 'Único COMPUESTO con brand+partNumber (Δ-2, RN-WH10)' }
        categoryId:      { type: integer }
        unitOfMeasureId: { type: integer }
        brand:           { type: [string, 'null'], maxLength: 100 }
        partNumber:      { type: [string, 'null'], maxLength: 100 }
        attributes:
          type: object
          additionalProperties: { type: string }
          default: {}
          description: 'Características flexibles clave-valor (JSONB). Objeto libre; la UI lo edita como filas clave-valor.'
          example: { rosca: '3/4-16', viscosidad: '15W-40' }
        minStock:     { type: number, minimum: 0, default: 0, description: 'Umbral de reposición: stock < minStock → badge "Bajo" (RN-WH11)' }
        observations: { type: [string, 'null'] }
        isActive:     { type: boolean, default: true, description: 'Soft delete del catálogo. En el POST se ignora (siempre nace activo).' }

    WarehouseProductUpdateRequest:
      type: object
      description: >-
        Como WarehouseProductRequest pero SIN unitOfMeasureId: la unidad de
        medida se fija al crear y es inmutable (P-1 respondida por el dueño
        2026-07-04; su edición se evaluará más adelante).
      required: [name, categoryId]
      properties:
        name:            { type: string, minLength: 3, maxLength: 200, description: 'Único COMPUESTO con brand+partNumber (Δ-2, RN-WH10)' }
        categoryId:      { type: integer }
        brand:           { type: [string, 'null'], maxLength: 100 }
        partNumber:      { type: [string, 'null'], maxLength: 100 }
        attributes:
          type: object
          additionalProperties: { type: string }
          default: {}
          description: 'Características flexibles clave-valor (JSONB). Objeto libre; la UI lo edita como filas clave-valor.'
        minStock:     { type: number, minimum: 0, default: 0 }
        observations: { type: [string, 'null'] }
        isActive:     { type: boolean, default: true, description: 'Soft delete del catálogo.' }

    WarehouseProductResponse:
      type: object
      required: [id, code, name, category, unitOfMeasure, attributes, minStock, isActive, stock, lowStock, createdBy, createdAt, updatedAt]
      properties:
        id:   { type: integer }
        code: { type: string, maxLength: 30, description: 'SKU (autogenerado por el backend)' }
        name: { type: string, maxLength: 200 }
        category:
          type: object
          required: [id, name]
          properties:
            id:   { type: integer }
            name: { type: string }
        unitOfMeasure:
          type: object
          required: [id, code, name]
          properties:
            id:   { type: integer }
            code: { type: string }
            name: { type: string }
        brand:      { type: [string, 'null'], maxLength: 100 }
        partNumber: { type: [string, 'null'], maxLength: 100 }
        attributes:
          type: object
          additionalProperties: { type: string }
          description: 'Objeto JSON libre clave-valor (JSONB). Nunca `null` (default `{}`).'
        minStock:     { type: number, minimum: 0 }
        observations: { type: [string, 'null'] }
        isActive:     { type: boolean }
        stock:        { type: number, description: 'LEÍDO de la VIEW `almacen.product_stock` (RN-WH1 — nunca persistido, siempre exacto)' }
        lowStock:     { type: boolean, description: 'Derivado en código: `stock < minStock` (estricto). NO es columna.' }
        createdBy:    { $ref: '#/components/schemas/UserResponse' }
        createdAt:    { type: string, format: date-time }
        updatedAt:
          type: string
          format: date-time
          description: >-
            Versión del recurso (source del optimistic locking). Para el
            `If-Match` del PUT usar el header `ETag` del GET/PUT, NO este campo
            del body (difieren por µs entre memoria y BD → 412 espurio).

    PageOfWarehouseProduct:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/WarehouseProductResponse' }

    WarehouseProductStockResponse:
      type: object
      description: Lectura puntual del stock disponible (form de retiro, validación en vivo).
      required: [productId, stock, minStock, lowStock]
      properties:
        productId: { type: integer }
        stock:     { type: number, description: 'De la VIEW `almacen.product_stock`' }
        minStock:  { type: number }
        lowStock:  { type: boolean, description: 'Derivado: `stock < minStock`' }

    # -------- Warehouse: corte inicial ------------------------------------------
    WarehouseOpeningBalanceRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:    { type: integer }
        quantity:     { type: number, minimum: 0, description: 'Puede ser 0 (deja constancia del conteo)' }
        observations: { type: [string, 'null'] }

    WarehouseOpeningBalanceResponse:
      type: object
      required: [id, product, quantity, registeredBy, registeredAt]
      properties:
        id:           { type: integer }
        product:      { $ref: '#/components/schemas/WarehouseProductSummary' }
        quantity:     { type: number, minimum: 0 }
        observations: { type: [string, 'null'] }
        registeredBy: { $ref: '#/components/schemas/UserResponse' }
        registeredAt: { type: string, format: date-time }

    PageOfWarehouseOpeningBalance:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/WarehouseOpeningBalanceResponse' }

    # -------- Warehouse: kardex --------------------------------------------------
    WarehouseKardexMovementType:
      type: string
      enum: [APERTURA, ENTRADA, SALIDA]
      description: |
        Tipo de movimiento de la VIEW `almacen.stock_movements`: `APERTURA`
        (corte inicial, +), `ENTRADA` (ítem de factura activa, +), `SALIDA`
        (retiro activo, −). Valores en español porque son los literales de la
        VIEW del DDL congelado.

    WarehouseKardexMovementResponse:
      type: object
      required: [movementType, quantity, balance, movedAt, registeredBy, reference]
      properties:
        movementType: { $ref: '#/components/schemas/WarehouseKardexMovementType' }
        quantity:     { type: number, description: 'SIEMPRE positiva (el signo lo da movementType)' }
        balance:      { type: number, description: 'Saldo corrido DESPUÉS del movimiento (RN-WH13 — server-side sobre la historia completa)' }
        movedAt:      { type: string, format: date-time }
        sourceId:     { type: [integer, 'null'], description: 'Id del origen: factura (ENTRADA) o retiro (SALIDA); null para APERTURA' }
        reference:    { type: string, description: 'Etiqueta legible compuesta por el backend (es-PE). Ej: "Factura F001-00123 · REPUESTOS DIÉSEL S.A.C." o "Retiro · recibe Juan Pérez · ABC123"' }
        registeredBy: { $ref: '#/components/schemas/UserResponse' }

    PageOfWarehouseKardexMovement:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/WarehouseKardexMovementResponse' }

    # -------- Warehouse: comunes de edición/anulación ----------------------------
    WarehouseRecordStatus:
      type: string
      enum: [ACTIVE, CANCELLED]
      description: |
        Estado de entradas y retiros (columna + CHECK, patrón ratificado).
        `CANCELLED` = anulado con motivo/quién/cuándo (CHECK de consistencia en
        BD); no mueve stock/kardex/reportes pero queda visible en los listados.

    WarehouseEditTrace:
      type: object
      description: |
        Rastro del ÚLTIMO cambio — derivado del `FIELD_EDIT` más reciente en
        `almacen.audit_logs` (decisión D-10; el historial completo queda en la
        tabla, sin endpoint en fase 1 — pregunta abierta P-3).
      required: [by, at, reason]
      properties:
        by:     { $ref: '#/components/schemas/UserResponse' }
        at:     { type: string, format: date-time }
        reason: { type: string, description: 'Justificación dada al editar (≥ 10 caracteres)' }

    WarehouseCancelRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 500, description: 'Motivo de anulación (RN-WH3). Va a `cancel_reason` y a `almacen.audit_logs` (CANCELLED).' }

    # -------- Warehouse: entradas (facturas) -------------------------------------
    WarehouseInvoiceItemRequest:
      type: object
      required: [productId, quantity, unitPrice]
      properties:
        productId: { type: integer }
        quantity:  { type: number, exclusiveMinimum: 0 }
        unitPrice: { type: number, minimum: 0, description: 'En la moneda de la factura. Puede ser 0 (bonificación).' }

    WarehousePurchaseInvoiceRequest:
      type: object
      required: [supplierId, invoiceNumber, invoiceDate, currencyId, items]
      properties:
        supplierId:    { type: integer }
        invoiceNumber: { type: string, minLength: 1, maxLength: 50, example: 'F001-00123' }
        invoiceDate:   { type: string, format: date }
        guideNumber:   { type: [string, 'null'], maxLength: 50, description: 'Guía de remisión (1 factura → 1 guía; dato de finanzas)', example: 'T001-0004567' }
        currencyId:    { type: integer, description: 'Fija la moneda de la factura (RN-WH7 — reportes agregan por moneda, sin conversión)' }
        observations:  { type: [string, 'null'] }
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/WarehouseInvoiceItemRequest' }

    WarehousePurchaseInvoiceUpdateRequest:
      type: object
      description: |
        Body del PUT. **SIN `supplierId`** — el proveedor es INMUTABLE (RN-WH4:
        proveedor equivocado = anular y re-registrar). Los `items` REEMPLAZAN a
        los existentes.
      required: [invoiceNumber, invoiceDate, currencyId, items, reason]
      properties:
        invoiceNumber: { type: string, minLength: 1, maxLength: 50 }
        invoiceDate:   { type: string, format: date }
        guideNumber:   { type: [string, 'null'], maxLength: 50 }
        currencyId:    { type: integer }
        observations:  { type: [string, 'null'] }
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/WarehouseInvoiceItemRequest' }
        reason: { type: string, minLength: 10, maxLength: 500, description: 'Justificación de la edición (RN-WH4). Va a `almacen.audit_logs` con el diff por campo.' }

    WarehouseInvoiceItemResponse:
      type: object
      required: [id, product, quantity, unitPrice, subtotal]
      properties:
        id:        { type: integer }
        product:   { $ref: '#/components/schemas/WarehouseProductSummary' }
        quantity:  { type: number }
        unitPrice: { type: number }
        subtotal:  { type: number, description: '`quantity * unitPrice` — derivado en código, no persistido' }

    WarehousePurchaseInvoiceResponse:
      type: object
      required: [id, supplier, invoiceNumber, invoiceDate, currency, items, total, status, registeredBy, createdAt, updatedAt]
      properties:
        id: { type: integer }
        supplier:
          type: object
          required: [id, name]
          properties:
            id:   { type: integer }
            name: { type: string }
            ruc:  { type: [string, 'null'], pattern: '^\d{11}$' }
        invoiceNumber: { type: string }
        invoiceDate:   { type: string, format: date }
        guideNumber:   { type: [string, 'null'] }
        currency:
          type: object
          required: [id, code, symbol]
          properties:
            id:     { type: integer }
            code:   { type: string, pattern: '^[A-Z]{3}$', example: 'PEN' }
            symbol: { type: string, maxLength: 5, example: 'S/' }
        observations: { type: [string, 'null'] }
        items:
          type: array
          items: { $ref: '#/components/schemas/WarehouseInvoiceItemResponse' }
        total:        { type: number, description: 'Σ items.subtotal en la moneda de la factura — derivado en código, NUNCA persistido (patrón v2)' }
        status:       { $ref: '#/components/schemas/WarehouseRecordStatus' }
        cancelReason: { type: [string, 'null'], description: 'Presente solo si status=CANCELLED' }
        cancelledBy:
          anyOf:
            - $ref: '#/components/schemas/UserResponse'
            - type: 'null'
        cancelledAt: { type: [string, 'null'], format: date-time }
        lastEdit:
          anyOf:
            - $ref: '#/components/schemas/WarehouseEditTrace'
            - type: 'null'
        registeredBy: { $ref: '#/components/schemas/UserResponse' }
        createdAt:    { type: string, format: date-time }
        updatedAt:    { type: string, format: date-time, description: 'Source de la versión — usar el header ETag opaco en If-Match, NO este valor (lección de cotizaciones)' }

    WarehousePurchaseInvoiceSummary:
      type: object
      description: Fila del listado de Entradas.
      required: [id, supplier, invoiceNumber, invoiceDate, currencyCode, itemsCount, total, status, registeredBy, createdAt]
      properties:
        id: { type: integer }
        supplier:
          type: object
          required: [id, name]
          properties:
            id:   { type: integer }
            name: { type: string }
        invoiceNumber: { type: string }
        invoiceDate:   { type: string, format: date }
        guideNumber:   { type: [string, 'null'] }
        currencyCode:  { type: string, pattern: '^[A-Z]{3}$' }
        itemsCount:    { type: integer }
        total:         { type: number, description: 'Derivado de los ítems (no persistido)' }
        status:        { $ref: '#/components/schemas/WarehouseRecordStatus' }
        cancelReason:  { type: [string, 'null'] }
        registeredBy:  { $ref: '#/components/schemas/UserResponse' }
        createdAt:     { type: string, format: date-time }

    PageOfWarehousePurchaseInvoiceSummary:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/WarehousePurchaseInvoiceSummary' }

    # -------- Warehouse: retiros ---------------------------------------------------
    WarehouseWithdrawalRequest:
      type: object
      description: |
        RN-WH2: `receivedByWorkerId` SIEMPRE obligatorio; unidad destino OPCIONAL
        y a lo sumo UNA (`tractorId` | `trailerId` | `escortVehicleId` — subtipos
        disyuntos, CHECK en BD; más de una → 400 WH-005). `withdrawnAt` lo asigna
        el server.
      required: [productId, quantity, receivedByWorkerId]
      properties:
        productId:          { type: integer }
        quantity:           { type: number, exclusiveMinimum: 0, description: '> 0 y ≤ stock disponible (en transacción → 409 WH-001)' }
        receivedByWorkerId: { type: integer, description: 'Quién recibe (FK public.workers). Obligatorio.' }
        tractorId:          { type: [integer, 'null'] }
        trailerId:          { type: [integer, 'null'] }
        escortVehicleId:    { type: [integer, 'null'] }
        observations:       { type: [string, 'null'] }

    WarehouseWithdrawalUpdateRequest:
      type: object
      description: |
        Body del PUT. **SIN `productId`** — el producto es INMUTABLE (RN-WH4:
        producto equivocado = anular y crear otro). La unidad de flota se
        REEMPLAZA (los tres campos `null` la quitan; a lo sumo una).
      required: [quantity, receivedByWorkerId, reason]
      properties:
        quantity:           { type: number, exclusiveMinimum: 0, description: 'Subirla valida contra el disponible SIN contar este retiro (409 WH-001); bajarla siempre es segura' }
        receivedByWorkerId: { type: integer }
        tractorId:          { type: [integer, 'null'] }
        trailerId:          { type: [integer, 'null'] }
        escortVehicleId:    { type: [integer, 'null'] }
        observations:       { type: [string, 'null'] }
        reason:             { type: string, minLength: 10, maxLength: 500, description: 'Justificación de la edición (RN-WH4). Va a `almacen.audit_logs`.' }

    WarehouseWithdrawalResponse:
      type: object
      required: [id, product, quantity, withdrawnAt, receivedBy, status, registeredBy, updatedAt]
      properties:
        id:          { type: integer }
        product:     { $ref: '#/components/schemas/WarehouseProductSummary' }
        quantity:    { type: number }
        withdrawnAt: { type: string, format: date-time, description: 'Lo asigna el server al registrar' }
        receivedBy:  { $ref: '#/components/schemas/WorkerResponse' }
        fleetUnit:
          anyOf:
            - $ref: '#/components/schemas/FleetUnitRef'
            - type: 'null'
          description: 'Unidad destino (a lo sumo una); null si el retiro no se asignó a una unidad'
        observations: { type: [string, 'null'] }
        status:       { $ref: '#/components/schemas/WarehouseRecordStatus' }
        cancelReason: { type: [string, 'null'], description: 'Presente solo si status=CANCELLED' }
        cancelledBy:
          anyOf:
            - $ref: '#/components/schemas/UserResponse'
            - type: 'null'
        cancelledAt: { type: [string, 'null'], format: date-time }
        lastEdit:
          anyOf:
            - $ref: '#/components/schemas/WarehouseEditTrace'
            - type: 'null'
        registeredBy: { $ref: '#/components/schemas/UserResponse' }
        updatedAt:    { type: string, format: date-time, description: 'Source de la versión — usar el header ETag opaco en If-Match' }

    PageOfWarehouseWithdrawal:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/WarehouseWithdrawalResponse' }

    # -------- Warehouse: dashboard y reportes ---------------------------------------
    WarehouseStatsResponse:
      type: object
      description: KPIs del strip de Existencias. Mes calendario en curso (América/Lima); solo ACTIVOS.
      required: [activeProducts, lowStockCount, entriesThisMonth, withdrawalsThisMonth]
      properties:
        activeProducts:       { type: integer }
        lowStockCount:        { type: integer, description: 'Productos activos con stock < minStock (RN-WH11)' }
        entriesThisMonth:     { type: integer, description: 'Facturas ACTIVAS registradas este mes' }
        withdrawalsThisMonth: { type: integer, description: 'Retiros ACTIVOS registrados este mes' }

    WarehouseReportCut:
      type: string
      enum: [BY_UNIT, BY_PERIOD, BY_PRODUCT, BY_SUPPLIER]
      description: |
        Corte del reporte (los 4 de la pantalla Reportes):
        - `BY_UNIT`: consumo por unidad de flota (retiros sin unidad → fila "Sin unidad asignada")
        - `BY_PERIOD`: consumo por semana (lunes como clave, en `detail`)
        - `BY_PRODUCT`: consumo por producto (`count` = unidades retiradas)
        - `BY_SUPPLIER`: compras por proveedor (facturas activas por `invoiceDate`)

    WarehouseReportRowResponse:
      type: object
      description: |
        Fila agregada. RN-WH7 — bi-moneda SIN conversión: `amountPEN` y
        `amountUSD` acumulan por separado según la moneda registrada (hoy el
        catálogo activo es PEN + USD — decisión D-6; agregar una moneda = cambio
        de contrato).
      required: [label, count, amountPEN, amountUSD]
      properties:
        label:     { type: string, description: 'Etiqueta del grupo (ej: "Tracto ABC123", "Semana del 22/06", producto, proveedor)' }
        detail:    { type: [string, 'null'], description: 'Dato secundario (unidad de medida en BY_PRODUCT, fecha ISO del lunes en BY_PERIOD)' }
        count:     { type: number, description: 'Nº de movimientos (o unidades retiradas en BY_PRODUCT)' }
        amountPEN: { type: number, description: 'Valorización de referencia en PEN (salidas: último precio de compra del producto)' }
        amountUSD: { type: number, description: 'Valorización de referencia en USD' }

    WarehouseReportResponse:
      type: object
      required: [cut, dateFrom, dateTo, rows, totalPEN, totalUSD, totalCount]
      properties:
        cut:      { $ref: '#/components/schemas/WarehouseReportCut' }
        dateFrom: { type: string, format: date }
        dateTo:   { type: string, format: date }
        rows:
          type: array
          description: 'Orden: BY_PERIOD cronológico ASC; el resto por monto total DESC. Lista vacía si no hubo movimientos (nunca null).'
          items: { $ref: '#/components/schemas/WarehouseReportRowResponse' }
        totalPEN:   { type: number }
        totalUSD:   { type: number }
        totalCount: { type: number }

    # -------- Operations: servicios de transporte ------------------------------
    ServiceStatus:
      type: string
      enum: [PENDING_ASSIGNMENT, PENDING_START, IN_PROGRESS, COMPLETED, CANCELLED, DELETED]
      description: |
        Ciclo de vida del servicio (RN-OP1):
        `PENDING_ASSIGNMENT → PENDING_START → IN_PROGRESS → COMPLETED`;
        `CANCELLED` desde cualquiera de los tres no terminales; `DELETED` solo
        desde los dos pendientes.

        - `PENDING_ASSIGNMENT`: registrado, todavía sin conductor ni unidad.
        - `PENDING_START`: con recursos asignados, esperando salir.
        - `IN_PROGRESS`: en ruta.
        - `COMPLETED`: terminado (sigue siendo editable con justificación).
        - `CANCELLED`: terminal e inmutable; viaje real que se abortó.
        - `DELETED`: terminal e inmutable; registro que nunca debió existir
          (error de digitación). Excluido por defecto del listado y de los
          indicadores; se consulta solo con el filtro `status=DELETED`.

    TripScope:
      type: string
      enum: [LOCAL, PROVINCIA]
      description: |
        Ámbito del viaje. Dominio cerrado sin catálogo administrable: viaja como
        enum y la base de datos lo fija con una restricción, igual que el estado.
        No hay endpoint de ámbitos — el selector de la interfaz sale de este enum.

    ServiceEventType:
      type: string
      enum: [CREATED, ASSIGNMENT, STATUS_CHANGE, FIELD_EDIT, NOTE]
      description: |
        Tipo de la entrada de bitácora, para que la interfaz la muestre con su
        etiqueta sin interpretar el texto. Las entradas heredadas del sistema
        anterior llegan como `NOTE`.

    ServiceSummaryResponse:
      type: object
      description: |
        Fila del listado. `price` y `currencyCode` están AUSENTES (no en null)
        para el rol `dispatcher`, RN-OP8. `driver` y `tractor` también pueden
        estar ausentes, pero por otra razón: el servicio todavía no tiene
        recursos asignados (los tiene recién desde `PENDING_START`). Origen y
        destino viajan separados porque la tabla los muestra en dos líneas.
      required: [id, code, client, origin, destination, tentativeDate, tripScope, status, createdAt]
      properties:
        id:            { type: integer, format: int64 }
        code:          { type: string, example: 'SRV-0042' }
        client:        { $ref: '#/components/schemas/ClientRef' }
        origin:        { type: string, maxLength: 255 }
        destination:   { type: string, maxLength: 255 }
        tentativeDate: { type: string, format: date }
        tripScope:     { $ref: '#/components/schemas/TripScope' }
        status:        { $ref: '#/components/schemas/ServiceStatus' }
        driver:        { $ref: '#/components/schemas/DriverRef' }
        tractor:       { $ref: '#/components/schemas/FleetUnitRef' }
        price:         { type: number, format: double, description: 'Ausente para dispatcher (RN-OP8)' }
        currencyCode:  { type: string, enum: [PEN, USD], description: 'Ausente para dispatcher (RN-OP8)' }
        createdAt:     { type: string, format: date-time }

    PageOfServiceSummary:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/ServiceSummaryResponse' }

    ServiceAdditionalResourceResponse:
      type: object
      description: Recurso sumado al viaje ya en ruta (relevo, apoyo), con su motivo.
      required: [id, reason, assignedBy, assignedAt]
      properties:
        id:         { type: integer, format: int64 }
        driver:     { $ref: '#/components/schemas/DriverRef' }
        tractor:    { $ref: '#/components/schemas/FleetUnitRef' }
        trailer:    { $ref: '#/components/schemas/FleetUnitRef' }
        reason:     { type: string, maxLength: 500 }
        assignedBy: { $ref: '#/components/schemas/UserRef' }
        assignedAt: { type: string, format: date-time }

    ServiceEventResponse:
      type: object
      description: Entrada de la bitácora del servicio (una fila por acción).
      required: [id, eventType, note, createdBy, createdAt]
      properties:
        id:        { type: integer, format: int64 }
        eventType: { $ref: '#/components/schemas/ServiceEventType' }
        note:      { type: string }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }

    ServiceDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ServiceSummaryResponse'
        - type: object
          required: [cargoType, weightKg, additionalResources, events, createdBy, updatedAt]
          properties:
            cargoType:     { $ref: '#/components/schemas/CargoTypeRef' }
            weightKg:      { type: number, format: double }
            lengthM:       { type: [number, 'null'], format: double }
            widthM:        { type: [number, 'null'], format: double }
            heightM:       { type: [number, 'null'], format: double }
            observations:  { type: [string, 'null'], maxLength: 500 }
            trailer:       { $ref: '#/components/schemas/FleetUnitRef' }
            startDateTime: { type: [string, 'null'], format: date-time }
            endDateTime:   { type: [string, 'null'], format: date-time }
            additionalResources:
              type: array
              items: { $ref: '#/components/schemas/ServiceAdditionalResourceResponse' }
            events:
              type: array
              description: Bitácora en orden cronológico ascendente
              items: { $ref: '#/components/schemas/ServiceEventResponse' }
            createdBy: { $ref: '#/components/schemas/UserRef' }
            updatedAt: { type: string, format: date-time }

    ServiceCreateRequest:
      type: object
      required: [clientId, tripScope, tentativeDate, origin, destination, cargoTypeId, weightKg, price, currencyId]
      properties:
        clientId:      { type: integer }
        tripScope:     { $ref: '#/components/schemas/TripScope' }
        tentativeDate: { type: string, format: date, description: 'Puede ser pasada (registro retroactivo, RN-OP9)' }
        origin:        { type: string, minLength: 1, maxLength: 255 }
        destination:   { type: string, minLength: 1, maxLength: 255 }
        cargoTypeId:   { type: integer }
        weightKg:      { type: number, format: double, exclusiveMinimum: 0 }
        lengthM:       { type: [number, 'null'], format: double, exclusiveMinimum: 0 }
        widthM:        { type: [number, 'null'], format: double, exclusiveMinimum: 0 }
        heightM:       { type: [number, 'null'], format: double, exclusiveMinimum: 0 }
        price:         { type: number, format: double, exclusiveMinimum: 0, description: 'Mayor que cero: un viaje siempre tiene precio' }
        currencyId:    { type: integer }
        observations:  { type: [string, 'null'], maxLength: 500 }

    ServiceUpdateRequest:
      type: object
      description: |
        RN-OP6 — cliente, ámbito del viaje y tipo de carga NO viajan: son
        inmutables después del alta. `justification` es obligatoria (10
        caracteres o más). RN-OP10 — sin cambios reales, la respuesta es 200 y no
        se escribe nada. Las fechas reales son opcionales y solo CORRIGEN un
        valor que el servicio ya tiene (ver el endpoint).
      required: [tentativeDate, origin, destination, weightKg, price, currencyId, justification]
      properties:
        tentativeDate: { type: string, format: date }
        origin:        { type: string, minLength: 1, maxLength: 255 }
        destination:   { type: string, minLength: 1, maxLength: 255 }
        weightKg:      { type: number, format: double, exclusiveMinimum: 0 }
        lengthM:       { type: [number, 'null'], format: double, exclusiveMinimum: 0 }
        widthM:        { type: [number, 'null'], format: double, exclusiveMinimum: 0 }
        heightM:       { type: [number, 'null'], format: double, exclusiveMinimum: 0 }
        price:         { type: number, format: double, exclusiveMinimum: 0, description: 'Mayor que cero: un viaje siempre tiene precio' }
        currencyId:    { type: integer }
        observations:  { type: [string, 'null'], maxLength: 500 }
        startDateTime: { type: string, format: date-time, description: 'Corrección del inicio real; solo si el servicio ya lo tiene (en ruta o completado). Ausente = sin cambio; NO acepta null: una fecha real nunca se borra' }
        endDateTime:   { type: string, format: date-time, description: 'Corrección del fin real; solo en completado, y >= inicio (RN-OP13). Ausente = sin cambio; NO acepta null' }
        justification: { type: string, minLength: 10, maxLength: 500 }

    AssignResourcesRequest:
      type: object
      description: RN-OP2 — conductor y tracto obligatorios, carreta opcional.
      required: [driverId, tractorId]
      properties:
        driverId:  { type: integer }
        tractorId: { type: integer }
        trailerId: { type: [integer, 'null'] }
        note:      { type: [string, 'null'], maxLength: 500 }
        force:     { type: boolean, default: false, description: 'true = asigna pese al conflicto OPS-002; queda registrado en la bitácora' }

    ChangeStatusRequest:
      type: object
      required: [target]
      properties:
        target:
          type: string
          enum: [IN_PROGRESS, COMPLETED, CANCELLED, DELETED]
        dateTime:
          type: [string, 'null']
          format: date-time
          description: 'Inicio o fin real; por defecto, ahora. Solo aplica al iniciar o finalizar (se ignora al cancelar o eliminar). Al finalizar debe ser posterior o igual al inicio (RN-OP13).'
        note:
          type: [string, 'null']
          maxLength: 500
          description: 'Opcional al iniciar o finalizar; OBLIGATORIA (10 caracteres o más) al cancelar o eliminar (RN-OP7).'

    AddResourcesRequest:
      type: object
      description: Al menos uno de `driverId`, `tractorId` o `trailerId`; si no viene ninguno, 400.
      required: [reason]
      properties:
        driverId:  { type: [integer, 'null'] }
        tractorId: { type: [integer, 'null'] }
        trailerId: { type: [integer, 'null'] }
        reason:    { type: string, minLength: 10, maxLength: 500 }
        force:     { type: boolean, default: false }

    ServiceStatsResponse:
      type: object
      required: [pendingAssignment, pendingStart, inProgress, completedThisWeek, driversOnRoad, unitsOnRoad, weekCycle]
      properties:
        pendingAssignment: { type: integer }
        pendingStart:      { type: integer }
        inProgress:        { type: integer }
        completedThisWeek: { type: integer, description: 'Ciclo operativo miércoles→martes, América/Lima (RN-OP14)' }
        driversOnRoad:
          type: object
          required: [active, total]
          properties:
            active: { type: integer }
            total:  { type: integer }
        unitsOnRoad:
          type: object
          required: [active, total]
          properties:
            active: { type: integer }
            total:  { type: integer }
        weekCycle:
          type: object
          required: [start, end]
          properties:
            start: { type: string, format: date }
            end:   { type: string, format: date }

    ServicesReportRowResponse:
      type: object
      required: [serviceId, code, clientName, tripScope, origin, destination, startDateTime, endDateTime, price, currencyCode, principalDriver, additionalDrivers]
      properties:
        serviceId:       { type: integer, format: int64 }
        code:            { type: string }
        clientName:      { type: string }
        tripScope:       { $ref: '#/components/schemas/TripScope' }
        origin:          { type: string }
        destination:     { type: string }
        startDateTime:   { type: string, format: date-time }
        endDateTime:     { type: string, format: date-time }
        price:           { type: number, format: double }
        currencyCode:    { type: string, enum: [PEN, USD] }
        principalDriver: { type: string }
        additionalDrivers:
          type: array
          description: Conductores sumados en ruta, con el motivo de cada relevo.
          items:
            type: object
            required: [name, reason]
            properties:
              name:   { type: string }
              reason: { type: string }

    ServicesReportTotalsResponse:
      type: object
      description: Una fila por moneda, sin conversión (mismo criterio que el reporte de almacén).
      required: [currencyCode, totalServices, totalRevenue]
      properties:
        currencyCode:  { type: string, enum: [PEN, USD] }
        totalServices: { type: integer }
        totalRevenue:  { type: number, format: double }

    ServicesReportResponse:
      type: object
      required: [from, to, rows, totals]
      properties:
        from: { type: string, format: date }
        to:   { type: string, format: date }
        rows:
          type: array
          description: Lista vacía si no hubo servicios completados en el rango (nunca null).
          items: { $ref: '#/components/schemas/ServicesReportRowResponse' }
        totals:
          type: array
          items: { $ref: '#/components/schemas/ServicesReportTotalsResponse' }

    ServiceResourceConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          description: |
            Extensión del error para `OPS-002`: le dice a la interfaz que el
            conflicto se puede forzar y qué recurso está ocupado.
          properties:
            forcible: { type: boolean, description: 'true solo en OPS-002' }
            conflicts:
              type: array
              items:
                type: object
                required: [resource, resourceName, serviceCode, serviceStatus]
                properties:
                  resource:      { type: string, enum: [DRIVER, TRACTOR, TRAILER] }
                  resourceName:  { type: string, description: 'Nombre del conductor o placa de la unidad' }
                  serviceCode:   { type: string, example: 'SRV-0042' }
                  serviceStatus:
                    type: string
                    enum: [PENDING_START, IN_PROGRESS]
                    description: |
                      Estado del servicio que retiene el recurso. Solo estos dos:
                      antes de asignar no hay recursos, y los terminales
                      (completado, cancelado, eliminado) ya los liberaron.
